<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carré Côté - Plan interactif</title>


    <style>

        /* =====================================================
           PAGE
           ===================================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background: #eeeeee;

        }


        /* =====================================================
           PLAN
           ===================================================== */

        .plan-container {

            position: relative;

            width: 100%;

            max-width: 1400px;

            margin: 0 auto;

        }


        .plan {

            width: 100%;

            height: auto;

            display: block;

        }


        /* =====================================================
           PASTILLES
           ===================================================== */

        .hotspot {

            position: absolute;

            width: 1%;

            aspect-ratio: 1 / 1;

            border-radius: 50%;

            border: 1px solid white;

            cursor: pointer;

            transform:
                translate(-50%, -50%);

            transition:
                transform 0.15s ease;

            z-index: 10;

            touch-action: manipulation;

            user-select: none;

            -webkit-user-select: none;

        }


        /* Survol uniquement sur ordinateur */

        @media (hover: hover) {

            .hotspot:hover {

                transform:
                    translate(-50%, -50%)
                    scale(1.5);

            }

        }


        /* =====================================================
           COULEURS DES PASTILLES
           ===================================================== */

        .vasque {

            background: #4d8acb;

        }


        .wc {

            background: #d9534f;

        }


        .douche {

            background: #4caf7a;

        }


        .sol-mur {

            background: #df9629;

        }


        /* =====================================================
           FENÊTRE D'INFORMATION
           ===================================================== */

        .info-box {

            display: none;

            position: fixed;

            width: 450px;

            max-width:
                calc(100vw - 30px);

            max-height:
                calc(100vh - 30px);

            overflow-y: auto;

            overflow-x: hidden;

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-sizing: border-box;

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.25);

            z-index: 1000;

            -webkit-overflow-scrolling: touch;

            /*
             * Autorise le défilement vertical
             * dans la fiche sur téléphone.
             */

            touch-action: pan-y;

        }


        /* =====================================================
           TITRES
           ===================================================== */

        .info-box h2 {

            margin-top: 0;

            padding-right: 30px;

            font-size: 22px;

        }


        .info-box h3 {

            margin-top: 20px;

            margin-bottom: 6px;

            font-size: 16px;

        }


        .info-box p {

            margin-top: 0;

            line-height: 1.5;

            font-size: 14px;

        }


        /* =====================================================
           BOUTON FERMER
           ===================================================== */

        .close {

            position: absolute;

            right: 15px;

            top: 10px;

            width: 30px;

            height: 30px;

            font-size: 25px;

            line-height: 30px;

            text-align: center;

            cursor: pointer;

            color: #333;

            z-index: 10;

            touch-action: manipulation;

        }


        /* =====================================================
           TABLETTE
           ===================================================== */

        @media (max-width: 900px) {

            .info-box {

                width: 360px;

                max-width:
                    calc(100vw - 30px);

                max-height:
                    calc(100vh - 30px);

                padding: 20px;

            }


            .info-box h2 {

                font-size: 20px;

            }


            .info-box h3 {

                font-size: 15px;

            }


            .info-box p {

                font-size: 14px;

            }

        }


        /* =====================================================
           TELEPHONE
           ===================================================== */

        @media (max-width: 600px) {

            .info-box {

                width: 280px;

                max-width:
                    calc(100vw - 20px);

                max-height:
                    calc(100vh - 20px);

                padding: 16px;

                border-radius: 10px;

            }


            .info-box h2 {

                font-size: 18px;

            }


            .info-box h3 {

                font-size: 14px;

                margin-top: 16px;

            }


            .info-box p {

                font-size: 13px;

                line-height: 1.4;

            }


            .close {

                right: 10px;

                top: 8px;

                font-size: 22px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     PLAN
     ========================================================= -->

<div class="plan-container">


    <img
        src="PCG AYREM - RDC ind2 - 2026-07-02.png"
        class="plan"
        id="plan"
        alt="Plan RDC"
    >


    <!-- =====================================================
         VASQUE
         ===================================================== -->

    <div
        class="hotspot vasque"
        style="left: 55%; top: 30%;"
        onclick="showInfo('vasque', this)"
        title="Vasque"
    ></div>


    <!-- =====================================================
         WC
         ===================================================== -->

    <div
        class="hotspot wc"
        style="left: 58%; top: 25%;"
        onclick="showInfo('wc', this)"
        title="WC"
    ></div>


    <!-- =====================================================
         DOUCHE
         ===================================================== -->

    <div
        class="hotspot douche"
        style="left: 56%; top: 26%;"
        onclick="showInfo('douche', this)"
        title="Douche"
    ></div>


    <!-- =====================================================
         SOL ET MUR
         ===================================================== -->

    <div
        class="hotspot sol-mur"
        style="left: 58%; top: 30%;"
        onclick="showInfo('sol-mur', this)"
        title="Sol et mur"
    ></div>


</div>



<!-- =========================================================
     FENÊTRE D'INFORMATION
     ========================================================= -->

<div
    class="info-box"
    id="infoBox"
>

    <span
        class="close"
        onclick="closeInfo()"
    >
        ×
    </span>


    <div id="infoContent"></div>

</div>



<script>


/* ============================================================
   CONTENU DES FICHES
   ============================================================ */

function getInfoContent(type) {

            </p>

            <h3>Vasque</h3>

                Référence : XXX
            </p>

            <h3>Mitigeur</h3>

                Référence : XXX
            </p>

            <h3>Miroir</h3>

    }


    /* ========================================================

    if (type === "wc") {

            </p>

    }


    /* ========================================================

    if (type === "douche") {

            </p>

            <h3>Mitigeur</h3>

            <p>

            </p>

            <h3>Colonne de douche</h3>

            <p>

            </p>

            <h3>Faïence</h3>

                Format : 60 × 120 cm
            </p>

    }


    /* ========================================================
       SOL ET MUR
       ======================================================== */

    if (type === "sol-mur") {

        content = `

            <h2>Sol et mur — SDB 01</h2>

            <h3>Carrelage</h3>

            <p>
                Carrelage 60 × 60 cm<br>

            </p>

            <h3>Faïence</h3>

            <p>
                Faïence douche 60 × 120 cm<br>

            <h3>Crédence</h3>

            </p>

    }


    return content;

}



/* ============================================================
   OUVERTURE DE LA FICHE
   ============================================================ */

function showInfo(type, hotspot) {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    const infoContent =
        document.getElementById(
            "infoContent"
        );


    /*
     * Chargement du contenu
     */

    infoContent.innerHTML =
        getInfoContent(type);


    /*
     * Affichage temporaire.
     *
     * Cela permet de connaître
     * les dimensions réelles de la fiche.
     */

    infoBox.style.display =
        "block";


    /*
     * On positionne la fiche
     * par rapport à la pastille.
     */

    positionInfoBox(hotspot);

}



/* ============================================================
   POSITIONNEMENT DE LA FICHE PAR RAPPORT À LA PASTILLE
   ============================================================ */

function positionInfoBox(hotspot) {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    /*
     * Position réelle de la pastille
     * à l'écran.
     *
     * IMPORTANT :
     *
     * getBoundingClientRect()
     * tient compte du zoom et du
     * déplacement effectué par
     * l'utilisateur.
     */

    const hotspotRect =
        hotspot.getBoundingClientRect();


    /*
     * Dimensions de la fiche.
     */

    const boxWidth =
        infoBox.offsetWidth;


    const boxHeight =
        infoBox.offsetHeight;


    /*
     * Dimensions de la fenêtre
     * réellement visible.
     */

    const viewportWidth =
        window.innerWidth;


    const viewportHeight =
        window.innerHeight;


    /*
     * Espace entre la pastille
     * et la fiche.
     */

    const gap = 15;


    /*
     * Centre de la pastille.
     */

    const hotspotCenterX =
        hotspotRect.left +
        hotspotRect.width / 2;


    const hotspotCenterY =
        hotspotRect.top +
        hotspotRect.height / 2;


    /*
     * ========================================================
     * POSITION HORIZONTALE
     * ========================================================
     */


    let left;


    /*
     * On essaie d'abord de placer
     * la fiche à droite.
     */

    if (
        hotspotCenterX +
        hotspotRect.width / 2 +
        gap +
        boxWidth
        <=
        viewportWidth
    ) {

        left =
            hotspotRect.right +
            gap;

    }

    /*
     * Sinon, on essaie à gauche.
     */

    else if (
        hotspotRect.left -
        gap -
        boxWidth
        >=
        0
    ) {

        left =
            hotspotRect.left -
            gap -
            boxWidth;

    }

    /*
     * Si elle ne tient ni à droite
     * ni à gauche, on la centre.
     */

    else {

        left =
            (
                viewportWidth -
                boxWidth
            ) / 2;

    }


    /*
     * ========================================================
     * POSITION VERTICALE
     * ========================================================
     */


    let top;


    /*
     * On essaie d'abord d'aligner
     * le haut de la fiche avec
     * la pastille.
     */

    top =
        hotspotCenterY -
        boxHeight / 2;


    /*
     * Si la fiche dépasse en haut,
     * on la descend.
     */

    if (
        top < 10
    ) {

        top = 10;

    }


    /*
     * Si elle dépasse en bas,
     * on la remonte.
     */

    if (
        top +
        boxHeight >
        viewportHeight -
        10
    ) {

        top =
            viewportHeight -
            boxHeight -
            10;

    }


    /*
     * Sécurité horizontale.
     */

    if (
        left < 10
    ) {

        left = 10;

    }


    if (
        left +
        boxWidth >
        viewportWidth -
        10
    ) {

        left =
            viewportWidth -
            boxWidth -
            10;

    }


    /*
     * Application de la position.
     */

    infoBox.style.left =
        left + "px";


    infoBox.style.top =
        top + "px";

}



/* ============================================================
   FERMETURE
   ============================================================ */

function closeInfo() {


    document.getElementById(
        "infoBox"
    ).style.display =
        "none";

}



/* ============================================================
   FERMETURE AVEC LA TOUCHE ESC
   ============================================================ */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeInfo();

        }

    }
);


</script>


</body>

</html>
