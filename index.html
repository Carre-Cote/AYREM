<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Carré Côté - Plan interactif</title>


<style>

/* =========================================================
   PAGE
   ========================================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    font-family: Arial, sans-serif;

    background: #eeeeee;

}


/* =========================================================
   ZONE DU PLAN
   ========================================================= */

.plan-viewer {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #eeeeee;

    cursor: grab;

    touch-action: none;

}


.plan-viewer.dragging {

    cursor: grabbing;

}


/* =========================================================
   CONTENEUR DU PLAN
   ========================================================= */

.plan-container {

    position: absolute;

    left: 0;
    top: 0;

    transform-origin: 0 0;

    will-change: transform;

}


/* =========================================================
   IMAGE
   ========================================================= */

.plan {

    display: block;

    width: 100%;

    height: auto;

    user-select: none;

    -webkit-user-select: none;

    pointer-events: none;

}


/* =========================================================
   PASTILLES
   ========================================================= */

.hotspot {

    position: absolute;

    width: 1%;

    aspect-ratio: 1 / 1;

    border-radius: 50%;

    border: 1px solid white;

    cursor: pointer;

    transform:
        translate(-50%, -50%);

    z-index: 20;

    box-sizing: border-box;

    touch-action: manipulation;

}


@media (hover: hover) {

    .hotspot:hover {

        transform:
            translate(-50%, -50%)
            scale(1.5);

    }

}


/* =========================================================
   COULEURS DES PASTILLES
   ========================================================= */

.vasque {

    background: #4d8acb;

}


.wc {

    background: #d9534f;

}


.douche {

    background: #4caf7a;

}


.sol-mur {

    background: #df9629;

}


/* =========================================================
   FENÊTRE D'INFORMATION
   ========================================================= */

.info-box {

    display: none;

    position: fixed;

    width: 450px;

    max-width:
        calc(100vw - 30px);

    max-height:
        calc(100vh - 30px);

    padding: 25px;

    box-sizing: border-box;

    background: white;

    border-radius: 12px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.25);

    z-index: 1000;

    overflow-y: auto;

    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    touch-action: pan-y;

}


/* =========================================================
   TEXTE
   ========================================================= */

.info-box h2 {

    margin-top: 0;

    padding-right: 30px;

    font-size: 22px;

}


.info-box h3 {

    margin-top: 20px;

    margin-bottom: 6px;

    font-size: 16px;

}


.info-box p {

    margin-top: 0;

    line-height: 1.5;

    font-size: 14px;

}


/* =========================================================
   FERMER
   ========================================================= */

.close {

    position: absolute;

    right: 12px;

    top: 8px;

    width: 30px;

    height: 30px;

    line-height: 30px;

    text-align: center;

    font-size: 25px;

    cursor: pointer;

    z-index: 10;

}


/* =========================================================
   TABLETTE
   ========================================================= */

@media (max-width: 900px) {

    .info-box {

        width: 360px;

        max-width:
            calc(100vw - 30px);

        padding: 20px;

    }


    .info-box h2 {

        font-size: 20px;

    }


    .info-box h3 {

        font-size: 15px;

    }


    .info-box p {

        font-size: 14px;

    }

}


/* =========================================================
   TELEPHONE
   ========================================================= */

@media (max-width: 600px) {

    .info-box {

        width: 280px;

        max-width:
            calc(100vw - 20px);

        max-height:
            calc(100vh - 20px);

        padding: 16px;

        border-radius: 10px;

    }


    .info-box h2 {

        font-size: 18px;

    }


    .info-box h3 {

        font-size: 14px;

        margin-top: 16px;

    }


    .info-box p {

        font-size: 13px;

        line-height: 1.4;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     PLAN
     ========================================================= -->

<div
    class="plan-viewer"
    id="planViewer"
>


    <div
        class="plan-container"
        id="planContainer"
    >


        <img
            src="PCG AYREM - RDC ind2 - 2026-07-02.png"
            class="plan"
            id="plan"
            alt="Plan RDC"
        >


        <!-- =================================================
             PASTILLES
             ================================================= -->


        <div
            class="hotspot vasque"
            style="left:55%; top:30%;"
            onclick="showInfo('vasque', this)"
            title="Vasque"
        ></div>


        <div
            class="hotspot wc"
            style="left:58%; top:25%;"
            onclick="showInfo('wc', this)"
            title="WC"
        ></div>


        <div
            class="hotspot douche"
            style="left:56%; top:26%;"
            onclick="showInfo('douche', this)"
            title="Douche"
        ></div>


        <div
            class="hotspot sol-mur"
            style="left:58%; top:30%;"
            onclick="showInfo('sol-mur', this)"
            title="Sol et mur"
        ></div>


    </div>

</div>



<!-- =========================================================
     FENÊTRE D'INFORMATION
     ========================================================= -->

<div
    class="info-box"
    id="infoBox"
>

    <span
        class="close"
        onclick="closeInfo()"
    >
        ×
    </span>


    <div
        id="infoContent"
    ></div>

</div>



<script>

/* =========================================================
   VARIABLES
   ========================================================= */

const viewer =
    document.getElementById(
        "planViewer"
    );


const container =
    document.getElementById(
        "planContainer"
    );


const image =
    document.getElementById(
        "plan"
    );


let scale = 1;

let x = 0;

let y = 0;


/*
 * Dimensions initiales
 */

let baseWidth = 0;

let baseHeight = 0;


/*
 * Souris
 */

let mouseDown = false;

let mouseStartX = 0;

let mouseStartY = 0;

let startX = 0;

let startY = 0;


/*
 * Touch
 */

let touchMode = null;

let touchStartX = 0;

let touchStartY = 0;

let touchStartXPosition = 0;

let touchStartYPosition = 0;

let initialDistance = 0;

let initialScale = 1;

let initialCenterX = 0;

let initialCenterY = 0;


/*
 * Zoom
 */

const MIN_SCALE = 1;

const MAX_SCALE = 5;


/* =========================================================
   INITIALISATION
   ========================================================= */

image.addEventListener(
    "load",
    function() {

        /*
         * Taille réelle de l'image
         */

        baseWidth =
            image.naturalWidth;

        baseHeight =
            image.naturalHeight;


        /*
         * Taille d'affichage initiale.
         *
         * On adapte le plan à l'écran
         * sans modifier la source originale.
         */

        const viewerWidth =
            viewer.clientWidth;

        const viewerHeight =
            viewer.clientHeight;


        const ratioX =
            viewerWidth /
            baseWidth;


        const ratioY =
            viewerHeight /
            baseHeight;


        scale =
            Math.min(
                ratioX,
                ratioY
            );


        /*
         * Ne jamais descendre
         * sous une échelle raisonnable.
         */

        if (scale <= 0) {

            scale = 1;

        }


        /*
         * Centrage initial
         */

        x =
            (
                viewerWidth -
                baseWidth * scale
            ) / 2;


        y =
            (
                viewerHeight -
                baseHeight * scale
            ) / 2;


        applyTransform();

    }
);


/* =========================================================
   TRANSFORMATION
   ========================================================= */

function applyTransform() {

    container.style.transform =
        "translate3d(" +
        x +
        "px, " +
        y +
        "px, 0) " +
        "scale(" +
        scale +
        ")";

}


/* =========================================================
   ZOOM AUTOUR D'UN POINT
   ========================================================= */

function zoomAt(
    screenX,
    screenY,
    newScale
) {


    const oldScale =
        scale;


    /*
     * Position du point dans
     * le système de coordonnées
     * du plan.
     */

    const worldX =
        (
            screenX -
            x
        ) /
        oldScale;


    const worldY =
        (
            screenY -
            y
        ) /
        oldScale;


    /*
     * Nouvelle échelle
     */

    scale =
        Math.max(
            MIN_SCALE,
            Math.min(
                MAX_SCALE,
                newScale
            )
        );


    /*
     * On conserve le point
     * sous le curseur/doigt.
     */

    x =
        screenX -
        worldX *
        scale;


    y =
        screenY -
        worldY *
        scale;


    applyTransform();

}


/* =========================================================
   SOURIS — CLIQUER
   ========================================================= */

viewer.addEventListener(
    "mousedown",
    function(event) {


        /*
         * Uniquement clic gauche
         */

        if (
            event.button !== 0
        ) {

            return;

        }


        /*
         * Si on clique sur une pastille,
         * on laisse le clic gérer la fiche.
         */

        if (
            event.target.classList.contains(
                "hotspot"
            )
        ) {

            return;

        }


        mouseDown = true;


        mouseStartX =
            event.clientX;


        mouseStartY =
            event.clientY;


        startX =
            x;


        startY =
            y;


        viewer.classList.add(
            "dragging"
        );

    }
);


/* =========================================================
   SOURIS — DÉPLACER
   ========================================================= */

window.addEventListener(
    "mousemove",
    function(event) {


        if (
            !mouseDown
        ) {

            return;

        }


        x =
            startX +
            (
                event.clientX -
                mouseStartX
            );


        y =
            startY +
            (
                event.clientY -
                mouseStartY
            );


        applyTransform();

    }
);


/* =========================================================
   SOURIS — RELÂCHER
   ========================================================= */

window.addEventListener(
    "mouseup",
    function() {

        mouseDown = false;

        viewer.classList.remove(
            "dragging"
        );

    }
);


/* =========================================================
   MOLETTE
   ========================================================= */

viewer.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const mouseX =
            event.clientX -
            rect.left;


        const mouseY =
            event.clientY -
            rect.top;


        const factor =
            event.deltaY < 0
                ? 1.2
                : 0.83;


        zoomAt(
            mouseX,
            mouseY,
            scale * factor
        );

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH — DISTANCE
   ========================================================= */

function getDistance(
    touch1,
    touch2
) {

    const dx =
        touch2.clientX -
        touch1.clientX;


    const dy =
        touch2.clientY -
        touch1.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   TOUCH — CENTRE
   ========================================================= */

function getCenter(
    touch1,
    touch2
) {

    return {

        x:
            (
                touch1.clientX +
                touch2.clientX
            ) / 2,

        y:
            (
                touch1.clientY +
                touch2.clientY
            ) / 2

    };

}


/* =========================================================
   TOUCH — DÉBUT
   ========================================================= */

viewer.addEventListener(
    "touchstart",
    function(event) {


        /*
         * Deux doigts
         */

        if (
            event.touches.length === 2
        ) {

            touchMode =
                "zoom";


            initialDistance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            initialScale =
                scale;


            const center =
                getCenter(
                    event.touches[0],
                    event.touches[1]
                );


            initialCenterX =
                center.x;


            initialCenterY =
                center.y;


            return;

        }


        /*
         * Un doigt
         */

        if (
            event.touches.length === 1
        ) {

            touchMode =
                "drag";


            touchStartX =
                event.touches[0].clientX;


            touchStartY =
                event.touches[0].clientY;


            touchStartXPosition =
                x;


            touchStartYPosition =
                y;

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH — MOUVEMENT
   ========================================================= */

viewer.addEventListener(
    "touchmove",
    function(event) {


        event.preventDefault();


        /*
         * ZOOM
         */

        if (
            event.touches.length === 2
        ) {


            const distance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            const center =
                getCenter(
                    event.touches[0],
                    event.touches[1]
                );


            const newScale =
                initialScale *
                (
                    distance /
                    initialDistance
                );


            /*
             * Zoom autour du centre
             * des deux doigts.
             */

            zoomAt(
                initialCenterX,
                initialCenterY,
                newScale
            );


            /*
             * Déplacement du centre
             * pendant le pincement.
             */

            x +=
                center.x -
                initialCenterX;


            y +=
                center.y -
                initialCenterY;


            initialCenterX =
                center.x;


            initialCenterY =
                center.y;


            applyTransform();


            return;

        }


        /*
         * DÉPLACEMENT
         */

        if (
            event.touches.length === 1 &&
            touchMode === "drag"
        ) {


            const dx =
                event.touches[0].clientX -
                touchStartX;


            const dy =
                event.touches[0].clientY -
                touchStartY;


            x =
                touchStartXPosition +
                dx;


            y =
                touchStartYPosition +
                dy;


            applyTransform();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH — FIN
   ========================================================= */

viewer.addEventListener(
    "touchend",
    function() {

        touchMode = null;

    }
);


/* =========================================================
   CONTENU DES FICHES
   ========================================================= */

            </p>

            </p>

            </p>

}


/* =========================================================
   OUVERTURE FICHE
   ========================================================= */

function showInfo(
    type,
    hotspot
) {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    const infoContent =
        document.getElementById(
            "infoContent"
        );


    infoContent.innerHTML =
        getInfoContent(type);


    infoBox.style.display =
        "block";


    /*
     * On mémorise la pastille.
     */

    window.activeHotspot =
        hotspot;


    /*
     * Positionnement après rendu.
     */

    requestAnimationFrame(
        function() {

            positionInfoBox(
                hotspot
            );

        }
    );

}


/* =========================================================
   POSITION DE LA FICHE
   ========================================================= */

function positionInfoBox(
    hotspot
) {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    const rect =
        hotspot.getBoundingClientRect();


    const boxWidth =
        infoBox.offsetWidth;


    const boxHeight =
        infoBox.offsetHeight;


    const viewportWidth =
        window.innerWidth;


    const viewportHeight =
        window.innerHeight;


    const gap = 15;

    const margin = 10;


    /*
     * Centre de la pastille.
     */

    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let left;

    let top;


    /*
     * DROITE
     */

    if (
        rect.right +
        gap +
        boxWidth
        <=
        viewportWidth
    ) {

        left =
            rect.right +
            gap;

    }


    /*
     * GAUCHE
     */

    else if (
        rect.left -
        gap -
        boxWidth
        >=
        0
    ) {

        left =
            rect.left -
            gap -
            boxWidth;

    }


    /*
     * CENTRE
     */

    else {

        left =
            centerX -
            boxWidth / 2;

    }


    /*
     * CENTRAGE VERTICAL
     */

    top =
        centerY -
        boxHeight / 2;


    /*
     * Limites
     */

    if (
        top < margin
    ) {

        top = margin;

    }


    if (
        top +
        boxHeight
        >
        viewportHeight -
        margin
    ) {

        top =
            viewportHeight -
            boxHeight -
            margin;

    }


    if (
        left < margin
    ) {

        left = margin;

    }


    if (
        left +
        boxWidth
        >
        viewportWidth -
        margin
    ) {

        left =
            viewportWidth -
            boxWidth -
            margin;

    }


    infoBox.style.left =
        left + "px";


    infoBox.style.top =
        top + "px";

}


/* =========================================================
   FERMETURE
   ========================================================= */

function closeInfo() {

    document.getElementById(
        "infoBox"
    ).style.display =
        "none";

}


/* =========================================================
   REDIMENSIONNEMENT
   ========================================================= */

window.addEventListener(
    "resize",
    function() {


        if (
            window.activeHotspot &&
            document.getElementById(
                "infoBox"
            ).style.display ===
            "block"
        ) {

            positionInfoBox(
                window.activeHotspot
            );

        }

    }
);


/* =========================================================
   ESC
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeInfo();

        }

    }
);


</script>
