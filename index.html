<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carré Côté - Plan interactif</title>


    <style>

        /* =========================
           PAGE
           ========================= */

        html,
        body {
            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background: #eeeeee;
        }


        /* =========================
           PLAN
           ========================= */

        .plan-container {

            position: relative;

            width: 100%;

            max-width: 1400px;

            margin: 0 auto;
        }


        .plan {

            width: 100%;

            display: block;
        }


        /* =========================
           PASTILLES
           ========================= */

        .hotspot {

            position: absolute;

            width: 1%;

            aspect-ratio: 1 / 1;

            border-radius: 50%;

            border: 1px solid white;

            cursor: pointer;

            transform:
                translate(-50%, -50%);

            transition:
                transform 0.15s ease;

            z-index: 10;

            touch-action: manipulation;

            user-select: none;

            -webkit-user-select: none;
        }


        .hotspot:hover {

            transform:
                translate(-50%, -50%)
                scale(1.5);
        }


        /* =========================
           COULEURS
           ========================= */

        .vasque {
            background: #4d8acb;
        }

        .wc {
            background: #d9534f;
        }

        .douche {
            background: #4caf7a;
        }

        .sol-mur {
            background: #df9629;
        }


        /* =========================
           FENÊTRE D'INFORMATION
           ========================= */

        .info-box {

            display: none;

            position: fixed;

            width: 450px;

            max-width: 450px;

            max-height: 500px;

            overflow-y: auto;

            overflow-x: hidden;

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 8px 30px
                rgba(0,0,0,0.25);

            z-index: 1000;

            box-sizing: border-box;

            -webkit-overflow-scrolling: touch;

            /*
             * Permet d'annuler visuellement
             * le zoom du navigateur.
             */

            transform-origin: top left;
        }


        /* =========================
           TITRES
           ========================= */

        .info-box h2 {

            margin-top: 0;

            padding-right: 25px;
        }


        .info-box h3 {

            margin-bottom: 6px;
        }


        .info-box p {

            line-height: 1.5;
        }


        /* =========================
           FERMETURE
           ========================= */

        .close {

            position: absolute;

            right: 15px;

            top: 10px;

            font-size: 24px;

            cursor: pointer;

            line-height: 1;
        }


        /* =========================
           TABLETTE
           ========================= */

        @media (max-width: 900px) {

            .info-box {

                width: 340px;

                max-width: 340px;

                max-height: 450px;

                padding: 20px;
            }

            .info-box h2 {

                font-size: 20px;
            }

            .info-box h3 {

                font-size: 15px;
            }

            .info-box p {

                font-size: 14px;
            }
        }


        /* =========================
           TELEPHONE
           ========================= */

        @media (max-width: 600px) {

            .info-box {

                width: 280px;

                max-width: 280px;

                max-height: 350px;

                padding: 16px;

                border-radius: 10px;
            }

            .info-box h2 {

                font-size: 18px;
            }

            .info-box h3 {

                font-size: 14px;
            }

            .info-box p {

                font-size: 13px;

                line-height: 1.4;
            }

            .close {

                right: 12px;

                top: 9px;

                font-size: 22px;
            }
        }

    </style>

</head>


<body>


<!-- =====================================================
     PLAN
     ===================================================== -->

<div class="plan-container">


    <img
        src="PCG AYREM - RDC ind2 - 2026-07-02.png"
        class="plan"
        alt="Plan RDC"
    >


    <!-- VASQUE -->

    <div
        class="hotspot vasque"
        style="left: 55%; top: 30%;"
        onclick="showInfo('vasque', this)"
        title="Vasque"
    ></div>


    <!-- WC -->

    <div
        class="hotspot wc"
        style="left: 58%; top: 25%;"
        onclick="showInfo('wc', this)"
        title="WC"
    ></div>


    <!-- DOUCHE -->

    <div
        class="hotspot douche"
        style="left: 56%; top: 26%;"
        onclick="showInfo('douche', this)"
        title="Douche"
    ></div>


    <!-- SOL ET MUR -->

    <div
        class="hotspot sol-mur"
        style="left: 58%; top: 30%;"
        onclick="showInfo('sol-mur', this)"
        title="Sol et mur"
    ></div>


</div>


<!-- =====================================================
     FENÊTRE D'INFORMATION
     ===================================================== -->

<div
    class="info-box"
    id="infoBox"
>

    <span
        class="close"
        onclick="closeInfo()"
    >
        ×
    </span>

    <div id="infoContent"></div>

</div>



<script>


/* =====================================================
   CONTENU DES FICHES
   ===================================================== */

function getInfoContent(type) {

}



/* =====================================================
   OUVERTURE DE LA FICHE
   ===================================================== */

function showInfo(type, hotspot) {


    const infoBox =
        document.getElementById("infoBox");


    const infoContent =
        document.getElementById("infoContent");


    /* Contenu */

    infoContent.innerHTML =
        getInfoContent(type);


    /*
     * On remet la transformation à zéro
     * avant de mesurer la fenêtre.
     */

    infoBox.style.transform =
        "scale(1)";


    infoBox.style.display =
        "block";


    /*
     * Dimensions du viewport réel
     */

    const viewport =
        window.visualViewport;


    const viewportWidth =
        viewport
            ? viewport.width
            : window.innerWidth;


    const viewportHeight =
        viewport
            ? viewport.height
            : window.innerHeight;


    const viewportLeft =
        viewport
            ? viewport.offsetLeft
            : 0;


    const viewportTop =
        viewport
            ? viewport.offsetTop
            : 0;


    /*
     * Niveau de zoom du téléphone
     */

    const scale =
        viewport
            ? viewport.scale
            : 1;


    /*
     * Dimensions naturelles
     * de la fenêtre.
     */

    const boxWidth =
        infoBox.offsetWidth;


    const boxHeight =
        infoBox.offsetHeight;


    /*
     * Position de la pastille
     * dans le viewport.
     */

    const hotspotRect =
        hotspot.getBoundingClientRect();


    /*
     * Position de la pastille
     * réellement visible à l'écran.
     */

    const hotspotX =
        hotspotRect.left +
        hotspotRect.width / 2;


    const hotspotY =
        hotspotRect.top +
        hotspotRect.height / 2;


    /*
     * Marge autour de la fiche.
     */

    const margin = 15;


    let x;

    let y;


    /* =================================================
       CHOIX DU CÔTÉ HORIZONTAL
       ================================================= */

    if (
        hotspotX +
        boxWidth +
        margin <
        viewportWidth
    ) {

        /*
         * La fiche tient à droite.
         */

        x =
            hotspotX + 15;

    }

    else {

        /*
         * Sinon elle passe à gauche.
         */

        x =
            hotspotX -
            boxWidth -
            15;

    }


    /* =================================================
       CHOIX DU CÔTÉ VERTICAL
       ================================================= */

    if (
        hotspotY +
        boxHeight +
        margin <
        viewportHeight
    ) {

        /*
         * La fiche tient dessous.
         */

        y =
            hotspotY + 15;

    }

    else {

        /*
         * Sinon elle passe au-dessus.
         */

        y =
            hotspotY -
            boxHeight -
            15;

    }


    /*
     * On s'assure qu'elle ne sorte
     * pas du viewport.
     */

    x =
        Math.max(
            margin,
            Math.min(
                x,
                viewportWidth -
                boxWidth -
                margin
            )
        );


    y =
        Math.max(
            margin,
            Math.min(
                y,
                viewportHeight -
                boxHeight -
                margin
            )
        );


    /*
     * Application de la position.
     */

    infoBox.style.left =
        (
            x +
            viewportLeft
        ) + "px";


    infoBox.style.top =
        (
            y +
            viewportTop
        ) + "px";


    /*
     * Compensation du zoom.
     *
     * Si le téléphone est zoomé à 200 %,
     * la fiche est affichée à 50 % de sa
     * taille CSS afin de conserver une
     * taille physique raisonnable.
     */

    if (scale > 1) {

        infoBox.style.transform =
            "scale(" +
            (1 / scale) +
            ")";

    }

    else {

        infoBox.style.transform =
            "scale(1)";

    }

}



/* =====================================================
   FERMETURE
   ===================================================== */

function closeInfo() {

    document.getElementById(
        "infoBox"
    ).style.display = "none";

}



/* =====================================================
   RECALCUL LORSQUE LE ZOOM CHANGE
   ===================================================== */

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        function() {

            /*
             * Si une fiche est ouverte,
             * on la recalcule.
             */

            const infoBox =
                document.getElementById(
                    "infoBox"
                );


            if (
                infoBox.style.display ===
                "block"
            ) {

                /*
                 * On ferme/recalcule
                 * uniquement lors d'un
                 * changement de viewport.
                 */

                infoBox.style.display =
                    "none";

            }

        }
    );

}

</script>


</body>

</html>
