<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Carré Côté - Plan interactif</title>


<style>

/* =========================================================
   PAGE
   ========================================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #eeeeee;

}


/* =========================================================
   ZONE DU PLAN
   ========================================================= */

#viewer {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #eeeeee;

    cursor: grab;

    touch-action: none;

}


#viewer.dragging {

    cursor: grabbing;

}


/* =========================================================
   CANVAS DU PLAN
   ========================================================= */

#planCanvas {

    position: absolute;

    left: 0;
    top: 0;

    display: block;

}


/* =========================================================
   COUCHE DES PASTILLES
   ========================================================= */

#hotspotLayer {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 20;

}


/* =========================================================
   PASTILLES
   ========================================================= */

.hotspot {

    position: absolute;

    /*
     * TAILLE VISUELLE FIXE.
     *
     * Elle ne dépend absolument pas
     * du zoom du plan.
     */

    width: 12px;

    height: 12px;

    min-width: 12px;

    min-height: 12px;

    max-width: 12px;

    max-height: 12px;

    border-radius: 50%;

    border: 1px solid white;

    box-sizing: border-box;

    cursor: pointer;

    transform:
        translate(-50%, -50%);

    pointer-events: auto;

    touch-action: manipulation;

}


/* =========================================================
   ZONE TACTILE
   ========================================================= */

.hotspot::before {

    content: "";

    position: absolute;

    width: 30px;

    height: 30px;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

}


/* =========================================================
   SURVOL PC
   ========================================================= */

@media (hover: hover) {

    .hotspot:hover {

        transform:
            translate(-50%, -50%)
            scale(1.5);

    }

}


/* =========================================================
   COULEURS
   ========================================================= */

.vasque {

    background: #4d8acb;

}


.wc {

    background: #d9534f;

}


.douche {

    background: #4caf7a;

}


.sol-mur {

    background: #df9629;

}


/* =========================================================
   FENÊTRE D'INFORMATION
   ========================================================= */

.info-box {

    display: none;

    position: fixed;

    width: 450px;

    max-width:
        calc(100vw - 30px);

    max-height:
        calc(100vh - 30px);

    padding: 25px;

    box-sizing: border-box;

    background: white;

    border-radius: 12px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.25);

    z-index: 1000;

    overflow-y: auto;

    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    touch-action: pan-y;

}


/* =========================================================
   TEXTES
   ========================================================= */

.info-box h2 {

    margin-top: 0;

    padding-right: 30px;

    font-size: 22px;

}


.info-box h3 {

    margin-top: 20px;

    margin-bottom: 6px;

    font-size: 16px;

}


.info-box p {

    margin-top: 0;

    line-height: 1.5;

    font-size: 14px;

}


/* =========================================================
   FERMER
   ========================================================= */

.close {

    position: absolute;

    right: 12px;

    top: 8px;

    width: 30px;

    height: 30px;

    line-height: 30px;

    text-align: center;

    font-size: 25px;

    cursor: pointer;

}


/* =========================================================
   TABLETTE
   ========================================================= */

@media (max-width: 900px) {

    .hotspot {

        width: 11px;

        height: 11px;

        min-width: 11px;

        min-height: 11px;

        max-width: 11px;

        max-height: 11px;

    }


    .info-box {

        width: 360px;

        max-width:
            calc(100vw - 30px);

        padding: 20px;

    }


    .info-box h2 {

        font-size: 20px;

    }


    .info-box h3 {

        font-size: 15px;

    }


    .info-box p {

        font-size: 14px;

    }

}


/* =========================================================
   TELEPHONE
   ========================================================= */

@media (max-width: 600px) {

    .hotspot {

        width: 10px;

        height: 10px;

        min-width: 10px;

        min-height: 10px;

        max-width: 10px;

        max-height: 10px;

    }


    .info-box {

        width: 280px;

        max-width:
            calc(100vw - 20px);

        max-height:
            calc(100vh - 20px);

        padding: 16px;

        border-radius: 10px;

    }


    .info-box h2 {

        font-size: 18px;

    }


    .info-box h3 {

        font-size: 14px;

        margin-top: 16px;

    }


    .info-box p {

        font-size: 13px;

        line-height: 1.4;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     PLAN
     ========================================================= -->

<div id="viewer">


    <canvas
        id="planCanvas"
    ></canvas>


</div>



<!-- =========================================================
     COUCHE INDÉPENDANTE DES PASTILLES
     ========================================================= -->

<div id="hotspotLayer">


    <div
        class="hotspot vasque"
        data-x="55"
        data-y="30"
        onclick="showInfo('vasque', this)"
        title="Vasque"
    ></div>


    <div
        class="hotspot wc"
        data-x="58"
        data-y="25"
        onclick="showInfo('wc', this)"
        title="WC"
    ></div>


    <div
        class="hotspot douche"
        data-x="56"
        data-y="26"
        onclick="showInfo('douche', this)"
        title="Douche"
    ></div>


    <div
        class="hotspot sol-mur"
        data-x="58"
        data-y="30"
        onclick="showInfo('sol-mur', this)"
        title="Sol et mur"
    ></div>


</div>



<!-- =========================================================
     FENÊTRE D'INFORMATION
     ========================================================= -->

<div
    class="info-box"
    id="infoBox"
>

    <span
        class="close"
        onclick="closeInfo()"
    >
        ×
    </span>


    <div
        id="infoContent"
    ></div>

</div>



<script>

/* =========================================================
   ÉLÉMENTS
   ========================================================= */

const viewer =
    document.getElementById(
        "viewer"
    );


const canvas =
    document.getElementById(
        "planCanvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const hotspotLayer =
    document.getElementById(
        "hotspotLayer"
    );


const image =
    new Image();


image.src =
    "PCG AYREM - RDC ind2 - 2026-07-02.png";


/* =========================================================
   VARIABLES DU PLAN
   ========================================================= */

let imageWidth = 0;

let imageHeight = 0;


let scale = 1;


let offsetX = 0;

let offsetY = 0;


let dpr =
    window.devicePixelRatio || 1;


/* =========================================================
   ZOOM
   ========================================================= */

const MIN_SCALE = 0.05;

const MAX_SCALE = 5;


/* =========================================================
   RAF
   ========================================================= */

let animationRequested = false;


/* =========================================================
   HOTSPOT ACTIF
   ========================================================= */

window.activeHotspot = null;


/* =========================================================
   CHARGEMENT IMAGE
   ========================================================= */

image.onload =
    function() {


        imageWidth =
            image.naturalWidth;


        imageHeight =
            image.naturalHeight;


        resizeCanvas();


        fitPlan();


        requestDraw();

    };


/* =========================================================
   REDIMENSIONNEMENT CANVAS
   ========================================================= */

function resizeCanvas() {


    dpr =
        window.devicePixelRatio || 1;


    const width =
        viewer.clientWidth;


    const height =
        viewer.clientHeight;


    canvas.width =
        Math.round(
            width * dpr
        );


    canvas.height =
        Math.round(
            height * dpr
        );


    canvas.style.width =
        width + "px";


    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


/* =========================================================
   AJUSTEMENT INITIAL
   ========================================================= */

function fitPlan() {


    const width =
        viewer.clientWidth;


    const height =
        viewer.clientHeight;


    const scaleX =
        width /
        imageWidth;


    const scaleY =
        height /
        imageHeight;


    scale =
        Math.min(
            scaleX,
            scaleY
        );


    offsetX =
        (
            width -
            imageWidth * scale
        ) / 2;


    offsetY =
        (
            height -
            imageHeight * scale
        ) / 2;

}


/* =========================================================
   DEMANDE DE DESSIN
   ========================================================= */

function requestDraw() {


    if (
        animationRequested
    ) {

        return;

    }


    animationRequested =
        true;


    requestAnimationFrame(
        function() {

            animationRequested =
                false;


            draw();

        }
    );

}


/* =========================================================
   DESSIN DU PLAN
   ========================================================= */

function draw() {


    const width =
        viewer.clientWidth;


    const height =
        viewer.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
     * Image originale.
     */

    ctx.drawImage(

        image,

        offsetX,

        offsetY,

        imageWidth * scale,

        imageHeight * scale

    );


    /*
     * Les pastilles sont mises
     * à jour séparément.
     */

    updateHotspots();

}


/* =========================================================
   POSITIONNEMENT DES PASTILLES
   ========================================================= */

function updateHotspots() {


    const hotspots =
        document.querySelectorAll(
            ".hotspot"
        );


    hotspots.forEach(
        function(hotspot) {


            const percentX =
                parseFloat(
                    hotspot.dataset.x
                );


            const percentY =
                parseFloat(
                    hotspot.dataset.y
                );


            /*
             * Coordonnées originales
             * dans l'image.
             */

            const imageX =
                imageWidth *
                percentX /
                100;


            const imageY =
                imageHeight *
                percentY /
                100;


            /*
             * Conversion en coordonnées écran.
             */

            const screenX =
                offsetX +
                imageX *
                scale;


            const screenY =
                offsetY +
                imageY *
                scale;


            /*
             * La couche des pastilles
             * est fixe à l'écran.
             *
             * Seule leur position change.
             */

            hotspot.style.left =
                screenX + "px";


            hotspot.style.top =
                screenY + "px";

        }
    );

}


/* =========================================================
   ZOOM AUTOUR D'UN POINT
   ========================================================= */

function zoomAt(
    screenX,
    screenY,
    newScale
) {


    const oldScale =
        scale;


    /*
     * Coordonnée du point
     * dans l'image.
     */

    const imageX =
        (
            screenX -
            offsetX
        ) /
        oldScale;


    const imageY =
        (
            screenY -
            offsetY
        ) /
        oldScale;


    /*
     * Nouvelle échelle.
     */

    scale =
        Math.max(

            MIN_SCALE,

            Math.min(
                MAX_SCALE,
                newScale
            )

        );


    /*
     * Conservation du point
     * sous le curseur.
     */

    offsetX =
        screenX -
        imageX *
        scale;


    offsetY =
        screenY -
        imageY *
        scale;


    requestDraw();

}


/* =========================================================
   SOURIS
   ========================================================= */

let mouseDown = false;

let mouseStartX = 0;

let mouseStartY = 0;

let startOffsetX = 0;

let startOffsetY = 0;


/* =========================================================
   SOURIS — DOWN
   ========================================================= */

viewer.addEventListener(
    "mousedown",
    function(event) {


        if (
            event.button !== 0
        ) {

            return;

        }


        mouseDown = true;


        mouseStartX =
            event.clientX;


        mouseStartY =
            event.clientY;


        startOffsetX =
            offsetX;


        startOffsetY =
            offsetY;


        viewer.classList.add(
            "dragging"
        );

    }
);


/* =========================================================
   SOURIS — MOVE
   ========================================================= */

window.addEventListener(
    "mousemove",
    function(event) {


        if (
            !mouseDown
        ) {

            return;

        }


        offsetX =
            startOffsetX +
            (
                event.clientX -
                mouseStartX
            );


        offsetY =
            startOffsetY +
            (
                event.clientY -
                mouseStartY
            );


        requestDraw();

    }
);


/* =========================================================
   SOURIS — UP
   ========================================================= */

window.addEventListener(
    "mouseup",
    function() {

        mouseDown = false;


        viewer.classList.remove(
            "dragging"
        );

    }
);


/* =========================================================
   MOLETTE
   ========================================================= */

viewer.addEventListener(
    "wheel",
    function(event) {


        event.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const mouseX =
            event.clientX -
            rect.left;


        const mouseY =
            event.clientY -
            rect.top;


        const factor =
            event.deltaY < 0
                ? 1.18
                : 0.847;


        zoomAt(

            mouseX,

            mouseY,

            scale *
            factor

        );

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH
   ========================================================= */

let touchMode = null;


let touchStartX = 0;

let touchStartY = 0;


let touchStartOffsetX = 0;

let touchStartOffsetY = 0;


let pinchDistance = 0;

let pinchScale = 1;


/* =========================================================
   DISTANCE ENTRE DEUX DOIGTS
   ========================================================= */

function getTouchDistance(
    a,
    b
) {

    const dx =
        b.clientX -
        a.clientX;


    const dy =
        b.clientY -
        a.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   CENTRE ENTRE DEUX DOIGTS
   ========================================================= */

function getTouchCenter(
    a,
    b
) {

    return {

        x:
            (
                a.clientX +
                b.clientX
            ) / 2,

        y:
            (
                a.clientY +
                b.clientY
            ) / 2

    };

}


/* =========================================================
   TOUCH — START
   ========================================================= */

viewer.addEventListener(
    "touchstart",
    function(event) {


        /*
         * Deux doigts :
         * début du zoom.
         */

        if (
            event.touches.length === 2
        ) {


            touchMode =
                "pinch";


            pinchDistance =
                getTouchDistance(

                    event.touches[0],

                    event.touches[1]

                );


            pinchScale =
                scale;


            return;

        }


        /*
         * Un doigt :
         * déplacement.
         */

        if (
            event.touches.length === 1
        ) {


            touchMode =
                "drag";


            touchStartX =
                event.touches[0].clientX;


            touchStartY =
                event.touches[0].clientY;


            touchStartOffsetX =
                offsetX;


            touchStartOffsetY =
                offsetY;

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH — MOVE
   ========================================================= */

viewer.addEventListener(
    "touchmove",
    function(event) {


        event.preventDefault();


        /*
         * ZOOM DEUX DOIGTS
         */

        if (
            event.touches.length === 2
        ) {


            const distance =
                getTouchDistance(

                    event.touches[0],

                    event.touches[1]

                );


            const center =
                getTouchCenter(

                    event.touches[0],

                    event.touches[1]

                );


            const rect =
                viewer.getBoundingClientRect();


            zoomAt(

                center.x -
                rect.left,

                center.y -
                rect.top,

                pinchScale *
                (
                    distance /
                    pinchDistance
                )

            );


            return;

        }


        /*
         * DÉPLACEMENT
         */

        if (
            event.touches.length === 1 &&
            touchMode === "drag"
        ) {


            const dx =
                event.touches[0].clientX -
                touchStartX;


            const dy =
                event.touches[0].clientY -
                touchStartY;


            offsetX =
                touchStartOffsetX +
                dx;


            offsetY =
                touchStartOffsetY +
                dy;


            requestDraw();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH — END
   ========================================================= */

viewer.addEventListener(
    "touchend",
    function() {

        touchMode = null;

    }
);


/* =========================================================
   CONTENU DES FICHES
   ========================================================= */

function getInfoContent(type) {

/* =========================================================
   OUVERTURE FICHE
   ========================================================= */

function showInfo(
    type,
    hotspot
) {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    const infoContent =
        document.getElementById(
            "infoContent"
        );


    infoContent.innerHTML =
        getInfoContent(type);


    infoBox.style.display =
        "block";


    window.activeHotspot =
        hotspot;


    requestAnimationFrame(
        function() {

            positionInfoBox(
                hotspot
            );

        }
    );

}


/* =========================================================
   POSITIONNEMENT FICHE
   ========================================================= */

function positionInfoBox(
    hotspot
) {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    const rect =
        hotspot.getBoundingClientRect();


    const boxWidth =
        infoBox.offsetWidth;


    const boxHeight =
        infoBox.offsetHeight;


    const viewportWidth =
        window.innerWidth;


    const viewportHeight =
        window.innerHeight;


    const gap = 15;

    const margin = 10;


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let left;

    let top;


    /*
     * DROITE
     */

    if (
        rect.right +
        gap +
        boxWidth
        <=
        viewportWidth
    ) {

        left =
            rect.right +
            gap;

    }


    /*
     * GAUCHE
     */

    else if (
        rect.left -
        gap -
        boxWidth
        >=
        0
    ) {

        left =
            rect.left -
            gap -
            boxWidth;

    }


    /*
     * CENTRE
     */

    else {

        left =
            centerX -
            boxWidth / 2;

    }


    /*
     * CENTRAGE VERTICAL
     */

    top =
        centerY -
        boxHeight / 2;


    /*
     * LIMITES
     */

    if (
        top < margin
    ) {

        top = margin;

    }


    if (
        top +
        boxHeight
        >
        viewportHeight -
        margin
    ) {

        top =
            viewportHeight -
            boxHeight -
            margin;

    }


    if (
        left < margin
    ) {

        left = margin;

    }


    if (
        left +
        boxWidth
        >
        viewportWidth -
        margin
    ) {

        left =
            viewportWidth -
            boxWidth -
            margin;

    }


    infoBox.style.left =
        left + "px";


    infoBox.style.top =
        top + "px";

}


/* =========================================================
   FERMER FICHE
   ========================================================= */

function closeInfo() {

    document.getElementById(
        "infoBox"
    ).style.display =
        "none";

}


/* =========================================================
   REDIMENSIONNEMENT
   ========================================================= */

window.addEventListener(
    "resize",
    function() {


        resizeCanvas();


        requestDraw();


        /*
         * La fiche reste attachée
         * à sa pastille.
         */

        if (
            window.activeHotspot &&
            document.getElementById(
                "infoBox"
            ).style.display ===
            "block"
        ) {

            positionInfoBox(
                window.activeHotspot
            );

        }

    }
);


/* =========================================================
   ESC
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeInfo();

        }

    }
);

</script>
