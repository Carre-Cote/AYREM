<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Carré Côté - Plan interactif</title>


    <style>

        /* =====================================================
           PAGE
           ===================================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family: Arial, sans-serif;

            background: #eeeeee;

            overflow: hidden;

            /*
             * On empêche le navigateur de zoomer
             * ou de déplacer toute la page.
             */

            touch-action: none;

        }


        /* =====================================================
           ZONE DU PLAN
           ===================================================== */

        .plan-viewport {

            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #eeeeee;

        }


        /* =====================================================
           CONTENEUR DU PLAN
           ===================================================== */

        .plan-container {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;

            transform-origin: 0 0;

            will-change: transform;

        }


        /* =====================================================
           IMAGE DU PLAN
           ===================================================== */

        .plan {

            display: block;

            width: 100%;

            height: auto;

            user-select: none;

            -webkit-user-select: none;

            pointer-events: none;

        }


        /* =====================================================
           PASTILLES
           ===================================================== */

        .hotspot {

            position: absolute;

            width: 1%;

            aspect-ratio: 1 / 1;

            border-radius: 50%;

            border: 1px solid white;

            cursor: pointer;

            transform:
                translate(-50%, -50%);

            transition:
                transform 0.15s ease;

            z-index: 20;

            touch-action: manipulation;

            user-select: none;

            -webkit-user-select: none;

        }


        /* Agrandissement souris sur ordinateur */

        @media (hover: hover) {

            .hotspot:hover {

                transform:
                    translate(-50%, -50%)
                    scale(1.5);

            }

        }


        /* =====================================================
           COULEURS DES PASTILLES
           ===================================================== */

        .vasque {

            background: #4d8acb;

        }


        .wc {

            background: #d9534f;

        }


        .douche {

            background: #4caf7a;

        }


        .sol-mur {

            background: #df9629;

        }


        /* =====================================================
           BOUTONS DE ZOOM
           ===================================================== */

        .zoom-controls {

            position: fixed;

            right: 15px;
            bottom: 15px;

            z-index: 2000;

            display: flex;

            flex-direction: column;

            gap: 6px;

        }


        .zoom-controls button {

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 8px;

            background: white;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.25);

            font-size: 22px;

            cursor: pointer;

            touch-action: manipulation;

        }


        .zoom-controls button:active {

            transform: scale(0.95);

        }


        /* =====================================================
           FENÊTRE D'INFORMATION
           ===================================================== */

        .info-box {

            display: none;

            position: fixed;

            z-index: 3000;

            width: 430px;

            max-width: calc(100vw - 30px);

            max-height: 70vh;

            overflow-y: auto;

            overflow-x: hidden;

            background: white;

            padding: 24px;

            border-radius: 12px;

            box-sizing: border-box;

            box-shadow:
                0 8px 35px rgba(0,0,0,0.30);

            -webkit-overflow-scrolling: touch;

            touch-action: pan-y;

        }


        /* =====================================================
           CONTENU DE LA FICHE
           ===================================================== */

        .info-box h2 {

            margin-top: 0;

            padding-right: 30px;

            font-size: 22px;

        }


        .info-box h3 {

            margin-top: 20px;

            margin-bottom: 6px;

            font-size: 16px;

        }


        .info-box p {

            margin-top: 0;

            line-height: 1.5;

            font-size: 14px;

        }


        /* =====================================================
           BOUTON FERMER
           ===================================================== */

        .close {

            position: absolute;

            right: 15px;
            top: 12px;

            width: 30px;
            height: 30px;

            font-size: 25px;

            line-height: 28px;

            text-align: center;

            cursor: pointer;

            color: #333;

            touch-action: manipulation;

        }


        /* =====================================================
           TABLETTE
           ===================================================== */

        @media (max-width: 900px) {

            .info-box {

                width: 350px;

                max-width:
                    calc(100vw - 30px);

                max-height: 60vh;

                padding: 20px;

            }


            .info-box h2 {

                font-size: 20px;

            }

        }


        /* =====================================================
           TELEPHONE
           ===================================================== */

        @media (max-width: 600px) {

            .info-box {

                width: 285px;

                max-width:
                    calc(100vw - 20px);

                max-height: 55vh;

                padding: 16px;

                border-radius: 10px;

            }


            .info-box h2 {

                font-size: 18px;

            }


            .info-box h3 {

                font-size: 14px;

                margin-top: 16px;

            }


            .info-box p {

                font-size: 13px;

                line-height: 1.4;

            }


            .close {

                right: 10px;
                top: 8px;

                font-size: 22px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     ZONE DE VISUALISATION
     ========================================================= -->

<div
    class="plan-viewport"
    id="planViewport"
>


    <!-- =====================================================
         PLAN
         ===================================================== -->

    <div
        class="plan-container"
        id="planContainer"
    >


        <img
            src="PCG AYREM - RDC ind2 - 2026-07-02.png"
            class="plan"
            id="plan"
            alt="Plan RDC"
        >


        <!-- =================================================
             VASQUE
             ================================================= -->

        <div
            class="hotspot vasque"
            style="left: 55%; top: 30%;"
            onclick="showInfo('vasque')"
            title="Vasque"
        ></div>


        <!-- =================================================
             WC
             ================================================= -->

        <div
            class="hotspot wc"
            style="left: 58%; top: 25%;"
            onclick="showInfo('wc')"
            title="WC"
        ></div>


        <!-- =================================================
             DOUCHE
             ================================================= -->

        <div
            class="hotspot douche"
            style="left: 56%; top: 26%;"
            onclick="showInfo('douche')"
            title="Douche"
        ></div>


        <!-- =================================================
             SOL ET MUR
             ================================================= -->

        <div
            class="hotspot sol-mur"
            style="left: 58%; top: 30%;"
            onclick="showInfo('sol-mur')"
            title="Sol et mur"
        ></div>


    </div>

</div>


<!-- =========================================================
     BOUTONS DE ZOOM
     ========================================================= -->

<div class="zoom-controls">

    <button
        onclick="zoomIn()"
        aria-label="Zoom avant"
    >
        +
    </button>


    <button
        onclick="zoomOut()"
        aria-label="Zoom arrière"
    >
        −
    </button>


    <button
        onclick="resetZoom()"
        aria-label="Réinitialiser"
    >
        ⟳
    </button>

</div>


<!-- =========================================================
     FENÊTRE D'INFORMATION
     ========================================================= -->

<div
    class="info-box"
    id="infoBox"
>


    <span
        class="close"
        onclick="closeInfo()"
    >
        ×
    </span>


    <div id="infoContent"></div>


</div>



<script>


/* ============================================================
   VARIABLES DU ZOOM
   ============================================================ */

let scale = 1;

let translateX = 0;
let translateY = 0;


/*
 * Niveau maximum de zoom.
 */

const MAX_SCALE = 5;


/*
 * Niveau minimum.
 */

const MIN_SCALE = 1;


/*
 * Facteur d'agrandissement
 * avec les boutons.
 */

const ZOOM_STEP = 1.3;



/* ============================================================
   APPLICATION DE LA TRANSFORMATION
   ============================================================ */

function updateTransform() {

    const container =
        document.getElementById(
            "planContainer"
        );


    container.style.transform =
        "translate(" +
        translateX +
        "px, " +
        translateY +
        "px) " +
        "scale(" +
        scale +
        ")";

}



/* ============================================================
   ZOOM AVANT
   ============================================================ */

function zoomIn() {

    scale *= ZOOM_STEP;


    if (scale > MAX_SCALE) {

        scale = MAX_SCALE;

    }


    updateTransform();

}



/* ============================================================
   ZOOM ARRIÈRE
   ============================================================ */

function zoomOut() {

    scale /= ZOOM_STEP;


    if (scale < MIN_SCALE) {

        scale = MIN_SCALE;

        translateX = 0;
        translateY = 0;

    }


    updateTransform();

}



/* ============================================================
   RESET
   ============================================================ */

function resetZoom() {

    scale = 1;

    translateX = 0;

    translateY = 0;

    updateTransform();

}



/* ============================================================
   GESTION DU ZOOM TACTILE
   ============================================================ */

const viewport =
    document.getElementById(
        "planViewport"
    );


let isDragging = false;

let startX = 0;
let startY = 0;

let startTranslateX = 0;
let startTranslateY = 0;


let initialDistance = null;

let initialScale = 1;


/*
 * Centre du pincement.
 */

let pinchCenterX = 0;
let pinchCenterY = 0;



/* ============================================================
   CALCUL DE LA DISTANCE ENTRE DEUX DOIGTS
   ============================================================ */

function getDistance(touch1, touch2) {

    const dx =
        touch1.clientX -
        touch2.clientX;

    const dy =
        touch1.clientY -
        touch2.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}



/* ============================================================
   TOUCH START
   ============================================================ */

viewport.addEventListener(
    "touchstart",
    function(event) {


        if (
            event.target.closest(
                ".info-box"
            )
        ) {

            return;

        }


        /* ============================
           DEUX DOIGTS
           ============================ */

        if (
            event.touches.length === 2
        ) {

            isDragging = false;


            initialDistance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            initialScale = scale;


            pinchCenterX =
                (
                    event.touches[0].clientX +
                    event.touches[1].clientX
                ) / 2;


            pinchCenterY =
                (
                    event.touches[0].clientY +
                    event.touches[1].clientY
                ) / 2;


            return;

        }


        /* ============================
           UN DOIGT
           ============================ */

        if (
            event.touches.length === 1
        ) {

            isDragging = true;


            startX =
                event.touches[0].clientX;


            startY =
                event.touches[0].clientY;


            startTranslateX =
                translateX;


            startTranslateY =
                translateY;

        }

    },
    {
        passive: false
    }
);



/* ============================================================
   TOUCH MOVE
   ============================================================ */

viewport.addEventListener(
    "touchmove",
    function(event) {


        event.preventDefault();


        /* ============================
           PINCEMENT
           ============================ */

        if (
            event.touches.length === 2 &&
            initialDistance
        ) {


            const currentDistance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            let newScale =
                initialScale *
                (
                    currentDistance /
                    initialDistance
                );


            newScale =
                Math.max(
                    MIN_SCALE,
                    Math.min(
                        MAX_SCALE,
                        newScale
                    )
                );


            /*
             * Coordonnées avant zoom
             * autour du centre du pincement.
             */

            const worldX =
                (
                    pinchCenterX -
                    translateX
                ) /
                scale;


            const worldY =
                (
                    pinchCenterY -
                    translateY
                ) /
                scale;


            scale =
                newScale;


            /*
             * On conserve le même point
             * sous les doigts.
             */

            translateX =
                pinchCenterX -
                worldX * scale;


            translateY =
                pinchCenterY -
                worldY * scale;


            updateTransform();


            return;

        }


        /* ============================
           DÉPLACEMENT
           ============================ */

        if (
            isDragging &&
            event.touches.length === 1
        ) {


            const currentX =
                event.touches[0].clientX;


            const currentY =
                event.touches[0].clientY;


            translateX =
                startTranslateX +
                (
                    currentX -
                    startX
                );


            translateY =
                startTranslateY +
                (
                    currentY -
                    startY
                );


            updateTransform();

        }

    },
    {
        passive: false
    }
);



/* ============================================================
   TOUCH END
   ============================================================ */

viewport.addEventListener(
    "touchend",
    function(event) {


        if (
            event.touches.length < 2
        ) {

            initialDistance = null;

        }


        if (
            event.touches.length === 0
        ) {

            isDragging = false;

        }

    }
);



/* ============================================================
   CONTENU DES FICHES
   ============================================================ */

function getInfoContent(type) {


    let content = "";


    /* ========================================================
       VASQUE
       ======================================================== */

    if (type === "vasque") {

        content = `

            <h2>Vasque — SDB 01</h2>

            <h3>Meuble</h3>

            <p>
                Meuble vasque 120 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Vasque</h3>

            <p>
                Vasque à poser<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Mitigeur</h3>

            <p>
                Mitigeur lavabo<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Miroir</h3>

            <p>
                Miroir 120 × 80 cm<br>
                Référence : XXX
            </p>

        `;

    }


    /* ========================================================
       WC
       ======================================================== */

    if (type === "wc") {

        content = `

            <h2>WC — SDB 01</h2>

            <h3>Bâti-support</h3>

            <p>
                Fabricant : XXX<br>
                Modèle : XXX<br>
                Référence : XXX
            </p>

            <h3>Cuvette suspendue</h3>

            <p>
                Fabricant : XXX<br>
                Modèle : XXX<br>
                Référence : XXX
            </p>

            <h3>Plaque de commande</h3>

            <p>
                Fabricant : XXX<br>
                Modèle : XXX<br>
                Finition : XXX
            </p>

        `;

    }


    /* ========================================================
       DOUCHE
       ======================================================== */

    if (type === "douche") {

        content = `

            <h2>Douche — SDB 01</h2>

            <h3>Receveur</h3>

            <p>
                Receveur 120 × 90 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Mitigeur</h3>

            <p>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Colonne de douche</h3>

            <p>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Faïence</h3>

            <p>
                Fabricant : XXX<br>
                Référence : XXX<br>
                Format : 60 × 120 cm
            </p>

        `;

    }


    /* ========================================================
       SOL ET MUR
       ======================================================== */

    if (type === "sol-mur") {

        content = `

            <h2>Sol et mur — SDB 01</h2>

            <h3>Carrelage</h3>

            <p>
                Carrelage 60 × 60 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Faïence</h3>

            <p>
                Faïence douche 60 × 120 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Crédence</h3>

            <p>
                Crédence meuble vasque 10 × 10 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

        `;

    }


    return content;

}



/* ============================================================
   OUVERTURE DE LA FICHE
   ============================================================ */

function showInfo(type) {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    const infoContent =
        document.getElementById(
            "infoContent"
        );


    infoContent.innerHTML =
        getInfoContent(type);


    infoBox.style.display =
        "block";


    /*
     * On place la fiche initialement
     * au centre de l'écran.
     */

    positionInfoBox();

}



/* ============================================================
   POSITIONNEMENT DE LA FICHE
   ============================================================ */

function positionInfoBox() {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    /*
     * Dimensions de l'écran.
     */

    const screenWidth =
        window.innerWidth;


    const screenHeight =
        window.innerHeight;


    /*
     * Dimensions de la fiche.
     */

    const boxWidth =
        infoBox.offsetWidth;


    const boxHeight =
        infoBox.offsetHeight;


    /*
     * Centrage.
     */

    let left =
        (
            screenWidth -
            boxWidth
        ) / 2;


    let top =
        (
            screenHeight -
            boxHeight
        ) / 2;


    /*
     * Marges de sécurité.
     */

    left =
        Math.max(
            10,
            left
        );


    top =
        Math.max(
            10,
            top
        );


    /*
     * Empêcher de sortir de l'écran.
     */

    if (
        left +
        boxWidth >
        screenWidth -
        10
    ) {

        left =
            screenWidth -
            boxWidth -
            10;

    }


    if (
        top +
        boxHeight >
        screenHeight -
        10
    ) {

        top =
            screenHeight -
            boxHeight -
            10;

    }


    infoBox.style.left =
        left + "px";


    infoBox.style.top =
        top + "px";

}



/* ============================================================
   FERMETURE
   ============================================================ */

function closeInfo() {


    document.getElementById(
        "infoBox"
    ).style.display =
        "none";

}



/* ============================================================
   REDIMENSIONNEMENT DE L'ÉCRAN
   ============================================================ */

window.addEventListener(
    "resize",
    function() {


        const infoBox =
            document.getElementById(
                "infoBox"
            );


        if (
            infoBox.style.display ===
            "block"
        ) {

            positionInfoBox();

        }

    }
);


</script>


</body>

</html>
