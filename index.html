<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Carré Côté - Plan interactif</title>


<style>

/* =========================================================
   BASE
   ========================================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #eeeeee;

}


/* =========================================================
   ZONE DE VISUALISATION
   ========================================================= */

#viewer {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #eeeeee;

    touch-action: none;

    cursor: grab;

}


#viewer.dragging {

    cursor: grabbing;

}


/* =========================================================
   CALQUE DU PLAN
   ========================================================= */

#planLayer {

    position: absolute;

    left: 0;
    top: 0;

    transform-origin: 0 0;

    will-change: transform;

}


/* =========================================================
   IMAGE
   ========================================================= */

#plan {

    display: block;

    width: auto;
    height: auto;

    max-width: none;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;

}


/* =========================================================
   CALQUE DES PASTILLES
   ========================================================= */

#hotspotLayer {

    position: fixed;

    inset: 0;

    z-index: 100;

    pointer-events: none;

}


/* =========================================================
   PASTILLES
   ========================================================= */

.hotspot {

    position: absolute !important;

    width: 20px !important;
    height: 20px !important;

    min-width: 20px !important;
    min-height: 20px !important;

    max-width: 20px !important;
    max-height: 20px !important;

    margin: 0 !important;
    padding: 0 !important;

    box-sizing: border-box;

    border-radius: 50%;

    border: 2px solid white;

    cursor: pointer;

    /*
     * La pastille est indépendante
     * du zoom du plan.
     */

    transform:
        translate(-50%, -50%)
        !important;

    z-index: 101;

    pointer-events: auto;

    touch-action: none;

}


/*
 * Zone tactile invisible.
 */

.hotspot::before {

    content: "";

    position: absolute;

    width: 44px;
    height: 44px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

}


/* Survol uniquement sur ordinateur */

@media (hover: hover) {

    .hotspot:hover {

        transform:
            translate(-50%, -50%)
            scale(1.3)
            !important;

    }

}


/* =========================================================
   COULEURS
   ========================================================= */

.vasque {

    background: #4d8acb;

}


.wc {

    background: #d9534f;

}


.douche {

    background: #4caf7a;

}


.sol-mur {

    background: #df9629;

}


/* =========================================================
   FENÊTRE D'INFORMATION
   ========================================================= */

.info-box {

    display: none;

    position: fixed;

    z-index: 1000;

    width: 450px;

    max-width:
        calc(100vw - 30px);

    max-height:
        calc(100vh - 30px);

    box-sizing: border-box;

    padding: 25px;

    background: white;

    border-radius: 12px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.25);

    overflow-y: auto;

    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    touch-action: pan-y;

}


/* =========================================================
   CONTENU
   ========================================================= */

.info-box h2 {

    margin-top: 0;

    padding-right: 25px;

    font-size: 22px;

}


.info-box h3 {

    margin-top: 20px;

    margin-bottom: 6px;

    font-size: 16px;

}


.info-box p {

    margin-top: 0;

    line-height: 1.5;

    font-size: 14px;

}


/* =========================================================
   BOUTON FERMER
   ========================================================= */

.close {

    position: absolute;

    right: 12px;
    top: 8px;

    width: 30px;
    height: 30px;

    line-height: 30px;

    text-align: center;

    font-size: 26px;

    cursor: pointer;

}


/* =========================================================
   TABLETTE
   ========================================================= */

@media (max-width: 900px) {

    .info-box {

        width: 360px;

        padding: 20px;

    }

}


/* =========================================================
   TELEPHONE
   ========================================================= */

@media (max-width: 600px) {

    .hotspot {

        width: 18px !important;
        height: 18px !important;

        min-width: 18px !important;
        min-height: 18px !important;

        max-width: 18px !important;
        max-height: 18px !important;

    }


    .info-box {

        width: 280px;

        max-width:
            calc(100vw - 20px);

        max-height:
            calc(100vh - 20px);

        padding: 16px;

        border-radius: 10px;

    }


    .info-box h2 {

        font-size: 18px;

    }


    .info-box h3 {

        font-size: 14px;

        margin-top: 16px;

    }


    .info-box p {

        font-size: 13px;

        line-height: 1.4;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     VISUALISEUR
     ========================================================= -->

<div id="viewer">


    <!-- PLAN -->

    <div id="planLayer">

        <img
            id="plan"
            src="PCG AYREM - RDC ind2 - 2026-07-02.png"
            alt="Plan RDC"
            draggable="false"
        >

    </div>


    <!-- PASTILLES -->

    <div id="hotspotLayer">


        <div
            class="hotspot vasque"
            data-id="vasque"
            title="Vasque"
        ></div>


        <div
            class="hotspot wc"
            data-id="wc"
            title="WC"
        ></div>


        <div
            class="hotspot douche"
            data-id="douche"
            title="Douche"
        ></div>


        <div
            class="hotspot sol-mur"
            data-id="sol-mur"
            title="Sol et mur"
        ></div>


    </div>

</div>


<!-- =========================================================
     FICHE
     ========================================================= -->

<div
    class="info-box"
    id="infoBox"
>

    <span
        class="close"
        id="closeButton"
    >
        ×
    </span>


    <div
        id="infoContent"
    ></div>

</div>


<script>

/* =========================================================
   ELEMENTS
   ========================================================= */

const viewer =
    document.getElementById(
        "viewer"
    );


const planLayer =
    document.getElementById(
        "planLayer"
    );


const plan =
    document.getElementById(
        "plan"
    );


const infoBox =
    document.getElementById(
        "infoBox"
    );


const infoContent =
    document.getElementById(
        "infoContent"
    );


const closeButton =
    document.getElementById(
        "closeButton"
    );


const hotspots =
    document.querySelectorAll(
        ".hotspot"
    );


/* =========================================================
   DIMENSIONS IMAGE
   ========================================================= */

let imageWidth = 0;

let imageHeight = 0;


/* =========================================================
   POSITION / ZOOM
   ========================================================= */

let scale = 1;

let offsetX = 0;

let offsetY = 0;


/* =========================================================
   LIMITES ZOOM
   ========================================================= */

const MIN_SCALE = 0.05;

const MAX_SCALE = 8;


/* =========================================================
   COORDONNEES DES PASTILLES
   ========================================================= */

const hotspotPositions = {

    vasque: {
        x: 55,
        y: 30
    },

    wc: {
        x: 58,
        y: 25
    },

    douche: {
        x: 56,
        y: 26
    },

    "sol-mur": {
        x: 58,
        y: 30
    }

};


/* =========================================================
   CHARGEMENT DU PLAN
   ========================================================= */

plan.onload = function() {


    imageWidth =
        plan.naturalWidth;


    imageHeight =
        plan.naturalHeight;


    plan.width =
        imageWidth;


    plan.height =
        imageHeight;


    fitPlan();

};


/* =========================================================
   AJUSTEMENT INITIAL
   ========================================================= */

function fitPlan() {


    const vw =
        viewer.clientWidth;


    const vh =
        viewer.clientHeight;


    const scaleX =
        vw / imageWidth;


    const scaleY =
        vh / imageHeight;


    scale =
        Math.min(
            scaleX,
            scaleY
        );


    offsetX =
        (
            vw -
            imageWidth * scale
        ) / 2;


    offsetY =
        (
            vh -
            imageHeight * scale
        ) / 2;


    updatePlan();

}


/* =========================================================
   MISE A JOUR DU PLAN
   ========================================================= */

function updatePlan() {


    planLayer.style.transform =
        `
        translate3d(
            ${offsetX}px,
            ${offsetY}px,
            0
        )
        scale(${scale})
        `;


    updateHotspots();

}


/* =========================================================
   MISE A JOUR DES PASTILLES
   ========================================================= */

function updateHotspots() {


    hotspots.forEach(
        function(hotspot) {


            const id =
                hotspot.dataset.id;


            const pos =
                hotspotPositions[id];


            if (!pos) {

                return;

            }


            /*
             * Position dans l'image originale.
             */

            const imageX =
                imageWidth *
                pos.x /
                100;


            const imageY =
                imageHeight *
                pos.y /
                100;


            /*
             * Position écran.
             */

            const screenX =
                offsetX +
                imageX *
                scale;


            const screenY =
                offsetY +
                imageY *
                scale;


            /*
             * La pastille reste dans
             * le calque fixe.
             */

            hotspot.style.left =
                screenX + "px";


            hotspot.style.top =
                screenY + "px";

        }
    );

}


/* =========================================================
   ZOOM AUTOUR DU CURSEUR / DOIGT
   ========================================================= */

function zoomAt(
    screenX,
    screenY,
    newScale
) {


    const imageX =
        (
            screenX -
            offsetX
        ) / scale;


    const imageY =
        (
            screenY -
            offsetY
        ) / scale;


    newScale =
        Math.max(
            MIN_SCALE,
            Math.min(
                MAX_SCALE,
                newScale
            )
        );


    offsetX =
        screenX -
        imageX *
        newScale;


    offsetY =
        screenY -
        imageY *
        newScale;


    scale =
        newScale;


    updatePlan();

}


/* =========================================================
   SOURIS
   ========================================================= */

let mouseDown = false;

let mouseMoved = false;

let mouseStartX = 0;

let mouseStartY = 0;

let startOffsetX = 0;

let startOffsetY = 0;


/* ---------------------------------------------------------
   MOUSE DOWN
   --------------------------------------------------------- */

viewer.addEventListener(
    "mousedown",
    function(event) {


        if (
            event.button !== 0
        ) {

            return;

        }


        mouseDown = true;

        mouseMoved = false;


        mouseStartX =
            event.clientX;


        mouseStartY =
            event.clientY;


        startOffsetX =
            offsetX;


        startOffsetY =
            offsetY;


        viewer.classList.add(
            "dragging"
        );

    }
);


/* ---------------------------------------------------------
   MOUSE MOVE
   --------------------------------------------------------- */

window.addEventListener(
    "mousemove",
    function(event) {


        if (!mouseDown) {

            return;

        }


        const dx =
            event.clientX -
            mouseStartX;


        const dy =
            event.clientY -
            mouseStartY;


        if (
            Math.abs(dx) > 3 ||
            Math.abs(dy) > 3
        ) {

            mouseMoved = true;

        }


        offsetX =
            startOffsetX +
            dx;


        offsetY =
            startOffsetY +
            dy;


        updatePlan();

    }
);


/* ---------------------------------------------------------
   MOUSE UP
   --------------------------------------------------------- */

window.addEventListener(
    "mouseup",
    function(event) {


        if (!mouseDown) {

            return;

        }


        mouseDown = false;


        viewer.classList.remove(
            "dragging"
        );


        /*
         * Un clic sans déplacement
         * peut sélectionner une pastille.
         */

        if (!mouseMoved) {


            checkHotspot(
                event.clientX,
                event.clientY
            );

        }

    }
);


/* =========================================================
   MOLETTE
   ========================================================= */

viewer.addEventListener(
    "wheel",
    function(event) {


        event.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        const factor =
            event.deltaY < 0
                ? 1.12
                : 1 / 1.12;


        zoomAt(
            x,
            y,
            scale * factor
        );

    },
    {
        passive: false
    }
);


/* =========================================================
   GESTION TACTILE
   ========================================================= */

let touchState =
    "none";


let touchStartX = 0;

let touchStartY = 0;

let touchStartOffsetX = 0;

let touchStartOffsetY = 0;

let touchHasMoved = false;

let pinchStartDistance = 0;

let pinchStartScale = 1;


/* =========================================================
   TOUCH START
   ========================================================= */

viewer.addEventListener(
    "touchstart",
    function(event) {


        event.preventDefault();


        /*
         * DEUX DOIGTS
         * = PINCH
         */

        if (
            event.touches.length === 2
        ) {


            touchState =
                "pinch";


            pinchStartDistance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            pinchStartScale =
                scale;


            touchHasMoved =
                true;


            return;

        }


        /*
         * UN DOIGT
         * = déplacement potentiel
         * ou clic sur pastille
         */

        if (
            event.touches.length === 1
        ) {


            touchState =
                "drag";


            touchHasMoved =
                false;


            touchStartX =
                event.touches[0].clientX;


            touchStartY =
                event.touches[0].clientY;


            touchStartOffsetX =
                offsetX;


            touchStartOffsetY =
                offsetY;

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH MOVE
   ========================================================= */

viewer.addEventListener(
    "touchmove",
    function(event) {


        event.preventDefault();


        /*
         * PINCH
         */

        if (
            event.touches.length === 2
        ) {


            touchState =
                "pinch";


            touchHasMoved =
                true;


            const distance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            const center =
                getTouchCenter(
                    event.touches[0],
                    event.touches[1]
                );


            const rect =
                viewer.getBoundingClientRect();


            const x =
                center.x -
                rect.left;


            const y =
                center.y -
                rect.top;


            const newScale =
                pinchStartScale *
                (
                    distance /
                    pinchStartDistance
                );


            zoomAt(
                x,
                y,
                newScale
            );


            return;

        }


        /*
         * DEPLACEMENT
         */

        if (
            event.touches.length === 1 &&
            touchState === "drag"
        ) {


            const dx =
                event.touches[0].clientX -
                touchStartX;


            const dy =
                event.touches[0].clientY -
                touchStartY;


            if (
                Math.abs(dx) > 8 ||
                Math.abs(dy) > 8
            ) {

                touchHasMoved =
                    true;

            }


            offsetX =
                touchStartOffsetX +
                dx;


            offsetY =
                touchStartOffsetY +
                dy;


            updatePlan();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH END
   ========================================================= */

viewer.addEventListener(
    "touchend",
    function(event) {


        event.preventDefault();


        /*
         * S'il reste un doigt après
         * un pinch, on passe en déplacement.
         */

        if (
            event.touches.length === 1
        ) {


            touchState =
                "drag";


            touchStartX =
                event.touches[0].clientX;


            touchStartY =
                event.touches[0].clientY;


            touchStartOffsetX =
                offsetX;


            touchStartOffsetY =
                offsetY;


            touchHasMoved =
                true;


            return;

        }


        /*
         * FIN DU GESTE
         */

        if (
            event.touches.length === 0
        ) {


            /*
             * Si le doigt n'a quasiment
             * pas bougé = CLIC.
             */

            if (
                touchState === "drag" &&
                !touchHasMoved &&
                event.changedTouches.length === 1
            ) {


                const touch =
                    event.changedTouches[0];


                checkHotspot(
                    touch.clientX,
                    touch.clientY
                );

            }


            touchState =
                "none";

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH CANCEL
   ========================================================= */

viewer.addEventListener(
    "touchcancel",
    function() {


        touchState =
            "none";


        touchHasMoved =
            true;

    }
);


/* =========================================================
   DISTANCE PINCH
   ========================================================= */

function getDistance(
    a,
    b
) {


    const dx =
        b.clientX -
        a.clientX;


    const dy =
        b.clientY -
        a.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   CENTRE PINCH
   ========================================================= */

function getTouchCenter(
    a,
    b
) {


    return {

        x:
            (
                a.clientX +
                b.clientX
            ) / 2,

        y:
            (
                a.clientY +
                b.clientY
            ) / 2

    };

}


/* =========================================================
   DETECTION D'UNE PASTILLE
   ========================================================= */

function checkHotspot(
    clientX,
    clientY
) {


    const hitRadius =
        30;


    let selected =
        null;


    let bestDistance =
        Infinity;


    hotspots.forEach(
        function(hotspot) {


            const id =
                hotspot.dataset.id;


            const pos =
                hotspotPositions[id];


            const imageX =
                imageWidth *
                pos.x /
                100;


            const imageY =
                imageHeight *
                pos.y /
                100;


            const hotspotX =
                offsetX +
                imageX *
                scale;


            const hotspotY =
                offsetY +
                imageY *
                scale;


            const dx =
                clientX -
                hotspotX;


            const dy =
                clientY -
                hotspotY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                hitRadius &&
                distance <
                bestDistance
            ) {


                selected =
                    hotspot;


                bestDistance =
                    distance;

            }

        }
    );


    if (selected) {


        showInfo(
            selected.dataset.id
        );

    }

}


/* =========================================================
   CONTENU DES FICHES
   ========================================================= */

function getInfoContent(
    type
) {


    if (

    ) {

            </p>

            </p>

        `;

    }


    return "";

}


/* =========================================================
   OUVERTURE FICHE
   ========================================================= */

function showInfo(
    type
) {


    infoContent.innerHTML =
        getInfoContent(
            type
        );


    infoBox.style.display =
        "block";


    /*
     * Positionnement centré
     * indépendamment du zoom.
     */

    requestAnimationFrame(
        function() {


            const width =
                infoBox.offsetWidth;


            const height =
                infoBox.offsetHeight;


            let left =
                (
                    window.innerWidth -
                    width
                ) / 2;


            let top =
                (
                    window.innerHeight -
                    height
                ) / 2;


            left =
                Math.max(
                    10,
                    left
                );


            top =
                Math.max(
                    10,
                    top
                );


            infoBox.style.left =
                left + "px";


            infoBox.style.top =
                top + "px";

        }
    );

}


/* =========================================================
   FERMETURE
   ========================================================= */

function closeInfo() {


    infoBox.style.display =
        "none";

}


closeButton.addEventListener(
    "click",
    function(event) {


        event.stopPropagation();


        closeInfo();

    }
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function() {


        updatePlan();


        if (
            infoBox.style.display ===
            "block"
        ) {


            const width =
                infoBox.offsetWidth;


            const height =
                infoBox.offsetHeight;


            const left =
                Math.max(
                    10,
                    (
                        window.innerWidth -
                        width
                    ) / 2
                );


            const top =
                Math.max(
                    10,
                    (
                        window.innerHeight -
                        height
                    ) / 2
                );


            infoBox.style.left =
                left + "px";


            infoBox.style.top =
                top + "px";

        }

    }
);


/* =========================================================
   ESCAPE
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Escape"
        ) {

            closeInfo();

        }

    }
);

</script>
