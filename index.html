<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carré Côté - Plan interactif</title>


    <style>

        /* =========================
           PAGE
        ========================= */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eeeeee;
        }


        /* =========================
           PLAN
        ========================= */

        .plan-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .plan {
            width: 100%;
            display: block;
        }


        /* =========================
           PASTILLES
           ========================= */

        .hotspot {

            position: absolute;

            width: 1%;
            aspect-ratio: 1 / 1;

            border-radius: 50%;

            border: 1px solid white;

            cursor: pointer;

            transform: translate(-50%, -50%);

            transition: transform 0.15s ease;

            z-index: 10;

            touch-action: manipulation;

            user-select: none;
            -webkit-user-select: none;
        }


        /* Effet au survol sur ordinateur */

        .hotspot:hover {

            transform:
                translate(-50%, -50%)
                scale(1.5);

        }


        /* =========================
           COULEURS DES PASTILLES
           ========================= */

        .vasque {
            background: #4d8acb;
        }

        .wc {
            background: #d9534f;
        }

        .douche {
            background: #4caf7a;
        }

        .sol-mur {
            background: #df9629;
        }


        /* =========================
           FENÊTRE D'INFORMATION
           ========================= */

        .info-box {

            display: none;

            /*
             * La fenêtre est attachée
             * au plan et non à l'écran.
             */
            position: absolute;

            width: 450px;

            max-width: 400px;

            max-height: 500px;

            overflow-y: auto;
            overflow-x: hidden;

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.25);

            z-index: 1000;

            box-sizing: border-box;

            -webkit-overflow-scrolling: touch;
        }


        /* =========================
           TITRES
           ========================= */

        .info-box h2 {

            margin-top: 0;

            padding-right: 25px;

        }


        .info-box h3 {

            margin-bottom: 6px;

        }


        .info-box p {

            line-height: 1.5;

        }


        /* =========================
           BOUTON FERMER
           ========================= */

        .close {

            position: absolute;

            right: 15px;
            top: 10px;

            font-size: 24px;

            cursor: pointer;

            line-height: 1;

        }


        /* =========================
           TABLETTE
           ========================= */

        @media (max-width: 900px) {

            .info-box {

                width: 340px;

                max-width: 340px;

                max-height: 450px;

                padding: 20px;

            }

            .info-box h2 {

                font-size: 20px;

            }

            .info-box h3 {

                font-size: 15px;

            }

            .info-box p {

                font-size: 14px;

            }

        }


        /* =========================
           TÉLÉPHONE
           ========================= */

        @media (max-width: 600px) {

            .info-box {

                width: 280px;

                max-width: 280px;

                max-height: 350px;

                padding: 16px;

                border-radius: 10px;

            }

            .info-box h2 {

                font-size: 18px;

            }

            .info-box h3 {

                font-size: 14px;

                margin-bottom: 5px;

            }

            .info-box p {

                font-size: 13px;

                line-height: 1.4;

            }

            .close {

                right: 12px;

                top: 9px;

                font-size: 22px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     PLAN
     ===================================================== -->

<div class="plan-container">


    <!-- IMAGE DU PLAN -->

    <img
        src="PCG AYREM - RDC ind2 - 2026-07-02.png"
        class="plan"
        alt="Plan RDC"
    >


    <!-- =================================================
         PASTILLE VASQUE
         ================================================= -->

    <div
        class="hotspot vasque"
        style="left: 55%; top: 30%;"
        onclick="showInfo('vasque', this)"
        title="Vasque"
    ></div>


    <!-- =================================================
         PASTILLE WC
         ================================================= -->

    <div
        class="hotspot wc"
        style="left: 58%; top: 25%;"
        onclick="showInfo('wc', this)"
        title="WC"
    ></div>


    <!-- =================================================
         PASTILLE DOUCHE
         ================================================= -->

    <div
        class="hotspot douche"
        style="left: 56%; top: 26%;"
        onclick="showInfo('douche', this)"
        title="Douche"
    ></div>


    <!-- =================================================
         PASTILLE SOL ET MUR
         ================================================= -->

    <div
        class="hotspot sol-mur"
        style="left: 58%; top: 30%;"
        onclick="showInfo('sol-mur', this)"
        title="Sol et mur"
    ></div>


    <!-- =================================================
         FENÊTRE D'INFORMATION
         ================================================= -->

    <div
        class="info-box"
        id="infoBox"
    >

        <span
            class="close"
            onclick="closeInfo()"
        >
            ×
        </span>

        <div id="infoContent"></div>

    </div>


</div>


<script>


/* =====================================================
   OUVERTURE D'UNE FICHE
   ===================================================== */

function showInfo(type, hotspot) {


    let content = "";


    /* =================================================
       VASQUE
       ================================================= */

    if (type === "vasque") {

        content = `

            <h2>Vasque — SDB 01</h2>

            <h3>Meuble</h3>

            <p>
                Meuble vasque 120 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Vasque</h3>

            <p>
                Vasque à poser<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Mitigeur</h3>

            <p>
                Mitigeur lavabo<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Miroir</h3>

            <p>
                Miroir 120 × 80 cm<br>
                Référence : XXX
            </p>

        `;

    }


    /* =================================================
       WC
       ================================================= */

    if (type === "wc") {

        content = `

            <h2>WC — SDB 01</h2>

            <h3>Bâti-support</h3>

            <p>
                Fabricant : XXX<br>
                Modèle : XXX<br>
                Référence : XXX
            </p>

            <h3>Cuvette suspendue</h3>

            <p>
                Fabricant : XXX<br>
                Modèle : XXX<br>
                Référence : XXX
            </p>

            <h3>Plaque de commande</h3>

            <p>
                Fabricant : XXX<br>
                Modèle : XXX<br>
                Finition : XXX
            </p>

        `;

    }


    /* =================================================
       DOUCHE
       ================================================= */

    if (type === "douche") {

        content = `

            <h2>Douche — SDB 01</h2>

            <h3>Receveur</h3>

            <p>
                Receveur 120 × 90 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Mitigeur</h3>

            <p>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Colonne de douche</h3>

            <p>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Faïence</h3>

            <p>
                Fabricant : XXX<br>
                Référence : XXX<br>
                Format : 60 × 120 cm
            </p>

        `;

    }


    /* =================================================
       SOL ET MUR
       ================================================= */

    if (type === "sol-mur") {

        content = `

            <h2>Sol et mur — SDB 01</h2>

            <h3>Carrelage</h3>

            <p>
                Carrelage 60 × 60 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Faïence</h3>

            <p>
                Faïence douche 60 × 120 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Crédence</h3>

            <p>
                Crédence meuble vasque 10 × 10 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

        `;

    }


    /* =================================================
       AFFICHAGE DU CONTENU
       ================================================= */

    const infoBox =
        document.getElementById("infoBox");

    const infoContent =
        document.getElementById("infoContent");


    infoContent.innerHTML = content;


    /* Affichage temporaire pour connaître
       les dimensions de la fenêtre */

    infoBox.style.display = "block";


    /* =================================================
       CALCUL DE LA POSITION
       ================================================= */

    const hotspotLeft =
        hotspot.offsetLeft;

    const hotspotTop =
        hotspot.offsetTop;


    const boxWidth =
        infoBox.offsetWidth;

    const boxHeight =
        infoBox.offsetHeight;


    const container =
        document.querySelector(".plan-container");


    const containerWidth =
        container.offsetWidth;

    const containerHeight =
        container.offsetHeight;


    /* =================================================
       POSITION HORIZONTALE
       ================================================= */

    let left;


    if (
        hotspotLeft +
        boxWidth +
        30 <
        containerWidth
    ) {

        /* À droite de la pastille */

        left =
            hotspotLeft + 20;

    }

    else {

        /* À gauche de la pastille */

        left =
            hotspotLeft -
            boxWidth -
            20;

    }


    /* =================================================
       POSITION VERTICALE
       ================================================= */

    let top;


    if (
        hotspotTop +
        boxHeight +
        30 <
        containerHeight
    ) {

        /* Sous la pastille */

        top =
            hotspotTop + 20;

    }

    else {

        /* Au-dessus de la pastille */

        top =
            hotspotTop -
            boxHeight -
            20;

    }


    /* =================================================
       ÉVITER QUE LA FENÊTRE SORTE DU PLAN
       ================================================= */

    left =
        Math.max(
            10,
            Math.min(
                left,
                containerWidth -
                boxWidth -
                10
            )
        );


    top =
        Math.max(
            10,
            Math.min(
                top,
                containerHeight -
                boxHeight -
                10
            )
        );


    /* =================================================
       APPLICATION DE LA POSITION
       ================================================= */

    infoBox.style.left =
        left + "px";

    infoBox.style.top =
        top + "px";

}


/* =====================================================
   FERMETURE
   ===================================================== */

function closeInfo() {

    document.getElementById(
        "infoBox"
    ).style.display = "none";

}


</script>


</body>

</html>
