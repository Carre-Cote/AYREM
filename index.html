<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
>

<title>Carré Côté - Plan interactif</title>

<style>

/* =========================================================
   PAGE
   ========================================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    font-family: Arial, sans-serif;

    background: #eeeeee;

    overflow: hidden;

}


/* =========================================================
   ZONE DE VISUALISATION
   ========================================================= */

.viewer {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #eeeeee;

    touch-action: none;

}


/* =========================================================
   CONTENEUR DU PLAN
   ========================================================= */

.plan-container {

    position: absolute;

    left: 0;
    top: 0;

    transform-origin: 0 0;

    will-change: transform;

}


/* =========================================================
   IMAGE
   ========================================================= */

.plan {

    display: block;

    width: 100%;

    height: auto;

    user-select: none;

    -webkit-user-select: none;

    pointer-events: none;

}


/* =========================================================
   PASTILLES
   ========================================================= */

.hotspot {

    position: absolute;

    width: 1%;

    aspect-ratio: 1 / 1;

    border-radius: 50%;

    border: 1px solid white;

    cursor: pointer;

    transform:
        translate(-50%, -50%);

    z-index: 20;

    touch-action: manipulation;

    box-sizing: border-box;

}


/* Survol uniquement PC */

@media (hover: hover) {

    .hotspot:hover {

        transform:
            translate(-50%, -50%)
            scale(1.5);

    }

}


/* =========================================================
   COULEURS
   ========================================================= */

.vasque {

    background: #4d8acb;

}


.wc {

    background: #d9534f;

}


.douche {

    background: #4caf7a;

}


.sol-mur {

    background: #df9629;

}


/* =========================================================
   FENÊTRE D'INFORMATION
   ========================================================= */

.info-box {

    display: none;

    position: fixed;

    width: 450px;

    max-width:
        calc(100vw - 30px);

    max-height:
        calc(100vh - 30px);

    padding: 25px;

    box-sizing: border-box;

    background: white;

    border-radius: 12px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.25);

    z-index: 1000;

    overflow-y: auto;

    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    touch-action: pan-y;

}


/* =========================================================
   TITRES
   ========================================================= */

.info-box h2 {

    margin-top: 0;

    padding-right: 30px;

    font-size: 22px;

}


.info-box h3 {

    margin-top: 20px;

    margin-bottom: 6px;

    font-size: 16px;

}


.info-box p {

    margin-top: 0;

    line-height: 1.5;

    font-size: 14px;

}


/* =========================================================
   FERMER
   ========================================================= */

.close {

    position: absolute;

    right: 12px;

    top: 8px;

    width: 30px;

    height: 30px;

    line-height: 30px;

    text-align: center;

    font-size: 25px;

    cursor: pointer;

    z-index: 10;

}


/* =========================================================
   TABLETTE
   ========================================================= */

@media (max-width: 900px) {

    .info-box {

        width: 360px;

        max-height:
            calc(100vh - 30px);

        padding: 20px;

    }


    .info-box h2 {

        font-size: 20px;

    }


    .info-box h3 {

        font-size: 15px;

    }


    .info-box p {

        font-size: 14px;

    }

}


/* =========================================================
   TELEPHONE
   ========================================================= */

@media (max-width: 600px) {

    .info-box {

        width: 280px;

        max-width:
            calc(100vw - 20px);

        max-height:
            calc(100vh - 20px);

        padding: 16px;

        border-radius: 10px;

    }


    .info-box h2 {

        font-size: 18px;

    }


    .info-box h3 {

        font-size: 14px;

        margin-top: 16px;

    }


    .info-box p {

        font-size: 13px;

        line-height: 1.4;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     ZONE DE ZOOM
     ========================================================= -->

<div
    class="viewer"
    id="viewer"
>


    <div
        class="plan-container"
        id="planContainer"
    >


        <img
            src="PCG AYREM - RDC ind2 - 2026-07-02.png"
            class="plan"
            id="plan"
            alt="Plan RDC"
        >


        <!-- VASQUE -->

        <div
            class="hotspot vasque"
            style="left:55%; top:30%;"
            onclick="showInfo('vasque', this)"
            title="Vasque"
        ></div>


        <!-- WC -->

        <div
            class="hotspot wc"
            style="left:58%; top:25%;"
            onclick="showInfo('wc', this)"
            title="WC"
        ></div>


        <!-- DOUCHE -->

        <div
            class="hotspot douche"
            style="left:56%; top:26%;"
            onclick="showInfo('douche', this)"
            title="Douche"
        ></div>


        <!-- SOL / MUR -->

        <div
            class="hotspot sol-mur"
            style="left:58%; top:30%;"
            onclick="showInfo('sol-mur', this)"
            title="Sol et mur"
        ></div>


    </div>

</div>



<!-- =========================================================
     FENÊTRE D'INFORMATION
     ========================================================= -->

<div
    class="info-box"
    id="infoBox"
>

    <span
        class="close"
        onclick="closeInfo()"
    >
        ×
    </span>


    <div
        id="infoContent"
    ></div>

</div>



<script>


/* =========================================================
   VARIABLES DU ZOOM
   ========================================================= */

const viewer =
    document.getElementById("viewer");


const planContainer =
    document.getElementById("planContainer");


const plan =
    document.getElementById("plan");


let scale = 1;

let translateX = 0;

let translateY = 0;


let startDistance = 0;

let startScale = 1;

let startX = 0;

let startY = 0;

let startTranslateX = 0;

let startTranslateY = 0;


/*
 * Limites du zoom
 */

const MIN_SCALE = 1;

const MAX_SCALE = 4;


/* =========================================================
   APPLICATION DU ZOOM
   ========================================================= */

function applyTransform() {

    planContainer.style.transform =
        "translate(" +
        translateX +
        "px, " +
        translateY +
        "px) scale(" +
        scale +
        ")";

}


/* =========================================================
   DISTANCE ENTRE DEUX DOIGTS
   ========================================================= */

function getDistance(touch1, touch2) {

    const dx =
        touch2.clientX -
        touch1.clientX;

    const dy =
        touch2.clientY -
        touch1.clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   CENTRE ENTRE DEUX DOIGTS
   ========================================================= */

function getTouchCenter(touch1, touch2) {

    return {

        x:
            (
                touch1.clientX +
                touch2.clientX
            ) / 2,

        y:
            (
                touch1.clientY +
                touch2.clientY
            ) / 2

    };

}


/* =========================================================
   GESTION DU TOUCH
   ========================================================= */

viewer.addEventListener(
    "touchstart",
    function(event) {


        /*
         * Deux doigts = zoom
         */

        if (
            event.touches.length === 2
        ) {

            startDistance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );

            startScale =
                scale;

            return;

        }


        /*
         * Un doigt = déplacement
         */

        if (
            event.touches.length === 1
        ) {

            startX =
                event.touches[0].clientX;

            startY =
                event.touches[0].clientY;

            startTranslateX =
                translateX;

            startTranslateY =
                translateY;

        }

    },
    {
        passive: false
    }
);



viewer.addEventListener(
    "touchmove",
    function(event) {


        /*
         * Zoom à deux doigts
         */

        if (
            event.touches.length === 2
        ) {

            event.preventDefault();


            const distance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            const center =
                getTouchCenter(
                    event.touches[0],
                    event.touches[1]
                );


            if (
                startDistance === 0
            ) {

                return;

            }


            let newScale =
                startScale *
                (
                    distance /
                    startDistance
                );


            /*
             * Limites
             */

            newScale =
                Math.max(
                    MIN_SCALE,
                    Math.min(
                        MAX_SCALE,
                        newScale
                    )
                );


            /*
             * Coordonnées du point
             * sous les doigts avant zoom.
             */

            const worldX =
                (
                    center.x -
                    startTranslateX
                ) /
                startScale;


            const worldY =
                (
                    center.y -
                    startTranslateY
                ) /
                startScale;


            /*
             * Conservation du point
             * sous les doigts.
             */

            translateX =
                center.x -
                worldX *
                newScale;


            translateY =
                center.y -
                worldY *
                newScale;


            scale =
                newScale;


            applyTransform();

            return;

        }


        /*
         * Déplacement à un doigt
         */

        if (
            event.touches.length === 1
        ) {

            event.preventDefault();


            const dx =
                event.touches[0].clientX -
                startX;


            const dy =
                event.touches[0].clientY -
                startY;


            translateX =
                startTranslateX +
                dx;


            translateY =
                startTranslateY +
                dy;


            applyTransform();

        }

    },
    {
        passive: false
    }
);



viewer.addEventListener(
    "touchend",
    function() {

        startDistance = 0;

    }
);



/* =========================================================
   ZOOM À LA MOLETTE SUR ORDINATEUR
   ========================================================= */

viewer.addEventListener(
    "wheel",
    function(event) {


        /*
         * Ctrl + molette
         * ou molette seule
         */

        event.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const mouseX =
            event.clientX -
            rect.left;


        const mouseY =
            event.clientY -
            rect.top;


        const oldScale =
            scale;


        const zoomFactor =
            event.deltaY < 0
                ? 1.15
                : 0.87;


        let newScale =
            oldScale *
            zoomFactor;


        newScale =
            Math.max(
                MIN_SCALE,
                Math.min(
                    MAX_SCALE,
                    newScale
                )
            );


        /*
         * Point du plan sous la souris
         */

        const worldX =
            (
                mouseX -
                translateX
            ) /
            oldScale;


        const worldY =
            (
                mouseY -
                translateY
            ) /
            oldScale;


        /*
         * Conservation du point
         */

        translateX =
            mouseX -
            worldX *
            newScale;


        translateY =
            mouseY -
            worldY *
            newScale;


        scale =
            newScale;


        applyTransform();

    },
    {
        passive: false
    }
);


/* =========================================================
   CONTENU DES FICHES
   ========================================================= */

function getInfoContent(type) {

    }


    return content;

}


/* =========================================================
   OUVERTURE D'UNE FICHE
   ========================================================= */

function showInfo(type, hotspot) {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    const infoContent =
        document.getElementById(
            "infoContent"
        );


    /*
     * Contenu
     */

    infoContent.innerHTML =
        getInfoContent(type);


    /*
     * Affichage
     */

    infoBox.style.display =
        "block";


    /*
     * On attend que le navigateur
     * ait calculé les dimensions.
     */

    requestAnimationFrame(
        function() {

            positionInfoBox(hotspot);

        }
    );

}


/* =========================================================
   POSITIONNEMENT DE LA FICHE
   ========================================================= */

function positionInfoBox(hotspot) {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    /*
     * Position réelle de la pastille
     * dans l'écran.
     *
     * Cette méthode tient compte
     * du zoom du plan.
     */

    const rect =
        hotspot.getBoundingClientRect();


    const boxWidth =
        infoBox.offsetWidth;


    const boxHeight =
        infoBox.offsetHeight;


    const viewportWidth =
        window.innerWidth;


    const viewportHeight =
        window.innerHeight;


    const gap = 15;


    /*
     * Centre de la pastille
     */

    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let left;

    let top;


    /* =====================================================
       HORIZONTAL
       ===================================================== */


    /*
     * Priorité :
     * à droite de la pastille.
     */

    if (
        rect.right +
        gap +
        boxWidth
        <=
        viewportWidth
    ) {

        left =
            rect.right +
            gap;

    }


    /*
     * Sinon à gauche.
     */

    else if (
        rect.left -
        gap -
        boxWidth
        >=
        0
    ) {

        left =
            rect.left -
            gap -
            boxWidth;

    }


    /*
     * Sinon centrée.
     */

    else {

        left =
            centerX -
            boxWidth / 2;

    }


    /* =====================================================
       VERTICAL
       ===================================================== */


    /*
     * On centre verticalement
     * sur la pastille.
     */

    top =
        centerY -
        boxHeight / 2;


    /*
     * Marges écran.
     */

    const margin = 10;


    /*
     * Limite haute.
     */

    if (
        top < margin
    ) {

        top = margin;

    }


    /*
     * Limite basse.
     */

    if (
        top +
        boxHeight
        >
        viewportHeight -
        margin
    ) {

        top =
            viewportHeight -
            boxHeight -
            margin;

    }


    /*
     * Limite gauche.
     */

    if (
        left < margin
    ) {

        left = margin;

    }


    /*
     * Limite droite.
     */

    if (
        left +
        boxWidth
        >
        viewportWidth -
        margin
    ) {

        left =
            viewportWidth -
            boxWidth -
            margin;

    }


    /*
     * Application
     */

    infoBox.style.left =
        left + "px";


    infoBox.style.top =
        top + "px";

}


/* =========================================================
   FERMETURE
   ========================================================= */

function closeInfo() {


    document.getElementById(
        "infoBox"
    ).style.display =
        "none";

}


/* =========================================================
   TOUCHE ESC
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeInfo();

        }

    }
);


/* =========================================================
   REPOSITIONNEMENT APRÈS REDIMENSIONNEMENT
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        const infoBox =
            document.getElementById(
                "infoBox"
            );


        if (
            infoBox.style.display ===
            "block"
        ) {

            /*
             * On récupère la dernière
             * pastille active.
             */

            if (window.activeHotspot) {

                positionInfoBox(
                    window.activeHotspot
                );

            }

        }

    }
);


/*
 * Mémorisation de la dernière pastille
 */

const originalShowInfo =
    showInfo;


/*
 * On remplace showInfo pour
 * mémoriser la pastille.
 */

showInfo = function(type, hotspot) {

    window.activeHotspot =
        hotspot;

    originalShowInfo(
        type,
        hotspot
    );

};


</script>


</body>
