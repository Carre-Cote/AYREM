<style>

/* =========================================================
   BASE
   ========================================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #eeeeee;

}


/* =========================================================
   VISUALISEUR
   ========================================================= */

#viewer {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #eeeeee;

    touch-action: none;

    cursor: grab;

}


#viewer.dragging {

    cursor: grabbing;

}


/* =========================================================
   SELECTEUR D'ETAGE
   ========================================================= */

#floorSelector {

    position: fixed;

    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;

    gap: 6px;

    padding: 6px;

    background: rgba(255,255,255,0.95);

    border-radius: 10px;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.20);

    z-index: 500;

}


.floor-button {

    border: none;

    background: #eeeeee;

    color: #333333;

    padding: 9px 16px;

    border-radius: 7px;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease;

}


.floor-button:hover {

    transform: scale(1.03);

}


.floor-button.active {

    background: #333333;

    color: white;

}


@media (max-width: 600px) {

    #floorSelector {

        top: 10px;

        gap: 4px;

        padding: 5px;

    }


    .floor-button {

        padding: 8px 12px;

        font-size: 13px;

    }

}


/* =========================================================
   PLAN
   ========================================================= */

#planLayer {

    position: absolute;

    left: 0;
    top: 0;

    transform-origin: 0 0;

    will-change: transform;

}


/* =========================================================
   IMAGE
   ========================================================= */

#plan {

    display: block;

    width: auto;
    height: auto;

    max-width: none;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;

}


/* =========================================================
   COUCHE DES PASTILLES
   ========================================================= */

#hotspotLayer {

    position: fixed;

    inset: 0;

    z-index: 100;

    pointer-events: none;

}


/* =========================================================
   PASTILLES
   ========================================================= */

.hotspot {

    position: absolute;

    width: 24px !important;
    height: 24px !important;

    min-width: 24px !important;
    min-height: 24px !important;

    max-width: 24px !important;
    max-height: 24px !important;

    margin: 0;
    padding: 0;

    box-sizing: border-box;

    border-radius: 50%;

    border: 2px solid white;

    transform:
        translate(-50%, -50%);

    pointer-events: auto;

    cursor: pointer;

    z-index: 101;

}


.hotspot::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 50px;
    height: 50px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

}


@media (hover: hover) {

    .hotspot:hover {

        transform:
            translate(-50%, -50%)
            scale(1.3);

    }

}


/* =========================================================
   FENETRE D'INFORMATION
   ========================================================= */

.info-box {

    display: none;

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 1000;

    width:
        min(650px, 90vw);

    height: auto;

    max-height:
        85vh;

    box-sizing: border-box;

    padding: 30px;

    background: #ffffff;

    border-radius: 14px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.30);

    overflow-y: auto;

    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    touch-action: pan-y;

}


/* =========================================================
   CONTENU FICHE
   ========================================================= */

.info-box h2 {

    margin-top: 0;

    margin-bottom: 25px;

    padding-right: 35px;

    font-size: 24px;

}


.info-box h3 {

    margin-top: 22px;

    margin-bottom: 7px;

    font-size: 17px;

}


.info-box p {

    margin-top: 0;

    margin-bottom: 14px;

    line-height: 1.5;

    font-size: 15px;

}


/* =========================================================
   BOUTON FERMER
   ========================================================= */

.close {

    position: absolute;

    right: 12px;
    top: 8px;

    width: 36px;
    height: 36px;

    line-height: 36px;

    text-align: center;

    font-size: 28px;

    cursor: pointer;

    z-index: 10;

}


/* =========================================================
   TABLETTE
   ========================================================= */

@media (max-width: 900px) {

    .info-box {

        width: 80vw;

        max-width: 80vw;

        max-height: 80vh;

        padding: 24px;

    }

}


/* =========================================================
   TELEPHONE
   ========================================================= */

@media (max-width: 600px) {

    .hotspot {

        width: 22px !important;
        height: 22px !important;

        min-width: 22px !important;
        min-height: 22px !important;

        max-width: 22px !important;
        max-height: 22px !important;

        border-width: 1px;

    }


    .hotspot::before {

        width: 50px;
        height: 50px;

    }


    .info-box {

        width: 88vw;

        max-width: 88vw;

        max-height: 75vh;

        padding: 18px;

        border-radius: 11px;

    }


    .info-box h2 {

        font-size: 19px;

        margin-bottom: 18px;

    }


    .info-box h3 {

        font-size: 15px;

        margin-top: 17px;

    }


    .info-box p {

        font-size: 13px;

        line-height: 1.45;

    }


    .close {

        right: 8px;

        top: 5px;

        font-size: 25px;

    }

}

</style>

/* =========================================================
   ETAGE ACTUEL
   ========================================================= */

let currentFloor =
    "rdc";


/* =========================================================
   ELEMENTS
   ========================================================= */

const viewer =
    document.getElementById(
        "viewer"
    );


const planLayer =
    document.getElementById(
        "planLayer"
    );


const plan =
    document.getElementById(
        "plan"
    );


const hotspotLayer =
    document.getElementById(
        "hotspotLayer"
    );


const infoBox =
    document.getElementById(
        "infoBox"
    );


const infoContent =
    document.getElementById(
        "infoContent"
    );


const closeButton =
    document.getElementById(
        "closeButton"
    );


const floorButtons =
    document.querySelectorAll(
        ".floor-button"
    );


/* =========================================================
   DIMENSIONS IMAGE
   ========================================================= */

let imageWidth = 0;

let imageHeight = 0;


/* =========================================================
   ZOOM / POSITION
   ========================================================= */

let scale = 1;

let offsetX = 0;

let offsetY = 0;


const MIN_SCALE =
    0.05;


const MAX_SCALE =
    8;


/* =========================================================
   PASTILLES
   ========================================================= */

const hotspotElements = {};


/* =========================================================
   CREATION DES PASTILLES
   ========================================================= */

function createHotspots() {


    hotspotLayer.innerHTML = "";


    Object.keys(
        floors[currentFloor].rooms
    ).forEach(
        function(id) {


            const room =
                floors[currentFloor].rooms[id];


            const hotspot =
                document.createElement(
                    "div"
                );


            hotspot.className =
                "hotspot";


            hotspot.dataset.id =
                id;


            hotspot.title =
                room.name;


            hotspot.style.backgroundColor =
                room.color;


            hotspotLayer.appendChild(
                hotspot
            );


            hotspotElements[id] =
                hotspot;


            hotspot.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();

                    showInfo(id);

                }
            );

        }
    );

}


/* =========================================================
   CHARGEMENT D'UN ETAGE
   ========================================================= */

function loadFloor(
    floorId
) {


    const floor =
        floors[floorId];


    if (!floor) {

        return;

    }


    currentFloor =
        floorId;


    closeInfo();


    floorButtons.forEach(
        function(button) {

            button.classList.toggle(
                "active",
                button.dataset.floor ===
                floorId
            );

        }
    );


    /*
     * On supprime les anciennes pastilles.
     */

    hotspotLayer.innerHTML = "";


    /*
     * Nouvelle image.
     */

    plan.onload =
        function() {


            imageWidth =
                plan.naturalWidth;


            imageHeight =
                plan.naturalHeight;


            /*
             * On conserve la résolution
             * native de l'image.
             */

            plan.width =
                imageWidth;


            plan.height =
                imageHeight;


            createHotspots();


            fitPlan();

        };


    plan.src =
        floor.image;


    /*
     * Si l'image est déjà dans le cache
     * du navigateur, on force le traitement.
     */

    if (
        plan.complete &&
        plan.naturalWidth > 0
    ) {

        plan.onload();

    }

}


/* =========================================================
   AJUSTEMENT INITIAL
   ========================================================= */

function fitPlan() {


    const viewerWidth =
        viewer.clientWidth;


    const viewerHeight =
        viewer.clientHeight;


    const scaleX =
        viewerWidth /
        imageWidth;


    const scaleY =
        viewerHeight /
        imageHeight;


    scale =
        Math.min(
            scaleX,
            scaleY
        );


    offsetX =
        (
            viewerWidth -
            imageWidth *
            scale
        ) / 2;


    offsetY =
        (
            viewerHeight -
            imageHeight *
            scale
        ) / 2;


    updatePlan();

}


/* =========================================================
   MISE A JOUR DU PLAN
   ========================================================= */

function updatePlan() {


    planLayer.style.transform =
        "translate3d(" +
        offsetX +
        "px," +
        offsetY +
        "px,0) " +
        "scale(" +
        scale +
        ")";


    updateHotspots();

}


/* =========================================================
   POSITION DES PASTILLES
   ========================================================= */

function updateHotspots() {


    const rooms =
        floors[currentFloor].rooms;


    Object.keys(rooms).forEach(
        function(id) {


            const room =
                rooms[id];


            const hotspot =
                hotspotElements[id];


            if (!hotspot) {

                return;

            }


            /*
             * Coordonnées sur l'image.
             */

            const imageX =
                imageWidth *
                room.x /
                100;


            const imageY =
                imageHeight *
                room.y /
                100;


            /*
             * Coordonnées écran.
             */

            const screenX =
                offsetX +
                imageX *
                scale;


            const screenY =
                offsetY +
                imageY *
                scale;


            hotspot.style.left =
                screenX + "px";


            hotspot.style.top =
                screenY + "px";

        }
    );

}


/* =========================================================
   ZOOM AUTOUR DU CURSEUR / DOIGT
   ========================================================= */

function zoomAt(
    screenX,
    screenY,
    newScale
) {


    const imageX =
        (
            screenX -
            offsetX
        ) / scale;


    const imageY =
        (
            screenY -
            offsetY
        ) / scale;


    newScale =
        Math.max(
            MIN_SCALE,
            Math.min(
                MAX_SCALE,
                newScale
            )
        );


    offsetX =
        screenX -
        imageX *
        newScale;


    offsetY =
        screenY -
        imageY *
        newScale;


    scale =
        newScale;


    updatePlan();

}


/* =========================================================
   SOURIS
   ========================================================= */

let mouseDown =
    false;


let mouseStartX =
    0;


let mouseStartY =
    0;


let initialOffsetX =
    0;


let initialOffsetY =
    0;


/* ---------------------------------------------------------
   SOURIS — DOWN
   --------------------------------------------------------- */

viewer.addEventListener(
    "mousedown",
    function(event) {


        if (
            event.button !== 0
        ) {

            return;

        }


        if (
            event.target.closest(
                ".hotspot"
            )
        ) {

            return;

        }


        /*
         * Ne pas déplacer le plan lorsque
         * l'utilisateur clique sur le sélecteur
         * d'étage.
         */

        if (
            event.target.closest(
                "#floorSelector"
            )
        ) {

            return;

        }


        mouseDown =
            true;


        mouseStartX =
            event.clientX;


        mouseStartY =
            event.clientY;


        initialOffsetX =
            offsetX;


        initialOffsetY =
            offsetY;


        viewer.classList.add(
            "dragging"
        );

    }
);


/* ---------------------------------------------------------
   SOURIS — MOVE
   --------------------------------------------------------- */

window.addEventListener(
    "mousemove",
    function(event) {


        if (!mouseDown) {

            return;

        }


        offsetX =
            initialOffsetX +
            (
                event.clientX -
                mouseStartX
            );


        offsetY =
            initialOffsetY +
            (
                event.clientY -
                mouseStartY
            );


        updatePlan();

    }
);


/* ---------------------------------------------------------
   SOURIS — UP
   --------------------------------------------------------- */

window.addEventListener(
    "mouseup",
    function() {


        mouseDown =
            false;


        viewer.classList.remove(
            "dragging"
        );

    }
);


/* =========================================================
   MOLETTE
   ========================================================= */

viewer.addEventListener(
    "wheel",
    function(event) {


        event.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        const factor =
            event.deltaY < 0
                ? 1.12
                : 1 / 1.12;


        zoomAt(

            x,

            y,

            scale *
            factor

        );

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH
   ========================================================= */

let touchMode =
    null;


let touchStartX =
    0;


let touchStartY =
    0;


let touchInitialOffsetX =
    0;


let touchInitialOffsetY =
    0;


let pinchStartDistance =
    0;


let pinchStartScale =
    1;


let touchMoved =
    false;


/* =========================================================
   TOUCH START
   ========================================================= */

viewer.addEventListener(
    "touchstart",
    function(event) {


        if (
            event.touches.length === 2
        ) {


            touchMode =
                "pinch";


            touchMoved =
                true;


            pinchStartDistance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            pinchStartScale =
                scale;


            return;

        }


        if (
            event.touches.length === 1
        ) {


            touchMode =
                "drag";


            touchMoved =
                false;


            touchStartX =
                event.touches[0].clientX;


            touchStartY =
                event.touches[0].clientY;


            touchInitialOffsetX =
                offsetX;


            touchInitialOffsetY =
                offsetY;

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   TOUCH MOVE
   ========================================================= */

viewer.addEventListener(
    "touchmove",
    function(event) {


        event.preventDefault();


        /*
         * PINCH
         */

        if (
            event.touches.length === 2 &&
            touchMode === "pinch"
        ) {


            const distance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            const centerX =
                (
                    event.touches[0].clientX +
                    event.touches[1].clientX
                ) / 2;


            const centerY =
                (
                    event.touches[0].clientY +
                    event.touches[1].clientY
                ) / 2;


            const rect =
                viewer.getBoundingClientRect();


            const newScale =
                pinchStartScale *
                (
                    distance /
                    pinchStartDistance
                );


            zoomAt(

                centerX -
                rect.left,

                centerY -
                rect.top,

                newScale

            );


            return;

        }


        /*
         * DEPLACEMENT
         */

        if (
            event.touches.length === 1 &&
            touchMode === "drag"
        ) {


            const dx =
                event.touches[0].clientX -
                touchStartX;


            const dy =
                event.touches[0].clientY -
                touchStartY;


            if (
                Math.abs(dx) > 8 ||
                Math.abs(dy) > 8
            ) {

                touchMoved =
                    true;

            }


            offsetX =
                touchInitialOffsetX +
                dx;


            offsetY =
                touchInitialOffsetY +
                dy;


            updatePlan();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH END
   ========================================================= */

viewer.addEventListener(
    "touchend",
    function(event) {


        /*
         * Si le doigt n'a presque pas bougé,
         * on recherche une pastille.
         */

        if (
            event.changedTouches.length === 1 &&
            !touchMoved
        ) {


            const touch =
                event.changedTouches[0];


            findHotspotAt(

                touch.clientX,

                touch.clientY

            );

        }


        if (
            event.touches.length === 1
        ) {


            touchMode =
                "drag";


            touchMoved =
                true;


            touchStartX =
                event.touches[0].clientX;


            touchStartY =
                event.touches[0].clientY;


            touchInitialOffsetX =
                offsetX;


            touchInitialOffsetY =
                offsetY;

        }
        else {


            touchMode =
                null;

        }

    }
);


/* =========================================================
   DISTANCE ENTRE DEUX DOIGTS
   ========================================================= */

function getDistance(
    a,
    b
) {


    const dx =
        b.clientX -
        a.clientX;


    const dy =
        b.clientY -
        a.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   RECHERCHE DE PASTILLE
   ========================================================= */

function findHotspotAt(
    screenX,
    screenY
) {


    const hitRadius =
        30;


    let selected =
        null;


    let bestDistance =
        Infinity;


    const rooms =
        floors[currentFloor].rooms;


    Object.keys(rooms).forEach(
        function(id) {


            const room =
                rooms[id];


            const imageX =
                imageWidth *
                room.x /
                100;


            const imageY =
                imageHeight *
                room.y /
                100;


            const hotspotX =
                offsetX +
                imageX *
                scale;


            const hotspotY =
                offsetY +
                imageY *
                scale;


            const dx =
                screenX -
                hotspotX;


            const dy =
                screenY -
                hotspotY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                hitRadius &&
                distance <
                bestDistance
            ) {


                selected =
                    id;


                bestDistance =
                    distance;

            }

        }
    );


    if (selected) {

        showInfo(
            selected
        );

    }

}


/* =========================================================
   CONTENU DE LA FICHE
   ========================================================= */

function getInfoContent(
    id
) {


    const room =
        floors[currentFloor].rooms[id];


    if (!room) {

        return `
            <p>
                Informations indisponibles.
            </p>
        `;

    }


    return room.content || `

        <h2>
            ${room.name}
        </h2>

        <p>
            Aucune information renseignée
            pour cette pièce.
        </p>

    `;

}


/* =========================================================
   OUVERTURE FICHE
   ========================================================= */

function showInfo(
    id
) {


    infoContent.innerHTML =
        getInfoContent(id);


    infoBox.style.display =
        "block";

}


/* =========================================================
   FERMETURE
   ========================================================= */

function closeInfo() {

    infoBox.style.display =
        "none";

}


closeButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        closeInfo();

    }
);


/* =========================================================
   TOUCHE ECHAP
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Escape"
        ) {

            closeInfo();

        }

    }
);


/* =========================================================
   CHANGEMENT D'ETAGE
   ========================================================= */

floorButtons.forEach(
    function(button) {


        button.addEventListener(
            "click",
            function(event) {


                event.stopPropagation();


                const floorId =
                    button.dataset.floor;


                if (
                    floorId ===
                    currentFloor
                ) {

                    return;

                }


                loadFloor(
                    floorId
                );

            }
        );

    }
);


/* =========================================================
   REDIMENSIONNEMENT
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        updatePlan();

    }
);


/* =========================================================
   INITIALISATION
   ========================================================= */

loadFloor(
    "rdc"
);

</script>
