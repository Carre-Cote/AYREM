<style>

/* =========================================================
   BASE
   ========================================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #eeeeee;

}


/* =========================================================
   ZONE DU PLAN
   ========================================================= */

#viewer {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #eeeeee;

    touch-action: none;

    cursor: grab;

}


#viewer.dragging {

    cursor: grabbing;

}


/* =========================================================
   CONTENEUR DU PLAN
   ========================================================= */

#planLayer {

    position: absolute;

    left: 0;
    top: 0;

    transform-origin: 0 0;

    will-change: transform;

}


/* =========================================================
   IMAGE DU PLAN
   ========================================================= */

#plan {

    display: block;

    width: auto;
    height: auto;

    max-width: none;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;

}


/* =========================================================
   COUCHE DES PASTILLES
   ========================================================= */

#hotspotLayer {

    position: fixed;

    inset: 0;

    z-index: 20;

    pointer-events: none;

}


/* =========================================================
   PASTILLES
   ========================================================= */

.hotspot {
    position: fixed !important;

    width: 20px !important;
    height: 20px !important;

    min-width: 20px !important;
    min-height: 20px !important;

    max-width: 20px !important;
    max-height: 20px !important;

    margin: 0 !important;
    padding: 0 !important;

    box-sizing: border-box;

    border-radius: 50%;

    border: 2px solid white;

    cursor: pointer;

    transform: translate(-50%, -50%) !important;

    z-index: 9999;

    pointer-events: auto;
}


.hotspot::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 30px;
    height: 30px;

    margin-left: -15px;
    margin-top: -15px;

    border-radius: 50%;

}


/* Survol PC */

}

}

}


.sol-mur {

}


/* =========================================================
   FENÊTRE D'INFORMATION
   ========================================================= */

.info-box {

    display: none;

    position: fixed;

    z-index: 1000;

    width: 450px;

    max-width: calc(100vw - 30px);

}

@media (max-width: 900px) {

}

<body>


<!-- =========================================================

     ========================================================= -->

<div id="viewer">

    <div id="planLayer">

            data-id="sol-mur"
            title="Sol et mur"
        ></div>

    </div>

</div>


<!-- =========================================================
     FICHE INFORMATION
     ========================================================= -->

<div
    class="info-box"
    id="infoBox"
>

    <span
        class="close"
        id="closeButton"
    >
        ×
    </span>


    <div
        id="infoContent"
    ></div>

</div>


<script>

/* =========================================================
   ELEMENTS
   ========================================================= */

const viewer =
    document.getElementById(
        "viewer"
    );


const planLayer =
    document.getElementById(
        "planLayer"
    );


const plan =
    document.getElementById(
        "plan"
    );


const hotspotLayer =
    document.getElementById(
        "hotspotLayer"
    );


const infoBox =
    document.getElementById(
        "infoBox"
    );


const infoContent =
    document.getElementById(
        "infoContent"
    );


const closeButton =
    document.getElementById(
        "closeButton"
    );


const hotspotElements =
    document.querySelectorAll(
        ".hotspot"
    );


/* =========================================================
   DIMENSIONS ORIGINALES DU PLAN
   ========================================================= */

let imageWidth = 0;

let imageHeight = 0;


/* =========================================================
   ZOOM / POSITION
   ========================================================= */

let scale = 1;

let offsetX = 0;

let offsetY = 0;


/* =========================================================
   LIMITES
   ========================================================= */

const MIN_SCALE = 0.05;

const MAX_SCALE = 8;


/* =========================================================
   COORDONNEES DES PASTILLES
   =========================================================

   Coordonnées exprimées en pourcentage
   du PNG original.
   ========================================================= */

const hotspotPositions = {

    vasque: {

        x: 55,
        y: 30

    },


    wc: {

        x: 58,
        y: 25

    },


    douche: {

        x: 56,
        y: 26

    },


    "sol-mur": {

        x: 58,
        y: 30

    }

};


/* =========================================================
   ETAT SOURIS
   ========================================================= */

let mouseDown = false;

let mouseMoved = false;

let mouseStartX = 0;

let mouseStartY = 0;

let startOffsetX = 0;

let startOffsetY = 0;


/* =========================================================
   ETAT TOUCH
   ========================================================= */

let touchMode = null;

let touchStartX = 0;

let touchStartY = 0;

let touchStartOffsetX = 0;

let touchStartOffsetY = 0;

let pinchStartDistance = 0;

let pinchStartScale = 1;


/* =========================================================
   CHARGEMENT IMAGE
   ========================================================= */

plan.onload = function() {


    imageWidth =
        plan.naturalWidth;


    imageHeight =
        plan.naturalHeight;


    /*
     * Affichage à la taille originale.
     */

    plan.width =
        imageWidth;


    plan.height =
        imageHeight;


    /*
     * Ajustement initial.
     */

    fitPlan();


    /*
     * Première position
     * des pastilles.
     */

    updateHotspots();

};


/* =========================================================
   AJUSTEMENT INITIAL DU PLAN
   ========================================================= */

function fitPlan() {


    const viewerWidth =
        viewer.clientWidth;


    const viewerHeight =
        viewer.clientHeight;


    const scaleX =
        viewerWidth /
        imageWidth;


    const scaleY =
        viewerHeight /
        imageHeight;


    /*
     * Le plan tient entièrement
     * dans l'écran.
     */

    scale =
        Math.min(
            scaleX,
            scaleY
        );


    offsetX =
        (
            viewerWidth -
            imageWidth * scale
        ) / 2;


    offsetY =
        (
            viewerHeight -
            imageHeight * scale
        ) / 2;


    updatePlan();

}


/* =========================================================
   MISE À JOUR DU PLAN
   ========================================================= */

function updatePlan() {


    /*
     * Le plan est déplacé et zoomé
     * avec une seule transformation.
     */

    planLayer.style.transform =
        `translate3d(
            ${offsetX}px,
            ${offsetY}px,
            0
        ) scale(${scale})`;


    /*
     * Les pastilles sont ensuite
     * positionnées indépendamment.
     */

    updateHotspots();

}


/* =========================================================
   MISE À JOUR DES PASTILLES
   ========================================================= */

function updateHotspots() {


    hotspotElements.forEach(
        function(hotspot) {


            const id =
                hotspot.dataset.id;


            const position =
                hotspotPositions[id];


            if (!position) {

                return;

            }


            /*
             * Position dans le PNG original.
             */

            const imageX =
                imageWidth *
                position.x /
                100;


            const imageY =
                imageHeight *
                position.y /
                100;


            /*
             * Position à l'écran.
             */

            const screenX =
                offsetX +
                imageX * scale;


            const screenY =
                offsetY +
                imageY * scale;


            /*
             * IMPORTANT :
             *
             * On ne met PAS la pastille
             * dans le système de transformation
             * du plan.
             *
             * Elle reste en pixels écran.
             */

            hotspot.style.left =
                screenX + "px";


            hotspot.style.top =
                screenY + "px";

        }
    );

}


/* =========================================================
   ZOOM AUTOUR D'UN POINT
   ========================================================= */

function zoomAt(
    screenX,
    screenY,
    newScale
) {


    /*
     * Coordonnées du point
     * dans l'image AVANT zoom.
     */

    const imageX =
        (
            screenX -
            offsetX
        ) / scale;


    const imageY =
        (
            screenY -
            offsetY
        ) / scale;


    /*
     * Nouvelle échelle.
     */

    newScale =
        Math.max(
            MIN_SCALE,
            Math.min(
                MAX_SCALE,
                newScale
            )
        );


    /*
     * On recalcule la position
     * pour que le point situé sous
     * le curseur reste au même endroit.
     */

    offsetX =
        screenX -
        imageX *
        newScale;


    offsetY =
        screenY -
        imageY *
        newScale;


    scale =
        newScale;


    updatePlan();

}


/* =========================================================
   SOURIS — DOWN
   ========================================================= */

viewer.addEventListener(
    "mousedown",
    function(event) {


        if (
            event.button !== 0
        ) {

            return;

        }


        /*
         * Si une fiche est ouverte,
         * on ne déplace pas le plan
         * lorsqu'on clique dessus.
         */

        if (
            infoBox.style.display ===
            "block"
        ) {

            return;

        }


        mouseDown = true;

        mouseMoved = false;


        mouseStartX =
            event.clientX;


        mouseStartY =
            event.clientY;


        startOffsetX =
            offsetX;


        startOffsetY =
            offsetY;


        viewer.classList.add(
            "dragging"
        );

    }
);


/* =========================================================
   SOURIS — MOVE
   ========================================================= */

window.addEventListener(
    "mousemove",
    function(event) {


        if (
            !mouseDown
        ) {

            return;

        }


        const dx =
            event.clientX -
            mouseStartX;


        const dy =
            event.clientY -
            mouseStartY;


        if (
            Math.abs(dx) > 3 ||
            Math.abs(dy) > 3
        ) {

            mouseMoved = true;

        }


        offsetX =
            startOffsetX +
            dx;


        offsetY =
            startOffsetY +
            dy;


        updatePlan();

    }
);


/* =========================================================
   SOURIS — UP
   ========================================================= */

window.addEventListener(
    "mouseup",
    function(event) {


        if (
            !mouseDown
        ) {

            return;

        }


        mouseDown = false;


        viewer.classList.remove(
            "dragging"
        );


        /*
         * Clic sans déplacement.
         */

        if (
            !mouseMoved
        ) {


            const rect =
                viewer.getBoundingClientRect();


            const x =
                event.clientX -
                rect.left;


            const y =
                event.clientY -
                rect.top;


            findClickedHotspot(
                x,
                y
            );

        }

    }
);


/* =========================================================
   MOLETTE PC
   ========================================================= */

viewer.addEventListener(
    "wheel",
    function(event) {


        event.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        /*
         * Zoom doux.
         */

        const factor =
            event.deltaY < 0
                ? 1.12
                : 1 / 1.12;


        zoomAt(

            x,

            y,

            scale * factor

        );

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH — START
   ========================================================= */

viewer.addEventListener(
    "touchstart",
    function(event) {


        event.preventDefault();


        /*
         * PINCH
         */

        if (
            event.touches.length === 2
        ) {


            touchMode =
                "pinch";


            pinchStartDistance =
                getDistance(

                    event.touches[0],

                    event.touches[1]

                );


            pinchStartScale =
                scale;


            return;

        }


        /*
         * DEPLACEMENT
         */

        if (
            event.touches.length === 1
        ) {


            touchMode =
                "drag";


            touchStartX =
                event.touches[0].clientX;


            touchStartY =
                event.touches[0].clientY;


            touchStartOffsetX =
                offsetX;


            touchStartOffsetY =
                offsetY;

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH — MOVE
   ========================================================= */

viewer.addEventListener(
    "touchmove",
    function(event) {


        event.preventDefault();


        /*
         * PINCH
         */

        if (
            event.touches.length === 2
        ) {


            const distance =
                getDistance(

                    event.touches[0],

                    event.touches[1]

                );


            const center =
                getCenter(

                    event.touches[0],

                    event.touches[1]

                );


            const rect =
                viewer.getBoundingClientRect();


            const x =
                center.x -
                rect.left;


            const y =
                center.y -
                rect.top;


            const newScale =
                pinchStartScale *
                (
                    distance /
                    pinchStartDistance
                );


            zoomAt(

                x,

                y,

                newScale

            );


            return;

        }


        /*
         * DEPLACEMENT
         */

        if (
            event.touches.length === 1 &&
            touchMode === "drag"
        ) {


            const dx =
                event.touches[0].clientX -
                touchStartX;


            const dy =
                event.touches[0].clientY -
                touchStartY;


            offsetX =
                touchStartOffsetX +
                dx;


            offsetY =
                touchStartOffsetY +
                dy;


            updatePlan();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH — END
   ========================================================= */

viewer.addEventListener(
    "touchend",
    function(event) {


        /*
         * Un doigt restant après un pinch :
         * on repart en mode déplacement.
         */

        if (
            event.touches.length === 1
        ) {


            touchMode =
                "drag";


            touchStartX =
                event.touches[0].clientX;


            touchStartY =
                event.touches[0].clientY;


            touchStartOffsetX =
                offsetX;


            touchStartOffsetY =
                offsetY;


            return;

        }


        /*
         * Aucun doigt.
         */

        if (
            event.touches.length === 0
        ) {

            touchMode =
                null;

        }

    }
);


/* =========================================================
   DISTANCE ENTRE DEUX DOIGTS
   ========================================================= */

function getDistance(
    a,
    b
) {


    const dx =
        b.clientX -
        a.clientX;


    const dy =
        b.clientY -
        a.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   CENTRE ENTRE DEUX DOIGTS
   ========================================================= */

function getCenter(
    a,
    b
) {


    return {

        x:
            (
                a.clientX +
                b.clientX
            ) / 2,

        y:
            (
                a.clientY +
                b.clientY
            ) / 2

    };

}


/* =========================================================
   DETECTION PASTILLE
   ========================================================= */

function findClickedHotspot(
    screenX,
    screenY
) {


    /*
     * Taille de la zone de détection.
     *
     * Elle reste indépendante du zoom.
     */

    const hitRadius = 22;


    let closest = null;

    let closestDistance =
        Infinity;


    hotspotElements.forEach(
        function(hotspot) {


            const id =
                hotspot.dataset.id;


            const position =
                hotspotPositions[id];


            const imageX =
                imageWidth *
                position.x /
                100;


            const imageY =
                imageHeight *
                position.y /
                100;


            const hotspotX =
                offsetX +
                imageX *
                scale;


            const hotspotY =
                offsetY +
                imageY *
                scale;


            const dx =
                screenX -
                hotspotX;


            const dy =
                screenY -
                hotspotY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                hitRadius
                &&
                distance <
                closestDistance
            ) {


                closest =
                    hotspot;


                closestDistance =
                    distance;

            }

        }
    );


    if (
        closest
    ) {


        showInfo(
            closest.dataset.id
        );

    }

}


/* =========================================================
   CONTENU DES FICHES
   ========================================================= */

function getInfoContent(

) {


    if (

    ) {


        return `

            </p>

            </p>

    }

                Modèle : XXX<br>

            </p>

                Modèle : XXX<br>

            </p>

            <p>

            </p>

        `;

    }


    if (

    ) {


        return `

            </p>

            <h3>Mitigeur</h3>

            <p>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Colonne de douche</h3>

            <p>
                Fabricant : XXX<br>

            </p>

            <h3>Faïence</h3>

            </p>

        `;

    }


    if (

    ) {


        return `

            <h2>Sol et mur — SDB 01</h2>

            <h3>Carrelage</h3>

                Fabricant : XXX<br>

            </p>

            <h3>Faïence</h3>

            <p>
                Faïence douche 60 × 120 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Crédence</h3>

            <p>
                Crédence meuble vasque 10 × 10 cm<br>
                Fabricant : XXX<br>

            </p>

        `;

    }


    return "";

}


/* =========================================================
   OUVERTURE FICHE
   ========================================================= */

function showInfo(
    type
) {


    infoContent.innerHTML =
        getInfoContent(
            type
        );


    infoBox.style.display =
        "block";


    /*
     * Pour l'instant on centre la fiche.
     *
     * Elle est en position FIXED :
     * elle ne dépend donc absolument
     * pas du zoom du plan.
     */

    requestAnimationFrame(
        function() {


            const width =
                infoBox.offsetWidth;


            const height =
                infoBox.offsetHeight;


            let left =
                (
                    window.innerWidth -
                    width
                ) / 2;


            let top =
                (
                    window.innerHeight -
                    height
                ) / 2;


            /*
             * Sécurité écran.

             */

            left =
                Math.max(
                    10,
                    left
                );


            top =
                Math.max(
                    10,
                    top
                );


            infoBox.style.left =
                left + "px";


            infoBox.style.top =
                top + "px";

        }
    );

}


/* =========================================================
   FERMETURE
   ========================================================= */

function closeInfo() {


    infoBox.style.display =
        "none";

}


closeButton.addEventListener(
    "click",
    function(event) {


        event.stopPropagation();


        closeInfo();

    }
);


/* =========================================================
   REDIMENSIONNEMENT
   ========================================================= */

window.addEventListener(
    "resize",
    function() {


        /*
         * On conserve le zoom et la position
         * lors d'une rotation ou d'un
         * redimensionnement.
         */

        updatePlan();


        /*
         * Si une fiche est ouverte,
         * on la recentre.
         */

        if (
            infoBox.style.display ===
            "block"
        ) {


            showInfo(
                infoContent
                    .querySelector("h2")
                    ?.textContent
            );

        }

    }
);


/* =========================================================
   ESCAPE
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Escape"
        ) {

            closeInfo();

        }

    }
);

</script>

</body>

</html>
