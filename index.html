<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Carré Côté - Plan interactif</title>


<style>

/* =========================================================
   PAGE
   ========================================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #eeeeee;

}


/* =========================================================
   VIEWER
   ========================================================= */

#viewer {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #eeeeee;

    cursor: grab;

    touch-action: none;

}


#viewer.dragging {

    cursor: grabbing;

}


/* =========================================================
   CANVAS PLAN
   ========================================================= */

#planCanvas,
#hotspotCanvas {

    position: absolute;

    left: 0;
    top: 0;

    display: block;

}


#planCanvas {

    z-index: 1;

}


#hotspotCanvas {

    z-index: 2;

    pointer-events: auto;

}


/* =========================================================
   FENÊTRE D'INFORMATION
   ========================================================= */

.info-box {

    display: none;

    position: fixed;

    width: 450px;

    max-width:
        calc(100vw - 30px);

    max-height:
        calc(100vh - 30px);

    padding: 25px;

    box-sizing: border-box;

    background: white;

    border-radius: 12px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.25);

    z-index: 1000;

    overflow-y: auto;

    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    touch-action: pan-y;

}


/* =========================================================
   TITRES
   ========================================================= */

.info-box h2 {

    margin-top: 0;

    padding-right: 30px;

    font-size: 22px;

}


.info-box h3 {

    margin-top: 20px;

    margin-bottom: 6px;

    font-size: 16px;

}


.info-box p {

    margin-top: 0;

    line-height: 1.5;

    font-size: 14px;

}


/* =========================================================
   FERMETURE
   ========================================================= */

.close {

    position: absolute;

    right: 12px;

    top: 8px;

    width: 30px;

    height: 30px;

    line-height: 30px;

    text-align: center;

    font-size: 25px;

    cursor: pointer;

}


/* =========================================================
   TABLETTE
   ========================================================= */

@media (max-width: 900px) {

    .info-box {

        width: 360px;

        max-width:
            calc(100vw - 30px);

        padding: 20px;

    }


    .info-box h2 {

        font-size: 20px;

    }


    .info-box h3 {

        font-size: 15px;

    }


    .info-box p {

        font-size: 14px;

    }

}


/* =========================================================
   TELEPHONE
   ========================================================= */

@media (max-width: 600px) {

    .info-box {

        width: 280px;

        max-width:
            calc(100vw - 20px);

        max-height:
            calc(100vh - 20px);

        padding: 16px;

        border-radius: 10px;

    }


    .info-box h2 {

        font-size: 18px;

    }


    .info-box h3 {

        font-size: 14px;

        margin-top: 16px;

    }


    .info-box p {

        font-size: 13px;

        line-height: 1.4;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     VIEWER
     ========================================================= -->

<div id="viewer">


    <!-- PLAN -->

    <canvas
        id="planCanvas"
    ></canvas>


    <!-- PASTILLES -->

    <canvas
        id="hotspotCanvas"
    ></canvas>


</div>



<!-- =========================================================
     FENÊTRE D'INFORMATION
     ========================================================= -->

<div
    class="info-box"
    id="infoBox"
>

    <span
        class="close"
        onclick="closeInfo()"
    >
        ×
    </span>


    <div
        id="infoContent"
    ></div>

</div>



<script>

/* =========================================================
   ÉLÉMENTS
   ========================================================= */

const viewer =
    document.getElementById(
        "viewer"
    );


const planCanvas =
    document.getElementById(
        "planCanvas"
    );


const hotspotCanvas =
    document.getElementById(
        "hotspotCanvas"
    );


const planCtx =
    planCanvas.getContext(
        "2d"
    );


const hotspotCtx =
    hotspotCanvas.getContext(
        "2d"
    );


const image =
    new Image();


image.src =
    "PCG AYREM - RDC ind2 - 2026-07-02.png";


/* =========================================================
   DIMENSIONS IMAGE
   ========================================================= */

let imageWidth = 0;

let imageHeight = 0;


/* =========================================================
   TRANSFORMATION DU PLAN
   ========================================================= */

let scale = 1;

let offsetX = 0;

let offsetY = 0;


/* =========================================================
   PIXEL RATIO
   ========================================================= */

let dpr =
    window.devicePixelRatio || 1;


/* =========================================================
   LIMITES DU ZOOM
   ========================================================= */

const MIN_SCALE = 0.05;

const MAX_SCALE = 8;


/* =========================================================
   ANIMATION
   ========================================================= */

let drawRequested = false;


/* =========================================================
   PASTILLES
   =========================================================

   Les coordonnées sont exprimées en % du PNG original.

   La taille des pastilles, elle, est exprimée
   en pixels écran.

   C'est ce qui les rend indépendantes du zoom.
   ========================================================= */

const hotspots = [

    {
        id: "vasque",
        x: 55,
        y: 30,
        color: "#4d8acb"
    },

    {
        id: "wc",
        x: 58,
        y: 25,
        color: "#d9534f"
    },

    {
        id: "douche",
        x: 56,
        y: 26,
        color: "#4caf7a"
    },

    {
        id: "sol-mur",
        x: 58,
        y: 30,
        color: "#df9629"
    }

];


/* =========================================================
   TAILLE DES PASTILLES
   ========================================================= */

function getHotspotRadius() {

    if (
        window.innerWidth <= 600
    ) {

        return 5;

    }


    if (
        window.innerWidth <= 900
    ) {

        return 5.5;

    }


    return 6;

}


/* =========================================================
   CHARGEMENT DE L'IMAGE
   ========================================================= */

image.onload =
    function() {


        imageWidth =
            image.naturalWidth;


        imageHeight =
            image.naturalHeight;


        resizeCanvases();


        fitPlan();


        requestDraw();

    };


/* =========================================================
   REDIMENSIONNEMENT DES CANVAS
   ========================================================= */

function resizeCanvases() {


    dpr =
        window.devicePixelRatio || 1;


    const width =
        viewer.clientWidth;


    const height =
        viewer.clientHeight;


    /*
     * Canvas physique haute résolution.
     */

    planCanvas.width =
        Math.round(
            width * dpr
        );


    planCanvas.height =
        Math.round(
            height * dpr
        );


    hotspotCanvas.width =
        Math.round(
            width * dpr
        );


    hotspotCanvas.height =
        Math.round(
            height * dpr
        );


    /*
     * Dimensions CSS.
     */

    planCanvas.style.width =
        width + "px";


    planCanvas.style.height =
        height + "px";


    hotspotCanvas.style.width =
        width + "px";


    hotspotCanvas.style.height =
        height + "px";


    /*
     * Mise à l'échelle du contexte.
     */

    planCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    hotspotCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


/* =========================================================
   AJUSTEMENT INITIAL
   ========================================================= */

function fitPlan() {


    const width =
        viewer.clientWidth;


    const height =
        viewer.clientHeight;


    const scaleX =
        width /
        imageWidth;


    const scaleY =
        height /
        imageHeight;


    /*
     * Le plan est affiché entièrement
     * à l'ouverture.
     */

    scale =
        Math.min(
            scaleX,
            scaleY
        );


    offsetX =
        (
            width -
            imageWidth * scale
        ) / 2;


    offsetY =
        (
            height -
            imageHeight * scale
        ) / 2;

}


/* =========================================================
   DEMANDE DE RENDU
   ========================================================= */

function requestDraw() {


    if (
        drawRequested
    ) {

        return;

    }


    drawRequested =
        true;


    requestAnimationFrame(
        function() {

            drawRequested =
                false;


            drawPlan();


            drawHotspots();

        }
    );

}


/* =========================================================
   DESSIN DU PLAN
   ========================================================= */

function drawPlan() {


    const width =
        viewer.clientWidth;


    const height =
        viewer.clientHeight;


    /*
     * Effacement.
     */

    planCtx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
     * Dessin du PNG ORIGINAL.
     *
     * Aucun redimensionnement préalable
     * du fichier n'est effectué.
     */

    planCtx.drawImage(

        image,

        offsetX,

        offsetY,

        imageWidth * scale,

        imageHeight * scale

    );

}


/* =========================================================
   DESSIN DES PASTILLES
   ========================================================= */

function drawHotspots() {


    const width =
        viewer.clientWidth;


    const height =
        viewer.clientHeight;


    /*
     * Effacement du calque transparent.
     */

    hotspotCtx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
     * Rayon CONSTANT À L'ÉCRAN.
     */

    const radius =
        getHotspotRadius();


    hotspots.forEach(
        function(hotspot) {


            /*
             * Coordonnées du point
             * dans le PNG original.
             */

            const imageX =
                imageWidth *
                hotspot.x /
                100;


            const imageY =
                imageHeight *
                hotspot.y /
                100;


            /*
             * Transformation vers
             * les coordonnées écran.
             */

            const screenX =
                offsetX +
                imageX *
                scale;


            const screenY =
                offsetY +
                imageY *
                scale;


            /*
             * Pastille.
             *
             * IMPORTANT :
             *
             * radius est en pixels écran.
             *
             * Il n'est PAS multiplié par scale.
             */

            hotspotCtx.beginPath();


            hotspotCtx.arc(

                screenX,

                screenY,

                radius,

                0,

                Math.PI * 2

            );


            hotspotCtx.fillStyle =
                hotspot.color;


            hotspotCtx.fill();


            /*
             * Contour blanc.
             */

            hotspotCtx.lineWidth = 1;


            hotspotCtx.strokeStyle =
                "#ffffff";


            hotspotCtx.stroke();

        }
    );

}


/* =========================================================
   CONVERSION COORDONNÉES ÉCRAN → IMAGE
   ========================================================= */

function screenToImage(
    screenX,
    screenY
) {


    return {

        x:
            (
                screenX -
                offsetX
            ) /
            scale,

        y:
            (
                screenY -
                offsetY
            ) /
            scale

    };

}


/* =========================================================
   RECHERCHE D'UNE PASTILLE
   ========================================================= */

function findHotspot(
    screenX,
    screenY
) {


    const point =
        screenToImage(
            screenX,
            screenY
        );


    /*
     * Rayon de détection exprimé
     * dans l'image.
     *
     * Plus on zoome, plus la zone
     * correspondante dans l'image
     * devient petite.
     */

    const radius =
        getHotspotRadius();


    const imageRadius =
        radius /
        scale;


    /*
     * On recherche la pastille
     * la plus proche du clic.
     */

    let closest = null;

    let closestDistance =
        Infinity;


    hotspots.forEach(
        function(hotspot) {


            const hx =
                imageWidth *
                hotspot.x /
                100;


            const hy =
                imageHeight *
                hotspot.y /
                100;


            const dx =
                point.x -
                hx;


            const dy =
                point.y -
                hy;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <=
                imageRadius * 3
                &&
                distance <
                closestDistance
            ) {

                closest =
                    hotspot;


                closestDistance =
                    distance;

            }

        }
    );


    return closest;

}


/* =========================================================
   ZOOM AUTOUR D'UN POINT
   ========================================================= */

function zoomAt(
    screenX,
    screenY,
    newScale
) {


    /*
     * Coordonnées du point
     * avant zoom.
     */

    const imageX =
        (
            screenX -
            offsetX
        ) /
        scale;


    const imageY =
        (
            screenY -
            offsetY
        ) /
        scale;


    /*
     * Nouvelle échelle.
     */

    scale =
        Math.max(

            MIN_SCALE,

            Math.min(
                MAX_SCALE,
                newScale
            )

        );


    /*
     * Le point reste sous
     * le curseur.
     */

    offsetX =
        screenX -
        imageX *
        scale;


    offsetY =
        screenY -
        imageY *
        scale;


    requestDraw();

}


/* =========================================================
   SOURIS
   ========================================================= */

let mouseDown = false;

let mouseMoved = false;


let mouseStartX = 0;

let mouseStartY = 0;


let startOffsetX = 0;

let startOffsetY = 0;


/* =========================================================
   MOUSE DOWN
   ========================================================= */

viewer.addEventListener(
    "mousedown",
    function(event) {


        if (
            event.button !== 0
        ) {

            return;

        }


        mouseDown = true;

        mouseMoved = false;


        mouseStartX =
            event.clientX;


        mouseStartY =
            event.clientY;


        startOffsetX =
            offsetX;


        startOffsetY =
            offsetY;


        viewer.classList.add(
            "dragging"
        );

    }
);


/* =========================================================
   MOUSE MOVE
   ========================================================= */

window.addEventListener(
    "mousemove",
    function(event) {


        if (
            !mouseDown
        ) {

            return;

        }


        const dx =
            event.clientX -
            mouseStartX;


        const dy =
            event.clientY -
            mouseStartY;


        if (
            Math.abs(dx) > 3 ||
            Math.abs(dy) > 3
        ) {

            mouseMoved = true;

        }


        offsetX =
            startOffsetX +
            dx;


        offsetY =
            startOffsetY +
            dy;


        requestDraw();

    }
);


/* =========================================================
   MOUSE UP
   ========================================================= */

window.addEventListener(
    "mouseup",
    function(event) {


        if (
            !mouseDown
        ) {

            return;

        }


        mouseDown = false;


        viewer.classList.remove(
            "dragging"
        );


        /*
         * Si la souris n'a quasiment pas bougé,
         * on considère cela comme un clic.
         */

        if (
            !mouseMoved
        ) {


            const rect =
                hotspotCanvas.getBoundingClientRect();


            const x =
                event.clientX -
                rect.left;


            const y =
                event.clientY -
                rect.top;


            const hotspot =
                findHotspot(
                    x,
                    y
                );


            if (
                hotspot
            ) {

                showInfo(
                    hotspot.id,
                    hotspot
                );

            }

        }

    }
);


/* =========================================================
   MOLETTE
   ========================================================= */

viewer.addEventListener(
    "wheel",
    function(event) {


        event.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        /*
         * Zoom progressif.
         */

        const factor =
            event.deltaY < 0
                ? 1.15
                : 1 / 1.15;


        zoomAt(

            x,

            y,

            scale *
            factor

        );

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH
   ========================================================= */

let touchMode =
    null;


let touchStartX = 0;

let touchStartY = 0;


let touchStartOffsetX = 0;

let touchStartOffsetY = 0;


let pinchDistance = 0;

let pinchScale = 1;


/* =========================================================
   DISTANCE DE DEUX DOIGTS
   ========================================================= */

function getTouchDistance(
    a,
    b
) {

    const dx =
        b.clientX -
        a.clientX;


    const dy =
        b.clientY -
        a.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   CENTRE DE DEUX DOIGTS
   ========================================================= */

function getTouchCenter(
    a,
    b
) {

    return {

        x:
            (
                a.clientX +
                b.clientX
            ) / 2,

        y:
            (
                a.clientY +
                b.clientY
            ) / 2

    };

}


/* =========================================================
   TOUCH START
   ========================================================= */

viewer.addEventListener(
    "touchstart",
    function(event) {


        if (
            event.touches.length === 2
        ) {


            touchMode =
                "pinch";


            pinchDistance =
                getTouchDistance(

                    event.touches[0],

                    event.touches[1]

                );


            pinchScale =
                scale;


            return;

        }


        if (
            event.touches.length === 1
        ) {


            touchMode =
                "drag";


            touchStartX =
                event.touches[0].clientX;


            touchStartY =
                event.touches[0].clientY;


            touchStartOffsetX =
                offsetX;


            touchStartOffsetY =
                offsetY;

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH MOVE
   ========================================================= */

viewer.addEventListener(
    "touchmove",
    function(event) {


        event.preventDefault();


        /*
         * ZOOM
         */

        if (
            event.touches.length === 2
        ) {


            const distance =
                getTouchDistance(

                    event.touches[0],

                    event.touches[1]

                );


            const center =
                getTouchCenter(

                    event.touches[0],

                    event.touches[1]

                );


            const rect =
                viewer.getBoundingClientRect();


            const x =
                center.x -
                rect.left;


            const y =
                center.y -
                rect.top;


            zoomAt(

                x,

                y,

                pinchScale *
                (
                    distance /
                    pinchDistance
                )

            );


            return;

        }


        /*
         * DÉPLACEMENT
         */

        if (
            event.touches.length === 1 &&
            touchMode === "drag"
        ) {


            const dx =
                event.touches[0].clientX -
                touchStartX;


            const dy =
                event.touches[0].clientY -
                touchStartY;


            offsetX =
                touchStartOffsetX +
                dx;


            offsetY =
                touchStartOffsetY +
                dy;


            requestDraw();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH END
   ========================================================= */

viewer.addEventListener(
    "touchend",
    function(event) {


        /*
         * Si un seul doigt reste après
         * un pinch, on réinitialise le mode.
         */

        if (
            event.touches.length === 0
        ) {

            touchMode =
                null;

        }

    }
);


/* =========================================================
   TOUCH CLICK
   ========================================================= */

hotspotCanvas.addEventListener(
    "click",
    function(event) {


        /*
         * Le clic souris est déjà traité
         * par viewer.
         *
         * On ne fait rien ici.
         */

    }
);


/* =========================================================
   CONTENU DES FICHES
   ========================================================= */

/* =========================================================
   OUVERTURE FICHE
   ========================================================= */

function showInfo(
    type,
    hotspot
) {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    const infoContent =
        document.getElementById(
            "infoContent"
        );


    infoContent.innerHTML =
        getInfoContent(
            type
        );


    infoBox.style.display =
        "block";


    /*
     * Positionnement après calcul
     * de la taille de la fenêtre.
     */

    requestAnimationFrame(
        function() {

            positionInfoBox(
                hotspot
            );

        }
    );

}


/* =========================================================
   POSITIONNEMENT FICHE
   ========================================================= */

function positionInfoBox(
    hotspot
) {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    /*
     * On calcule la position actuelle
     * de la pastille à partir de ses
     * coordonnées du plan.
     */

    const imageX =
        imageWidth *
        hotspot.x /
        100;


    const imageY =
        imageHeight *
        hotspot.y /
        100;


    const screenX =
        offsetX +
        imageX *
        scale;


    const screenY =
        offsetY +
        imageY *
        scale;


    const boxWidth =
        infoBox.offsetWidth;


    const boxHeight =
        infoBox.offsetHeight;


    const viewportWidth =
        window.innerWidth;


    const viewportHeight =
        window.innerHeight;


    const gap = 15;

    const margin = 10;


    let left;

    let top;


    /*
     * À droite de la pastille.
     */

    if (
        screenX +
        gap +
        boxWidth
        <=
        viewportWidth
    ) {


        left =
            screenX +
            gap;

    }


    /*
     * Sinon à gauche.
     */

    else if (
        screenX -
        gap -
        boxWidth
        >=
        0
    ) {


        left =
            screenX -
            gap -
            boxWidth;

    }


    /*
     * Sinon centrée horizontalement.
     */

    else {


        left =
            screenX -
            boxWidth / 2;

    }


    /*
     * Centrage vertical.
     */

    top =
        screenY -
        boxHeight / 2;


    /*
     * Limites écran.
     */

    if (
        top < margin
    ) {

        top =
            margin;

    }


    if (
        top +
        boxHeight
        >
        viewportHeight -
        margin
    ) {

        top =
            viewportHeight -
            boxHeight -
            margin;

    }


    if (
        left < margin
    ) {

        left =
            margin;

    }


    if (
        left +
        boxWidth
        >
        viewportWidth -
        margin
    ) {

        left =
            viewportWidth -
            boxWidth -
            margin;

    }


    infoBox.style.left =
        left + "px";


    infoBox.style.top =
        top + "px";

}


/* =========================================================
   FERMETURE
   ========================================================= */

function closeInfo() {


    document.getElementById(
        "infoBox"
    ).style.display =
        "none";

}


/* =========================================================
   REDIMENSIONNEMENT
   ========================================================= */

window.addEventListener(
    "resize",
    function() {


        resizeCanvases();


        requestDraw();


    }
);


/* =========================================================
   ESC
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Escape"
        ) {

            closeInfo();

        }

    }
);

</script>
