<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carré Côté - Plan interactif</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eeeeee;
        }

        .plan-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 30px auto;
        }

        .plan {
            width: 100%;
            display: block;
        }

        /* PASTILLES */

.hotspot {
    position: absolute;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    border: 1px solid white;

    cursor: pointer;

    transform: translate(-50%, -50%);

    transition: transform 0.15s ease;

    z-index: 10;

    touch-action: manipulation;

    user-select: none;
    -webkit-user-select: none;
}

/* Zone invisible autour de la pastille pour faciliter le clic */
.hotspot::before {
    content: "";

    position: absolute;

    width: 30px;
    height: 30px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;
}

/* Agrandissement uniquement lorsque la souris passe dessus */
.hotspot:hover {
    transform: translate(-50%, -50%) scale(1.5);
}

/* Téléphone */
@media (max-width: 600px) {

    .hotspot {
        width: 18px;
        height: 18px;

        border-width: 2px;
    }

}

        .vasque {
            background: #4d8acb;
        }

        .wc {
            background: #d9534f;
        }

        .douche {
            background: #4caf7a;
        }

          .sol-mur {
            background: #df9629;
        }
        
        
        /* FENÊTRE D'INFORMATION */

.info-box {
    display: none;

    position: fixed;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 420px;

    /* La fenêtre ne dépassera jamais de l'écran */
    max-width: calc(100vw - 30px);
    max-height: calc(100vh - 30px);

    /* Défilement vertical si le contenu est trop long */
    overflow-y: auto;
    overflow-x: hidden;

    background: white;

    padding: 20px;

    border-radius: 12px;

    box-shadow: 0 10px 40px rgba(0,0,0,0.25);

    z-index: 1000;

    box-sizing: border-box;

    /* Améliore le défilement sur téléphone */
    -webkit-overflow-scrolling: touch;
}

@media (max-width: 600px) {

    .info-box {

        width: calc(100vw - 20px);
        max-width: calc(100vw - 20px);

        max-height: calc(100vh - 20px);

        padding: 16px;

        border-radius: 10px;

        /* Défilement vertical */
        overflow-y: auto;
        overflow-x: hidden;

        -webkit-overflow-scrolling: touch;
    }

    .info-box h2 {
        font-size: 20px;
    }

    .info-box h3 {
        font-size: 15px;
    }

    .info-box p {
        font-size: 14px;
        line-height: 1.4;
    }
}


        .info-box h2 {
            margin-top: 0;
        }

        .close {
            position: absolute;

            right: 15px;
            top: 10px;

            font-size: 24px;

            cursor: pointer;
        }

        .overlay {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.35);

            z-index: 999;
        }

    </style>
</head>

<body>
