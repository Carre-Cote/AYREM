<!DOCTYPE html>

<style>

/* =========================================================
   BASE
   ========================================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #eeeeee;

}


/* =========================================================
   VISUALISEUR
   ========================================================= */

#viewer {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #eeeeee;

    touch-action: none;

    cursor: grab;

}


#viewer.dragging {

    cursor: grabbing;

}


/* =========================================================
   PLAN
   ========================================================= */

#planLayer {

    position: absolute;

    left: 0;
    top: 0;

    transform-origin: 0 0;

    will-change: transform;

}


/* =========================================================
   IMAGE
   ========================================================= */

#plan {

    display: block;

    width: auto;
    height: auto;

    max-width: none;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;

}


/* =========================================================
   COUCHE DES PASTILLES
   ========================================================= */

#hotspotLayer {

    position: fixed;

    inset: 0;

    z-index: 100;

    pointer-events: none;

}


/* =========================================================
   PASTILLES
   ========================================================= */

.hotspot {

    position: absolute;

    /*
     * TAILLE FIXE À L'ÉCRAN
     *
     * Elle ne dépend PAS du zoom.
     */

    width: 20px !important;

    height: 20px !important;

    min-width: 20px !important;

    min-height: 20px !important;

    max-width: 20px !important;

    max-height: 20px !important;

    margin: 0;

    padding: 0;

    box-sizing: border-box;

    border-radius: 50%;

    border: 2px solid white;

    transform: translate(-50%, -50%);

    pointer-events: auto;

    cursor: pointer;

    z-index: 101;

}


/* =========================================================
   ZONE DE CLIC INVISIBLE
   ========================================================= */

.hotspot::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 46px;
    height: 46px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

}


/* =========================================================
   COULEURS
   ========================================================= */

.vasque {

    background: #4d8acb;

}


.wc {

    background: #d9534f;

}


.douche {

    background: #4caf7a;

}


.sol-mur {

    background: #df9629;

}


/* =========================================================
   SURVOL PC UNIQUEMENT
   ========================================================= */

@media (hover: hover) {

    .hotspot:hover {

        transform:
            translate(-50%, -50%)
            scale(1.3);

    }

}


/* =========================================================
   FENÊTRE D'INFORMATION
   ========================================================= */

.info-box {

    display: none;

    position: fixed;

    z-index: 1000;

    width: 450px;

    max-width:
        calc(100vw - 30px);

    max-height:
        calc(100vh - 30px);

    box-sizing: border-box;

    padding: 25px;

    background: white;

    border-radius: 12px;

    box-shadow:
        0 10px 40px

    overflow-y: auto;

    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    touch-action: pan-y;

}


/* =========================================================
   CONTENU
   ========================================================= */

.info-box h2 {

    margin-top: 0;

    padding-right: 25px;

}


.info-box h3 {

}

/* =========================================================

    width: 32px;
    height: 32px;

    line-height: 32px;

    cursor: pointer;

}


/* =========================================================
   TABLETTE
   ========================================================= */

@media (max-width: 900px) {

    .info-box {

        width: 360px;

        padding: 20px;

    }

}


/* =========================================================
   TELEPHONE

@media (max-width: 600px) {

    }


    .info-box h2 {

        font-size: 18px;

    }

        font-size: 14px;

        margin-top: 16px;

    }


    .info-box p {

        font-size: 13px;

        line-height: 1.4;

    }

}

<body>

    </div>

</div>


<!-- =========================================================

<div

<script>

/* =========================================================
   ELEMENTS
   ========================================================= */

const viewer =
    document.getElementById(
        "viewer"
    );


const planLayer =
    document.getElementById(
        "planLayer"
    );


const plan =
    document.getElementById(
        "plan"
    );


const infoBox =
    document.getElementById(
        "infoBox"
    );


const infoContent =
    document.getElementById(
        "infoContent"
    );


const closeButton =
    document.getElementById(
        "closeButton"
    );


const hotspots =
    document.querySelectorAll(
        ".hotspot"
    );


/* =========================================================
   DIMENSIONS IMAGE
   ========================================================= */

let imageWidth = 0;

let imageHeight = 0;


/* =========================================================
   ZOOM
   ========================================================= */

let scale = 1;

let offsetX = 0;

let offsetY = 0;


const MIN_SCALE = 0.05;

const MAX_SCALE = 8;


/* =========================================================
   COORDONNEES DES PASTILLES
   =========================================================

   IMPORTANT :

   Les coordonnées restent en % du PNG original.

   Tu peux donc continuer à positionner
   tes pastilles comme avant.
   ========================================================= */

const hotspotPositions = {

    vasque: {

        x: 55,
        y: 30

    },


    wc: {

        x: 58,
        y: 25

    },


    douche: {

        x: 56,
        y: 26

    },


    "sol-mur": {

        x: 58,
        y: 30

    }

};


/* =========================================================
   CHARGEMENT DU PLAN
   ========================================================= */

plan.onload = function() {


    imageWidth =
        plan.naturalWidth;


    imageHeight =
        plan.naturalHeight;


    /*
     * On conserve la résolution
     * originale du PNG.
     */

    plan.width =
        imageWidth;


    plan.height =
        imageHeight;


    fitPlan();

};


/* =========================================================
   AJUSTEMENT INITIAL
   ========================================================= */

function fitPlan() {


    const viewerWidth =
        viewer.clientWidth;


    const viewerHeight =
        viewer.clientHeight;


    const scaleX =
        viewerWidth /
        imageWidth;


    const scaleY =
        viewerHeight /
        imageHeight;


    scale =
        Math.min(
            scaleX,
            scaleY
        );


    offsetX =
        (
            viewerWidth -
            imageWidth * scale
        ) / 2;


    offsetY =
        (
            viewerHeight -
            imageHeight * scale
        ) / 2;


    updatePlan();

}


/* =========================================================
   MISE À JOUR DU PLAN
   ========================================================= */

function updatePlan() {


    planLayer.style.transform =
        "translate3d(" +
        offsetX +
        "px," +
        offsetY +
        "px,0) " +
        "scale(" +
        scale +
        ")";


    updateHotspots();

}


/* =========================================================
   MISE À JOUR DES PASTILLES
   ========================================================= */

function updateHotspots() {


    hotspots.forEach(
        function(hotspot) {


            const id =
                hotspot.dataset.id;


            const pos =
                hotspotPositions[id];


            if (!pos) {

                return;

            }


            /*
             * Position dans l'image originale.
             */

            const imageX =
                imageWidth *
                pos.x /
                100;


            const imageY =
                imageHeight *
                pos.y /
                100;


            /*
             * Position écran.
             */

            const screenX =
                offsetX +
                imageX *
                scale;


            const screenY =
                offsetY +
                imageY *
                scale;


            /*
             * La position dépend du zoom.
             *
             * La taille, elle, reste fixe
             * grâce au CSS.
             */

            hotspot.style.left =
                screenX + "px";


            hotspot.style.top =
                screenY + "px";

        }
    );

}


/* =========================================================
   ZOOM AUTOUR D'UN POINT
   ========================================================= */

function zoomAt(
    screenX,
    screenY,
    newScale
) {


    const imageX =
        (
            screenX -
            offsetX
        ) / scale;


    const imageY =
        (
            screenY -
            offsetY
        ) / scale;


    newScale =
        Math.max(
            MIN_SCALE,
            Math.min(
                MAX_SCALE,
                newScale
            )
        );


    offsetX =
        screenX -
        imageX *
        newScale;


    offsetY =
        screenY -
        imageY *
        newScale;


    scale =
        newScale;


    updatePlan();

}


/* =========================================================
   SOURIS
   ========================================================= */

let mouseDown = false;

let mouseMoved = false;

let mouseStartX = 0;

let mouseStartY = 0;

let initialOffsetX = 0;

let initialOffsetY = 0;


viewer.addEventListener(
    "mousedown",
    function(event) {


        if (
            event.button !== 0
        ) {

            return;

        }


        /*
         * Si la souris est directement
         * sur une pastille, on laisse
         * le système de clic gérer.
         */

        if (
            event.target.classList.contains(
                "hotspot"
            )
        ) {

            return;

        }


        mouseDown = true;

        mouseMoved = false;


        mouseStartX =
            event.clientX;


        mouseStartY =
            event.clientY;


        initialOffsetX =
            offsetX;


        initialOffsetY =
            offsetY;


        viewer.classList.add(
            "dragging"
        );

    }
);


/* =========================================================
   SOURIS — DEPLACEMENT
   ========================================================= */

window.addEventListener(
    "mousemove",
    function(event) {


        if (!mouseDown) {

            return;

        }


        const dx =
            event.clientX -
            mouseStartX;


        const dy =
            event.clientY -
            mouseStartY;


        if (
            Math.abs(dx) > 3 ||
            Math.abs(dy) > 3
        ) {

            mouseMoved = true;

        }


        offsetX =
            initialOffsetX +
            dx;


        offsetY =
            initialOffsetY +
            dy;


        updatePlan();

    }
);


/* =========================================================
   SOURIS — FIN
   ========================================================= */

window.addEventListener(
    "mouseup",
    function() {


        if (!mouseDown) {

            return;

        }


        mouseDown = false;


        viewer.classList.remove(
            "dragging"
        );

    }
);


/* =========================================================
   MOLETTE
   ========================================================= */

viewer.addEventListener(
    "wheel",
    function(event) {


        event.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        const factor =
            event.deltaY < 0
                ? 1.12
                : 1 / 1.12;


        zoomAt(

            x,

            y,

            scale *
            factor

        );

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH
   ========================================================= */

let touchMode = null;

let touchStartX = 0;

let touchStartY = 0;

let touchInitialOffsetX = 0;

let touchInitialOffsetY = 0;

let pinchStartDistance = 0;

let pinchStartScale = 1;

let pinchCenterX = 0;

let pinchCenterY = 0;

let touchMoved = false;


/* =========================================================
   TOUCH START
   ========================================================= */

viewer.addEventListener(
    "touchstart",
    function(event) {


        /*
         * Deux doigts :
         * PINCH
         */

        if (
            event.touches.length === 2
        ) {


            touchMode =
                "pinch";


            touchMoved =
                true;


            pinchStartDistance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            pinchStartScale =
                scale;


            const center =
                getTouchCenter(
                    event.touches[0],
                    event.touches[1]
                );


            pinchCenterX =
                center.x;


            pinchCenterY =
                center.y;


            return;

        }


        /*
         * Un doigt :
         * déplacement potentiel
         */

        if (
            event.touches.length === 1
        ) {


            touchMode =
                "drag";


            touchMoved =
                false;


            touchStartX =
                event.touches[0].clientX;


            touchStartY =
                event.touches[0].clientY;


            touchInitialOffsetX =
                offsetX;


            touchInitialOffsetY =
                offsetY;

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   TOUCH MOVE
   ========================================================= */

viewer.addEventListener(
    "touchmove",
    function(event) {


        event.preventDefault();


        /*
         * PINCH
         */

        if (
            event.touches.length === 2 &&
            touchMode === "pinch"
        ) {


            const distance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            const center =
                getTouchCenter(
                    event.touches[0],
                    event.touches[1]
                );


            const rect =
                viewer.getBoundingClientRect();


            const centerX =
                center.x -
                rect.left;


            const centerY =
                center.y -
                rect.top;


            const newScale =
                pinchStartScale *
                (
                    distance /
                    pinchStartDistance
                );


            zoomAt(

                centerX,

                centerY,

                newScale

            );


            return;

        }


        /*
         * DEPLACEMENT
         */

        if (
            event.touches.length === 1 &&
            touchMode === "drag"
        ) {


            const dx =
                event.touches[0].clientX -
                touchStartX;


            const dy =
                event.touches[0].clientY -
                touchStartY;


            if (
                Math.abs(dx) > 8 ||
                Math.abs(dy) > 8
            ) {

                touchMoved =
                    true;

            }


            offsetX =
                touchInitialOffsetX +
                dx;


            offsetY =
                touchInitialOffsetY +
                dy;


            updatePlan();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH END
   ========================================================= */

viewer.addEventListener(
    "touchend",
    function(event) {


        /*
         * Si le doigt n'a pratiquement
         * pas bougé :
         *
         * on cherche une pastille.
         */

        if (
            event.changedTouches.length === 1 &&
            !touchMoved
        ) {


            const touch =
                event.changedTouches[0];


            findHotspotAt(
                touch.clientX,
                touch.clientY
            );

        }


        /*
         * Si on revient à un seul doigt
         * après un pinch.
         */

        if (
            event.touches.length === 1
        ) {


            touchMode =
                "drag";


            touchMoved =
                true;


            touchStartX =
                event.touches[0].clientX;


            touchStartY =
                event.touches[0].clientY;


            touchInitialOffsetX =
                offsetX;


            touchInitialOffsetY =
                offsetY;


            return;

        }


        touchMode =
            null;

    }
);


/* =========================================================
   DISTANCE PINCH
   ========================================================= */

function getDistance(
    a,
    b
) {


    const dx =
        b.clientX -
        a.clientX;


    const dy =
        b.clientY -
        a.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   CENTRE PINCH
   ========================================================= */

function getTouchCenter(
    a,
    b
) {


    return {

        x:
            (
                a.clientX +
                b.clientX
            ) / 2,

        y:
            (
                a.clientY +
                b.clientY
            ) / 2

    };

}


/* =========================================================
   RECHERCHE PASTILLE
   ========================================================= */

function findHotspotAt(
    screenX,
    screenY
) {


    /*
     * Rayon tactile généreux.
     *
     * La pastille visible peut être
     * petite, mais la zone de clic
     * est beaucoup plus grande.
     */

    const hitRadius =
        30;


    let selected =
        null;


    let bestDistance =
        Infinity;


    hotspots.forEach(
        function(hotspot) {


            const id =
                hotspot.dataset.id;


            const pos =
                hotspotPositions[id];


            const imageX =
                imageWidth *
                pos.x /
                100;


            const imageY =
                imageHeight *
                pos.y /
                100;


            const hotspotX =
                offsetX +
                imageX *
                scale;


            const hotspotY =
                offsetY +
                imageY *
                scale;


            const dx =
                screenX -
                hotspotX;


            const dy =
                screenY -
                hotspotY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                hitRadius &&
                distance <
                bestDistance
            ) {


                selected =
                    id;


                bestDistance =
                    distance;

            }

        }
    );


    if (
        selected
    ) {


        showInfo(
            selected
        );

    }

}


/* =========================================================
   CLIC SOURIS DIRECT SUR PASTILLE
   ========================================================= */

hotspots.forEach(
    function(hotspot) {


        hotspot.addEventListener(
            "click",
            function(event) {


                event.stopPropagation();


                showInfo(
                    hotspot.dataset.id
                );

            }
        );

    }
);


/* =========================================================
   CONTENU DES FICHES
   ========================================================= */

function getInfoContent(
    type
) {


    if (
        type === "vasque"
    ) {


        return `

            </p>

            </p>

        `;

    }


    if (

    ) {


        return `

            <h2>WC — SDB 01</h2>

            <h3>Bâti-support</h3>

            <p>

                Modèle : XXX<br>

            </p>

            <h3>Cuvette suspendue</h3>

            <p>
                Fabricant : XXX<br>
                Modèle : XXX<br>
                Référence : XXX
            </p>

            <p>

            </p>

        `;

    }


    if (

    ) {


        return `

            <h2>Douche — SDB 01</h2>

            </p>

            <h3>Mitigeur</h3>

            <p>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Colonne de douche</h3>

            <p>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Faïence</h3>

            <p>
                Fabricant : XXX<br>

                Format : 60 × 120 cm
            </p>

        `;

    }


    if (
        type === "sol-mur"
    ) {


        return `

            <h2>Sol et mur — SDB 01</h2>

                Fabricant : XXX<br>

            </p>

            <h3>Faïence</h3>

            <p>
                Faïence douche 60 × 120 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Crédence</h3>

            <p>
                Crédence meuble vasque 10 × 10 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

        `;

    }


    return "";

}


/* =========================================================
   OUVERTURE FICHE
   ========================================================= */

function showInfo(
    type
) {


    infoContent.innerHTML =
        getInfoContent(
            type
        );


    infoBox.style.display =
        "block";


    /*
     * On centre la fiche
     * dans l'écran.
     *
     * Elle est indépendante
     * du zoom du plan.
     */

    requestAnimationFrame(
        function() {


            const width =
                infoBox.offsetWidth;


            const height =
                infoBox.offsetHeight;


            const left =
                Math.max(
                    10,
                    (
                        window.innerWidth -
                        width
                    ) / 2
                );


            const top =
                Math.max(
                    10,
                    (
                        window.innerHeight -
                        height
                    ) / 2
                );


            infoBox.style.left =
                left + "px";


            infoBox.style.top =
                top + "px";

        }
    );

}


/* =========================================================

function closeInfo() {

    infoBox.style.display =
        "none";

}


closeButton.addEventListener(

    function(event) {

        event.stopPropagation();

        closeInfo();

document.addEventListener(

        if (
            event.key === "Escape"

        }

    }

/* =========================================================

window.addEventListener(
    "resize",
    function() {

        updatePlan();


        if (
            infoBox.style.display ===
            "block"
        ) {


            const width =
                infoBox.offsetWidth;


            const height =

            infoBox.style.left =
