<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carré Côté - Plan interactif</title>


    <style>

        /* =====================================================
           PAGE
           ===================================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background: #eeeeee;

        }


        /* =====================================================
           PLAN
           ===================================================== */

        .plan-container {

            position: relative;

            width: 100%;

            max-width: 1400px;

            margin: 0 auto;

        }


        .plan {

            width: 100%;

            height: auto;

            display: block;

        }


        /* =====================================================
           PASTILLES
           ===================================================== */

        .hotspot {

            position: absolute;

            width: 1%;

            aspect-ratio: 1 / 1;

            border-radius: 50%;

            border: 1px solid white;

            cursor: pointer;

            transform:
                translate(-50%, -50%);

            transition:
                transform 0.15s ease;

            z-index: 10;

            touch-action: manipulation;

            user-select: none;

            -webkit-user-select: none;

        }


        /* Survol uniquement sur ordinateur */

        @media (hover: hover) {

            .hotspot:hover {

                transform:
                    translate(-50%, -50%)
                    scale(1.5);

            }

        }


        /* =====================================================
           COULEURS DES PASTILLES
           ===================================================== */

        .vasque {

            background: #4d8acb;

        }


        .wc {

            background: #d9534f;

        }


        .douche {

            background: #4caf7a;

        }


        .sol-mur {

            background: #df9629;

        }


        /* =====================================================
           FENÊTRE D'INFORMATION
           ===================================================== */

        .info-box {

            display: none;

            position: fixed;

            /*
             * Taille de référence.
             * Le JavaScript va ensuite compenser
             * automatiquement le zoom du navigateur.
             */
            width: 450px;

            max-width: 450px;

            /*
             * La hauteur sera également adaptée
             * dynamiquement.
             */
            max-height: 500px;

            overflow-y: auto;

            overflow-x: hidden;

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-sizing: border-box;

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.25);

            z-index: 1000;

            /*
             * Défilement fluide sur téléphone.
             */
            -webkit-overflow-scrolling: touch;

            /*
             * Autorise uniquement le défilement
             * vertical dans la fiche.
             */
            touch-action: pan-y;

        }


        /* =====================================================
           TITRES
           ===================================================== */

        .info-box h2 {

            margin-top: 0;

            padding-right: 30px;

            font-size: 22px;

        }


        .info-box h3 {

            margin-top: 20px;

            margin-bottom: 6px;

            font-size: 16px;

        }


        .info-box p {

            margin-top: 0;

            line-height: 1.5;

            font-size: 14px;

        }


        /* =====================================================
           BOUTON FERMER
           ===================================================== */

        .close {

            position: absolute;

            right: 15px;

            top: 10px;

            width: 30px;

            height: 30px;

            font-size: 25px;

            line-height: 30px;

            text-align: center;

            cursor: pointer;

            color: #333;

            z-index: 10;

            touch-action: manipulation;

        }


        /* =====================================================
           TABLETTE
           ===================================================== */

        @media (max-width: 900px) {

            .info-box {

                width: 360px;

                max-width: 360px;

                max-height: 450px;

                padding: 20px;

            }


            .info-box h2 {

                font-size: 20px;

            }


            .info-box h3 {

                font-size: 15px;

            }


            .info-box p {

                font-size: 14px;

            }

        }


        /* =====================================================
           TELEPHONE
           ===================================================== */

        @media (max-width: 600px) {

            .info-box {

                width: 280px;

                max-width: 280px;

                max-height: 400px;

                padding: 16px;

                border-radius: 10px;

            }


            .info-box h2 {

                font-size: 18px;

            }


            .info-box h3 {

                font-size: 14px;

                margin-top: 16px;

            }


            .info-box p {

                font-size: 13px;

                line-height: 1.4;

            }


            .close {

                right: 10px;

                top: 8px;

                font-size: 22px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     PLAN
     ========================================================= -->

<div class="plan-container">


    <img
        src="PCG AYREM - RDC ind2 - 2026-07-02.png"
        class="plan"
        id="plan"
        alt="Plan RDC"
    >


    <!-- =====================================================
         VASQUE
         ===================================================== -->

    <div
        class="hotspot vasque"
        style="left: 55%; top: 30%;"
        onclick="showInfo('vasque')"
        title="Vasque"
    ></div>


    <!-- =====================================================
         WC
         ===================================================== -->

    <div
        class="hotspot wc"
        style="left: 58%; top: 25%;"
        onclick="showInfo('wc')"
        title="WC"
    ></div>


    <!-- =====================================================
         DOUCHE
         ===================================================== -->

    <div
        class="hotspot douche"
        style="left: 56%; top: 26%;"
        onclick="showInfo('douche')"
        title="Douche"
    ></div>


    <!-- =====================================================
         SOL ET MUR
         ===================================================== -->

    <div
        class="hotspot sol-mur"
        style="left: 58%; top: 30%;"
        onclick="showInfo('sol-mur')"
        title="Sol et mur"
    ></div>


</div>



<!-- =========================================================
     FENÊTRE D'INFORMATION
     ========================================================= -->

<div
    class="info-box"
    id="infoBox"
>

    <span
        class="close"
        onclick="closeInfo()"
    >
        ×
    </span>


    <div id="infoContent"></div>

</div>



<script>


/* ============================================================
   CONTENU DES FICHES
   ============================================================ */

function getInfoContent(type) {

    let content = "";


    /* ========================================================
       VASQUE
       ======================================================== */

    if (type === "vasque") {

        content = `

            <h2>Vasque — SDB 01</h2>

                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Vasque</h3>

            <p>
                Vasque à poser<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Mitigeur</h3>

            <p>
                Mitigeur lavabo<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Miroir</h3>

            <p>
                Miroir 120 × 80 cm<br>
                Référence : XXX
            </p>

        `;

    }


    /* ========================================================
       WC
       ======================================================== */

    if (type === "wc") {

        content = `

            <h2>WC — SDB 01</h2>

            <h3>Bâti-support</h3>

            <p>
                Fabricant : XXX<br>
                Modèle : XXX<br>
                Référence : XXX
            </p>

            <h3>Cuvette suspendue</h3>

            <p>
                Fabricant : XXX<br>
                Modèle : XXX<br>
                Référence : XXX
            </p>

            <h3>Plaque de commande</h3>

            <p>
                Fabricant : XXX<br>
                Modèle : XXX<br>
                Finition : XXX
            </p>

        `;

    }


    /* ========================================================
       DOUCHE
       ======================================================== */

    if (type === "douche") {

        content = `

            <h2>Douche — SDB 01</h2>

            <h3>Receveur</h3>

            <p>
                Receveur 120 × 90 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Mitigeur</h3>

            <p>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Colonne de douche</h3>

            <p>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Faïence</h3>

            <p>
                Fabricant : XXX<br>
                Référence : XXX<br>
                Format : 60 × 120 cm
            </p>

        `;

    }


    /* ========================================================
       SOL ET MUR
       ======================================================== */

    if (type === "sol-mur") {

        content = `

            <h2>Sol et mur — SDB 01</h2>

            <h3>Carrelage</h3>

            <p>
                Carrelage 60 × 60 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Faïence</h3>

            <p>
                Faïence douche 60 × 120 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

            <h3>Crédence</h3>

            <p>
                Crédence meuble vasque 10 × 10 cm<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

        `;

    }


    return content;

}



/* ============================================================
   OBTENIR LE NIVEAU DE ZOOM DU NAVIGATEUR
   ============================================================ */

function getBrowserZoom() {

    /*
     * visualViewport.scale donne le niveau
     * de zoom visuel sur les navigateurs
     * mobiles modernes.
     */

    if (window.visualViewport) {

        return window.visualViewport.scale || 1;

    }


    /*
     * Valeur de secours.
     */

    return 1;

}



/* ============================================================
   DIMENSIONS DE BASE DE LA FICHE
   ============================================================ */

function getInfoDimensions() {


    const screenWidth =
        document.documentElement.clientWidth;


    const screenHeight =
        document.documentElement.clientHeight;


    /*
     * Taille souhaitée selon l'écran.
     */

    let width;
    let height;


    if (screenWidth <= 600) {

        width = 280;

        height =
            Math.min(
                400,
                screenHeight - 20
            );

    }

    else if (screenWidth <= 900) {

        width = 360;

        height =
            Math.min(
                450,
                screenHeight - 30
            );

    }

    else {

        width = 450;

        height =
            Math.min(
                500,
                screenHeight - 30
            );

    }


    return {
        width: width,
        height: height
    };

}



/* ============================================================
   OUVERTURE DE LA FICHE
   ============================================================ */

function showInfo(type) {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    const infoContent =
        document.getElementById(
            "infoContent"
        );


    /*
     * Contenu
     */

    infoContent.innerHTML =
        getInfoContent(type);


    /*
     * Niveau de zoom actuel
     */

    const zoom =
        getBrowserZoom();


    /*
     * Dimensions souhaitées
     * pour l'utilisateur.
     */

    const dimensions =
        getInfoDimensions();


    /*
     * Compensation du zoom.
     *
     * Exemple :
     *
     * zoom navigateur = 2
     *
     * largeur souhaitée = 280 px
     *
     * largeur CSS appliquée = 140 px
     *
     * Après le zoom ×2 :
     *
     * 140 × 2 = 280 px
     *
     * La fiche conserve donc
     * une taille physique normale.
     */

    const cssWidth =
        dimensions.width / zoom;


    const cssHeight =
        dimensions.height / zoom;


    /*
     * Application des dimensions.
     */

    infoBox.style.width =
        cssWidth + "px";


    infoBox.style.maxWidth =
        cssWidth + "px";


    infoBox.style.maxHeight =
        cssHeight + "px";


    /*
     * Affichage.
     */

    infoBox.style.display =
        "block";


    /*
     * Positionnement.
     */

    positionInfoBox();

}



/* ============================================================
   POSITIONNEMENT
   ============================================================ */

function positionInfoBox() {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    /*
     * Niveau de zoom.
     */

    const zoom =
        getBrowserZoom();


    /*
     * Dimensions réelles CSS.
     */

    const boxWidth =
        infoBox.offsetWidth;


    const boxHeight =
        infoBox.offsetHeight;


    /*
     * Dimensions visuelles
     * du viewport.
     */

    let viewportWidth =
        window.innerWidth;


    let viewportHeight =
        window.innerHeight;


    /*
     * Sur les navigateurs mobiles,
     * visualViewport donne la partie
     * réellement visible.
     */

    if (window.visualViewport) {

        viewportWidth =
            window.visualViewport.width;


        viewportHeight =
            window.visualViewport.height;

    }


    /*
     * La largeur/hauteur retournée par
     * visualViewport est exprimée dans
     * les coordonnées CSS.
     */

    let left =
        (
            viewportWidth -
            boxWidth
        ) / 2;


    let top =
        (
            viewportHeight -
            boxHeight
        ) / 2;


    /*
     * Décalage éventuel du viewport
     * lors du zoom.
     */

    if (window.visualViewport) {

        left +=
            window.visualViewport.offsetLeft;


        top +=
            window.visualViewport.offsetTop;

    }


    /*
     * Marges.
     */

    const margin =
        10 / zoom;


    /*
     * Sécurité horizontale.
     */

    if (
        left <
        margin
    ) {

        left =
            margin;

    }


    if (
        left +
        boxWidth >
        viewportWidth -
        margin
    ) {

        left =
            viewportWidth -
            boxWidth -
            margin;

    }


    /*
     * Sécurité verticale.
     */

    if (
        top <
        margin
    ) {

        top =
            margin;

    }


    if (
        top +
        boxHeight >
        viewportHeight -
        margin
    ) {

        top =
            viewportHeight -
            boxHeight -
            margin;

    }


    /*
     * Position finale.
     */

    infoBox.style.left =
        left + "px";


    infoBox.style.top =
        top + "px";

}



/* ============================================================
   FERMETURE
   ============================================================ */

function closeInfo() {


    document.getElementById(
        "infoBox"
    ).style.display =
        "none";

}



/* ============================================================
   ADAPTATION AU ZOOM
   ============================================================ */

if (window.visualViewport) {


    window.visualViewport.addEventListener(
        "resize",
        function() {


            const infoBox =
                document.getElementById(
                    "infoBox"
                );


            /*
             * Si la fiche est ouverte,
             * on recalcule sa taille.
             */

            if (
                infoBox.style.display ===
                "block"
            ) {

                /*
                 * On récupère le contenu actuel.
                 * Il n'est pas modifié.
                 */

                const zoom =
                    getBrowserZoom();


                const dimensions =
                    getInfoDimensions();


                infoBox.style.width =
                    (
                        dimensions.width /
                        zoom
                    ) + "px";


                infoBox.style.maxWidth =
                    (
                        dimensions.width /
                        zoom
                    ) + "px";


                infoBox.style.maxHeight =
                    (
                        dimensions.height /
                        zoom
                    ) + "px";


                positionInfoBox();

            }

        }
    );

}



/* ============================================================
   REDIMENSIONNEMENT CLASSIQUE
   ============================================================ */

window.addEventListener(
    "resize",
    function() {


        const infoBox =
            document.getElementById(
                "infoBox"
            );


        if (
            infoBox.style.display ===
            "block"
        ) {

            const zoom =
                getBrowserZoom();


            const dimensions =
                getInfoDimensions();


            infoBox.style.width =
                (
                    dimensions.width /
                    zoom
                ) + "px";


            infoBox.style.maxWidth =
                (
                    dimensions.width /
                    zoom
                ) + "px";


            infoBox.style.maxHeight =
                (
                    dimensions.height /
                    zoom
                ) + "px";


            positionInfoBox();

        }

    }
);


</script>


</body>

</html>
