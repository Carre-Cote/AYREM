<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Carré Côté - Plan interactif</title>


<style>

/* =========================================================
   BASE
   ========================================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #eeeeee;

}


/* =========================================================
   VISUALISEUR
   ========================================================= */

#viewer {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #eeeeee;

    touch-action: none;

    cursor: grab;

}


#viewer.dragging {

    cursor: grabbing;

}


/* =========================================================
   PLAN
   ========================================================= */

#planLayer {

    position: absolute;

    left: 0;
    top: 0;

    transform-origin: 0 0;

    will-change: transform;

}


/* =========================================================
   IMAGE
   ========================================================= */

#plan {

    display: block;

    width: auto;
    height: auto;

    max-width: none;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;

}


/* =========================================================
   COUCHE DES PASTILLES
   ========================================================= */

#hotspotLayer {

    position: fixed;

    inset: 0;

    z-index: 100;

    pointer-events: none;

}


/* =========================================================
   PASTILLES
   ========================================================= */

.hotspot {
    position: absolute;

    width: 24px !important;
    height: 24px !important;

    min-width: 24px !important;
    min-height: 24px !important;

    max-width: 24px !important;
    max-height: 24px !important;

    margin: 0;
    padding: 0;

    box-sizing: border-box;

    border-radius: 50%;

    border: 2px solid white;

    transform: translate(-50%, -50%);

    pointer-events: auto;

    cursor: pointer;

    z-index: 101;
}


/* Zone tactile invisible */

.hotspot::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 50px;
    height: 50px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

}


/* Survol uniquement sur PC */

@media (hover: hover) {

    .hotspot:hover {

        transform:
            translate(-50%, -50%)
            scale(1.3);

    }

}


/* Téléphone */

@media (max-width: 600px) {

    .hotspot {

        width: 22px !important;
        height: 22px !important;

        min-width: 22px !important;
        min-height: 22px !important;

        max-width: 22px !important;
        max-height: 22px !important;

        border-width: 1px;

    }

    .hotspot::before {

        width: 50px;
        height: 50px;

    }

}


/* =========================================================
   ZONE DE CLIC INVISIBLE
   ========================================================= */

.hotspot::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 50px;
    height: 50px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

}


/* =========================================================
   SURVOL PC
   ========================================================= */

@media (hover: hover) {

    .hotspot:hover {

        transform:
            translate(-50%, -50%)
            scale(1.3);

    }

}


/* =========================================================
   FENÊTRE D'INFORMATION
   ========================================================= */

.info-box {

    display: none;

    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 1000;

    /* Taille indépendante du zoom du plan */
    width: min(650px, 90vw);

    height: auto;

    max-height: 85vh;

    box-sizing: border-box;

    padding: 30px;

    background: #ffffff;

    border-radius: 14px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.30);

    overflow-y: auto;

    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    touch-action: pan-y;

}


/* =========================================================
   CONTENU
   ========================================================= */

.info-box h2 {

    margin-top: 0;

    margin-bottom: 25px;

    padding-right: 35px;

    font-size: 24px;

}


.info-box h3 {

    margin-top: 22px;

    margin-bottom: 7px;

    font-size: 17px;

}


.info-box p {

    margin-top: 0;

    margin-bottom: 14px;

    line-height: 1.5;

    font-size: 15px;

}


/* =========================================================
   BOUTON FERMER
   ========================================================= */

.close {

    position: absolute;

    right: 12px;
    top: 8px;

    width: 36px;
    height: 36px;

    line-height: 36px;

    text-align: center;

    font-size: 28px;

    cursor: pointer;

    z-index: 10;

}


/* =========================================================
   TABLETTE
   ========================================================= */

@media (max-width: 900px) {

    .info-box {

        width: 80vw;

        max-width: 80vw;

        max-height: 80vh;

        padding: 24px;

    }

}


/* =========================================================
   TELEPHONE
   ========================================================= */

@media (max-width: 600px) {

    .info-box {

        width: 88vw;

        max-width: 88vw;

        max-height: 75vh;

        padding: 18px;

        border-radius: 11px;

    }


    .info-box h2 {

        font-size: 19px;

        margin-bottom: 18px;

    }


    .info-box h3 {

        font-size: 15px;

        margin-top: 17px;

    }


    .info-box p {

        font-size: 13px;

        line-height: 1.45;

    }


    .close {

        right: 8px;

        top: 5px;

        font-size: 25px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     VISUALISEUR
     ========================================================= -->

<div id="viewer">


    <div id="planLayer">

        <img
            id="plan"
            src="PCG AYREM - RDC ind2 - 2026-07-02.png"
            alt="Plan RDC"
            draggable="false"
        >

    </div>


    <!--
        LES PASTILLES SONT CRÉÉES AUTOMATIQUEMENT
        PAR JAVASCRIPT
    -->

    <div id="hotspotLayer"></div>

</div>


<!-- =========================================================
     FENÊTRE D'INFORMATION
     ========================================================= -->

<div
    class="info-box"
    id="infoBox"
>

    <span
        class="close"
        id="closeButton"
    >
        ×
    </span>


    <div id="infoContent"></div>

</div>


<script>

/* =========================================================
   CONFIGURATION DES PIÈCES
   =========================================================

   C'EST PRINCIPALEMENT ICI QUE TU TRAVAILLERAS.

   Pour ajouter une pièce :

   "nom-interne": {

       name: "Nom affiché",
       x: XX,
       y: XX,
       color: "#XXXXXX"

   }

   x et y correspondent à la position en %
   sur ton image originale.

   ========================================================= */


const rooms = {

    "entree-service": {
        name: "Entrée de service",
        x: 50,
        y: 52,
        color: "#6f42c1",

         content: `

            <h2>Entrée de service</h2>

            <h3>Sol</h3>

            <p>
                Carrelage XXX<br>
                Fabricant : XXX<br>
                Référence : XXX
            </p>

        `
    },

    "salle-sport": {
        name: "Salle de sport / Salle de jeux",
        x: 50,
        y: 35,
        color: "#e83e8c"
    },

    "cellier": {
        name: "Cellier",
        x: 63,
        y: 53,
        color: "#17a2b8"
    },

    "laverie": {
        name: "Laverie",
        x: 64,
        y: 48,
        color: "#20c997"
    },

    "local-technique": {
        name: "Local technique",
        x: 65,
        y: 40,
        color: "#6c757d"
    },

    "salle-eau-7": {
        name: "Salle d'eau 7",
        x: 57,
        y: 27,
        color: "#fd7e14"
    },

    /* AJOUTE TES NOUVELLES PIÈCES ICI en rajoutant une virgule après } de la pièce précédente */

    "dgt-1": {
        name: "Dgt 1",
        x: 56,
        y: 40,
        color: "#d3e417"
    },

    "dortoir": {
        name: "Dortoir",
        x: 63,
        y: 30,
        color: "#e43917"
    },

    "garage": {
        name: "Garage",
        x: 55,
        y: 63,
        color: "#79e70d"
    },

};


/* =========================================================
   ELEMENTS
   ========================================================= */

const viewer =
    document.getElementById(
        "viewer"
    );


const planLayer =
    document.getElementById(
        "planLayer"
    );


const plan =
    document.getElementById(
        "plan"
    );


const hotspotLayer =
    document.getElementById(
        "hotspotLayer"
    );


const infoBox =
    document.getElementById(
        "infoBox"
    );


const infoContent =
    document.getElementById(
        "infoContent"
    );


const closeButton =
    document.getElementById(
        "closeButton"
    );


/* =========================================================
   DIMENSIONS IMAGE
   ========================================================= */

let imageWidth = 0;

let imageHeight = 0;


/* =========================================================
   ZOOM / POSITION
   ========================================================= */

let scale = 1;

let offsetX = 0;

let offsetY = 0;


const MIN_SCALE =
    0.05;


const MAX_SCALE =
    8;


/* =========================================================
   CRÉATION AUTOMATIQUE DES PASTILLES
   ========================================================= */

const hotspotElements = {};


function createHotspots() {


    Object.keys(rooms).forEach(
        function(id) {


            const room =
                rooms[id];


            const hotspot =
                document.createElement(
                    "div"
                );


            hotspot.className =
                "hotspot";


            hotspot.dataset.id =
                id;


            hotspot.title =
                room.name;


            hotspot.style.backgroundColor =
                room.color;


            hotspotLayer.appendChild(
                hotspot
            );


            hotspotElements[id] =
                hotspot;


            /*
             * Clic souris
             */

            hotspot.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();

                    showInfo(id);

                }
            );

        }
    );

}


/* =========================================================
   CHARGEMENT IMAGE
   ========================================================= */

plan.onload =
    function() {


        imageWidth =
            plan.naturalWidth;


        imageHeight =
            plan.naturalHeight;


        /*
         * On utilise la résolution
         * originale du PNG.
         */

        plan.width =
            imageWidth;


        plan.height =
            imageHeight;


        createHotspots();

        fitPlan();

    };


/* =========================================================
   AJUSTEMENT INITIAL
   ========================================================= */

function fitPlan() {


    const viewerWidth =
        viewer.clientWidth;


    const viewerHeight =
        viewer.clientHeight;


    const scaleX =
        viewerWidth /
        imageWidth;


    const scaleY =
        viewerHeight /
        imageHeight;


    scale =
        Math.min(
            scaleX,
            scaleY
        );


    offsetX =
        (
            viewerWidth -
            imageWidth *
            scale
        ) / 2;


    offsetY =
        (
            viewerHeight -
            imageHeight *
            scale
        ) / 2;


    updatePlan();

}


/* =========================================================
   MISE À JOUR PLAN
   ========================================================= */

function updatePlan() {


    planLayer.style.transform =
        "translate3d(" +
        offsetX +
        "px," +
        offsetY +
        "px,0) " +
        "scale(" +
        scale +
        ")";


    updateHotspots();

}


/* =========================================================
   POSITION DES PASTILLES
   ========================================================= */

function updateHotspots() {


    Object.keys(rooms).forEach(
        function(id) {


            const room =
                rooms[id];


            const hotspot =
                hotspotElements[id];


            if (!hotspot) {

                return;

            }


            /*
             * Coordonnées sur l'image
             */

            const imageX =
                imageWidth *
                room.x /
                100;


            const imageY =
                imageHeight *
                room.y /
                100;


            /*
             * Coordonnées écran
             */

            const screenX =
                offsetX +
                imageX *
                scale;


            const screenY =
                offsetY +
                imageY *
                scale;


            hotspot.style.left =
                screenX + "px";


            hotspot.style.top =
                screenY + "px";

        }
    );

}


/* =========================================================
   ZOOM AUTOUR DU CURSEUR / DOIGT
   ========================================================= */

function zoomAt(
    screenX,
    screenY,
    newScale
) {


    const imageX =
        (
            screenX -
            offsetX
        ) / scale;


    const imageY =
        (
            screenY -
            offsetY
        ) / scale;


    newScale =
        Math.max(
            MIN_SCALE,
            Math.min(
                MAX_SCALE,
                newScale
            )
        );


    offsetX =
        screenX -
        imageX *
        newScale;


    offsetY =
        screenY -
        imageY *
        newScale;


    scale =
        newScale;


    updatePlan();

}


/* =========================================================
   SOURIS
   ========================================================= */

let mouseDown =
    false;


let mouseStartX =
    0;


let mouseStartY =
    0;


let initialOffsetX =
    0;


let initialOffsetY =
    0;


/* ---------------------------------------------------------
   SOURIS — DOWN
   --------------------------------------------------------- */

viewer.addEventListener(
    "mousedown",
    function(event) {


        if (
            event.button !== 0
        ) {

            return;

        }


        if (
            event.target.closest(
                ".hotspot"
            )
        ) {

            return;

        }


        mouseDown =
            true;


        mouseStartX =
            event.clientX;


        mouseStartY =
            event.clientY;


        initialOffsetX =
            offsetX;


        initialOffsetY =
            offsetY;


        viewer.classList.add(
            "dragging"
        );

    }
);


/* ---------------------------------------------------------
   SOURIS — MOVE
   --------------------------------------------------------- */

window.addEventListener(
    "mousemove",
    function(event) {


        if (!mouseDown) {

            return;

        }


        offsetX =
            initialOffsetX +
            (
                event.clientX -
                mouseStartX
            );


        offsetY =
            initialOffsetY +
            (
                event.clientY -
                mouseStartY
            );


        updatePlan();

    }
);


/* ---------------------------------------------------------
   SOURIS — UP
   --------------------------------------------------------- */

window.addEventListener(
    "mouseup",
    function() {


        mouseDown =
            false;


        viewer.classList.remove(
            "dragging"
        );

    }
);


/* =========================================================
   MOLETTE
   ========================================================= */

viewer.addEventListener(
    "wheel",
    function(event) {


        event.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        const factor =
            event.deltaY < 0
                ? 1.12
                : 1 / 1.12;


        zoomAt(

            x,

            y,

            scale *
            factor

        );

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH
   ========================================================= */

let touchMode =
    null;


let touchStartX =
    0;


let touchStartY =
    0;


let touchInitialOffsetX =
    0;


let touchInitialOffsetY =
    0;


let pinchStartDistance =
    0;


let pinchStartScale =
    1;


let touchMoved =
    false;


/* =========================================================
   TOUCH START
   ========================================================= */

viewer.addEventListener(
    "touchstart",
    function(event) {


        if (
            event.touches.length === 2
        ) {


            touchMode =
                "pinch";


            touchMoved =
                true;


            pinchStartDistance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            pinchStartScale =
                scale;


            return;

        }


        if (
            event.touches.length === 1
        ) {


            touchMode =
                "drag";


            touchMoved =
                false;


            touchStartX =
                event.touches[0].clientX;


            touchStartY =
                event.touches[0].clientY;


            touchInitialOffsetX =
                offsetX;


            touchInitialOffsetY =
                offsetY;

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   TOUCH MOVE
   ========================================================= */

viewer.addEventListener(
    "touchmove",
    function(event) {


        event.preventDefault();


        /*
         * PINCH
         */

        if (
            event.touches.length === 2 &&
            touchMode === "pinch"
        ) {


            const distance =
                getDistance(
                    event.touches[0],
                    event.touches[1]
                );


            const centerX =
                (
                    event.touches[0].clientX +
                    event.touches[1].clientX
                ) / 2;


            const centerY =
                (
                    event.touches[0].clientY +
                    event.touches[1].clientY
                ) / 2;


            const rect =
                viewer.getBoundingClientRect();


            const newScale =
                pinchStartScale *
                (
                    distance /
                    pinchStartDistance
                );


            zoomAt(

                centerX -
                rect.left,

                centerY -
                rect.top,

                newScale

            );


            return;

        }


        /*
         * DÉPLACEMENT
         */

        if (
            event.touches.length === 1 &&
            touchMode === "drag"
        ) {


            const dx =
                event.touches[0].clientX -
                touchStartX;


            const dy =
                event.touches[0].clientY -
                touchStartY;


            if (
                Math.abs(dx) > 8 ||
                Math.abs(dy) > 8
            ) {

                touchMoved =
                    true;

            }


            offsetX =
                touchInitialOffsetX +
                dx;


            offsetY =
                touchInitialOffsetY +
                dy;


            updatePlan();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH END
   ========================================================= */

viewer.addEventListener(
    "touchend",
    function(event) {


        /*
         * Si le doigt n'a presque pas bougé,
         * on considère qu'il s'agit d'un clic
         * sur une pastille.
         */

        if (
            event.changedTouches.length === 1 &&
            !touchMoved
        ) {


            const touch =
                event.changedTouches[0];


            findHotspotAt(

                touch.clientX,

                touch.clientY

            );

        }


        if (
            event.touches.length === 1
        ) {


            touchMode =
                "drag";


            touchMoved =
                true;


            touchStartX =
                event.touches[0].clientX;


            touchStartY =
                event.touches[0].clientY;


            touchInitialOffsetX =
                offsetX;


            touchInitialOffsetY =
                offsetY;


        }
        else {


            touchMode =
                null;

        }

    }
);


/* =========================================================
   DISTANCE ENTRE DEUX DOIGTS
   ========================================================= */

function getDistance(
    a,
    b
) {


    const dx =
        b.clientX -
        a.clientX;


    const dy =
        b.clientY -
        a.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   RECHERCHE DE PASTILLE
   ========================================================= */

function findHotspotAt(
    screenX,
    screenY
) {


    const hitRadius =
        30;


    let selected =
        null;


    let bestDistance =
        Infinity;


    Object.keys(rooms).forEach(
        function(id) {


            const room =
                rooms[id];


            const imageX =
                imageWidth *
                room.x /
                100;


            const imageY =
                imageHeight *
                room.y /
                100;


            const hotspotX =
                offsetX +
                imageX *
                scale;


            const hotspotY =
                offsetY +
                imageY *
                scale;


            const dx =
                screenX -
                hotspotX;


            const dy =
                screenY -
                hotspotY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                hitRadius &&
                distance <
                bestDistance
            ) {


                selected =
                    id;


                bestDistance =
                    distance;

            }

        }
    );


    if (
        selected
    ) {

        showInfo(
            selected
        );

    }

}



function getInfoContent(id) {

    const room = rooms[id];

    if (!room) {
        return "<p>Informations indisponibles.</p>";
    }

    return room.content || `
        <h2>${room.name}</h2>
        <p>Aucune information renseignée pour cette pièce.</p>
    `;

}


/* =========================================================
   OUVERTURE FICHE
   ========================================================= */

function showInfo(id) {

    infoContent.innerHTML =
        getInfoContent(id);

    infoBox.style.display =
        "block";

}


/* =========================================================
   FERMETURE
   ========================================================= */

function closeInfo() {

    infoBox.style.display =
        "none";

}


closeButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        closeInfo();

    }
);


/* =========================================================
   TOUCHE ECHAP
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Escape"
        ) {

            closeInfo();

        }

    }
);


/* =========================================================
   REDIMENSIONNEMENT
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        updatePlan();

    }
);

</script>

</body>

</html>
