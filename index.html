<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <!--
        IMPORTANT :
        On laisse le navigateur gérer naturellement
        le zoom avec les doigts sur téléphone.
    -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carré Côté - Plan interactif</title>


    <style>

        /* =====================================================
           PAGE
           ===================================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background: #eeeeee;

        }


        /* =====================================================
           CONTENEUR DU PLAN
           ===================================================== */

        .plan-container {

            position: relative;

            width: 100%;

            max-width: 1400px;

            margin: 0 auto;

        }


        /* =====================================================
           IMAGE DU PLAN
           ===================================================== */

        .plan {

            width: 100%;

            height: auto;

            display: block;

        }


        /* =====================================================
           PASTILLES
           ===================================================== */

        .hotspot {

            position: absolute;

            width: 1%;

            aspect-ratio: 1 / 1;

            border-radius: 50%;

            border: 1px solid white;

            cursor: pointer;

            transform:
                translate(-50%, -50%);

            transition:
                transform 0.15s ease;

            z-index: 10;

            /*
             * Facilite le clic tactile
             * sans modifier la taille visible.
             */
            touch-action: manipulation;

            user-select: none;

            -webkit-user-select: none;

        }


        /* =====================================================
           SURVOL UNIQUEMENT SUR ORDINATEUR
           ===================================================== */

        @media (hover: hover) {

            .hotspot:hover {

                transform:
                    translate(-50%, -50%)
                    scale(1.5);

            }

        }


        /* =====================================================
           COULEURS DES PASTILLES
           ===================================================== */

        .vasque {

            background: #4d8acb;

        }


        .wc {

            background: #d9534f;

        }


        .douche {

            background: #4caf7a;

        }


        .sol-mur {

            background: #df9629;

        }


        /* =====================================================
           FENÊTRE D'INFORMATION
           ===================================================== */

        .info-box {

            display: none;

            position: fixed;

            /*
             * Taille confortable sur ordinateur
             */
            width: 450px;

            /*
             * Sécurité pour les petits écrans
             */
            max-width:
                calc(100vw - 30px);

            /*
             * La fiche peut être longue,
             * mais reste toujours dans l'écran.
             */
            max-height:
                calc(100vh - 30px);

            overflow-y: auto;

            overflow-x: hidden;

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.25);

            box-sizing: border-box;

            z-index: 1000;

            /*
             * Permet un défilement fluide
             * de la fiche sur téléphone.
             */
            -webkit-overflow-scrolling: touch;

            /*
             * Important :
             * la fiche peut être scrollée
             * indépendamment du plan.
             */
            touch-action: pan-y;

        }


        /* =====================================================
           TITRES
           ===================================================== */

        .info-box h2 {

            margin-top: 0;

            padding-right: 30px;

            font-size: 22px;

        }


        .info-box h3 {

            margin-top: 20px;

            margin-bottom: 6px;

            font-size: 16px;

        }


        .info-box p {

            margin-top: 0;

            line-height: 1.5;

            font-size: 14px;

        }


        /* =====================================================
           BOUTON FERMER
           ===================================================== */

        .close {

            position: absolute;

            right: 15px;

            top: 10px;

            width: 30px;

            height: 30px;

            font-size: 25px;

            line-height: 30px;

            text-align: center;

            cursor: pointer;

            color: #333;

            z-index: 10;

            touch-action: manipulation;

        }


        /* =====================================================
           TABLETTE
           ===================================================== */

        @media (max-width: 900px) {

            .info-box {

                width: 360px;

                max-width:
                    calc(100vw - 30px);

                max-height:
                    calc(100vh - 30px);

                padding: 20px;

            }


            .info-box h2 {

                font-size: 20px;

            }


            .info-box h3 {

                font-size: 15px;

            }


            .info-box p {

                font-size: 14px;

            }

        }


        /* =====================================================
           TELEPHONE
           ===================================================== */

        @media (max-width: 600px) {

            .info-box {

                /*
                 * On ne prend surtout PAS toute la largeur.
                 *
                 * La fiche reste une petite fenêtre
                 * flottante au-dessus du plan.
                 */
                width: 280px;

                max-width:
                    calc(100vw - 20px);

                /*
                 * Limite verticale.
                 * Si le contenu est plus long :
                 * défilement vertical.
                 */
                max-height:
                    calc(100vh - 20px);

                padding: 16px;

                border-radius: 10px;

            }


            .info-box h2 {

                font-size: 18px;

            }


            .info-box h3 {

                font-size: 14px;

                margin-top: 16px;

            }


            .info-box p {

                font-size: 13px;

                line-height: 1.4;

            }


            .close {

                right: 10px;

                top: 8px;

                font-size: 22px;

            }

        }


    </style>

</head>


<body>


<!-- =========================================================
     PLAN
     ========================================================= -->

<div class="plan-container">


    <img
        src="PCG AYREM - RDC ind2 - 2026-07-02.png"
        class="plan"
        id="plan"
        alt="Plan RDC"
    >


    <!-- =====================================================
         VASQUE
         ===================================================== -->

    <div
        class="hotspot vasque"
        style="left: 55%; top: 30%;"
        onclick="showInfo('vasque')"
        title="Vasque"
    ></div>


    <!-- =====================================================
         WC
         ===================================================== -->

    <div
        class="hotspot wc"
        style="left: 58%; top: 25%;"
        onclick="showInfo('wc')"
        title="WC"
    ></div>


    <!-- =====================================================
         DOUCHE
         ===================================================== -->

    <div
        class="hotspot douche"
        style="left: 56%; top: 26%;"
        onclick="showInfo('douche')"
        title="Douche"
    ></div>


    <!-- =====================================================
         SOL ET MUR
         ===================================================== -->

    <div
        class="hotspot sol-mur"
        style="left: 58%; top: 30%;"
        onclick="showInfo('sol-mur')"
        title="Sol et mur"
    ></div>


</div>



<!-- =========================================================
     FENÊTRE D'INFORMATION
     ========================================================= -->

<div
    class="info-box"
    id="infoBox"
>


    <span
        class="close"
        onclick="closeInfo()"
    >
        ×
    </span>


    <div id="infoContent"></div>


</div>



<script>

/* ============================================================
   OUVERTURE DE LA FICHE
   ============================================================ */

function showInfo(type) {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    const infoContent =
        document.getElementById(
            "infoContent"
        );


    /*
     * Chargement du contenu
     */

    infoContent.innerHTML =
        getInfoContent(type);


    /*
     * Affichage
     */

    infoBox.style.display =
        "block";


    /*
     * On positionne la fiche.
     */

    positionInfoBox();

}



/* ============================================================
   POSITIONNEMENT DE LA FICHE
   ============================================================ */

function positionInfoBox() {


    const infoBox =
        document.getElementById(
            "infoBox"
        );


    /*
     * Dimensions visibles de l'écran.
     */

    const viewportWidth =
        document.documentElement.clientWidth;


    const viewportHeight =
        document.documentElement.clientHeight;


    /*
     * Dimensions de la fiche.
     */

    const boxWidth =
        infoBox.offsetWidth;


    const boxHeight =
        infoBox.offsetHeight;


    /*
     * Centrage de la fiche.
     *
     * IMPORTANT :
     * la fiche est indépendante du plan.
     *
     * Donc même si le plan est zoomé,
     * la fiche conserve sa taille.
     */

    let left =
        (
            viewportWidth -
            boxWidth
        ) / 2;


    let top =
        (
            viewportHeight -
            boxHeight
        ) / 2;


    /*
     * Marges de sécurité.
     */

    const margin = 10;


    /*
     * Empêche la fiche de sortir
     * horizontalement.
     */

    if (
        left < margin
    ) {

        left = margin;

    }


    if (
        left +
        boxWidth >
        viewportWidth -
        margin
    ) {

        left =
            viewportWidth -
            boxWidth -
            margin;

    }


    /*
     * Empêche la fiche de sortir
     * verticalement.
     */

    if (
        top < margin
    ) {

        top = margin;

    }


    if (
        top +
        boxHeight >
        viewportHeight -
        margin
    ) {

        top =
            viewportHeight -
            boxHeight -
            margin;

    }


    /*
     * Application.
     */

    infoBox.style.left =
        left + "px";


    infoBox.style.top =
        top + "px";

}



/* ============================================================
   FERMETURE DE LA FICHE
   ============================================================ */

function closeInfo() {


    document.getElementById(
        "infoBox"
    ).style.display =
        "none";

}



/* ============================================================
   REPOSITIONNEMENT SI LA FENÊTRE CHANGE
   ============================================================ */

window.addEventListener(
    "resize",
    function() {


        const infoBox =
            document.getElementById(
                "infoBox"
            );


        if (
            infoBox.style.display ===
            "block"
        ) {

            positionInfoBox();

        }

    }
);


</script>


</body>

</html>
